PYQ.register("2012", {"id":"2012","year":2012,"title":"Civil Services (Preliminary) Examination 2012","paper":"General Studies Paper I","series":"A","durationMin":120,"type":"text","key":"bacabbdcbcdaacbbcbaacbccdacbbbbacdaccccdccaabaddcacaacdcabcaddbccabadbabcbdbcdbcdccbccbcdbdabcaabbab","keyNote":"Official answer key released by UPSC.","questions":[{"n":1,"text":"In the areas covered under the Panchayat (Extension to the Scheduled Areas) Act, 1996, what is the role/power of Gram Sabha?\n1. Gram Sabha has the power to prevent alienation of land in the Scheduled Areas.\n2. Gram Sabha has the ownership of minor forest produce.\n3. Recommendation of Gram Sabha is required for granting prospecting licence or mining lease for any mineral in the Scheduled Areas.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"1 and 2 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":2,"text":"In the Parliament of India, the purpose of an adjournment motion 18:","options":{"a":"to allow a discussion on a definite matter of urgent public importance","b":"to let opposition members collect information from the ‘ministers","c":"to allow a reduction of specific amount in-demand for grant","d":"to postpone the proceedings to check the inappropriate or violent behavior.on the part of somMe members"},"s":"polity","ca":false,"f":"Direct"},{"n":3,"text":"How does National Biodiversity Authority (NBA) help in protecting the indian agriculture ?; I, NBA checks the biopiracy and protects the indigenous -and w.* ~traditional: genetic resources, P- / SOA ey 2;. NBA. directly monitors and supervises the scientific research. on genetic modification of crop plants.\n3. Application. for ImteHeciual Property.. Rights related to genetic ? biological resources cannot be made without the approval of NBA,\nWhich .of the statements given above is/are: correct ?","options":{"a":"1. privy","b":"2-and 3 only","c":"1 and 3 only","d":"i, 2 and 3"},"s":"geography","ca":false,"f":"Direct"},{"n":4,"text":"The National Green Tribunal Act, 2010 was enacted in consonance with which of the following provisions of the Constitution of India?\n1. Right to healthy environment, construed as a part of Right to life under Article 21\n2. Provision of grants for raising the level of administration in the Scheduled Areas for the welfare of Scheduled Tribes under Article 275(1)\n3. Powers and functions of Gram Sabha as mentioned under Article 243(A)\nSelect the correct answer using the codes given below :","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":true,"f":"Multiple statements"},{"n":5,"text":"If National Water Mission is properly and completely implemented, how will it impact the country?\n1. Part of the water needs of urban areas will be met through recycling of waste-water.\n2. The water requirements of coastal cities with inadequate alternative sources of water will be met by adopting appropriate technologies that allow for the use of ocean water.\n3. All the rivers of Himalayan origin will be linked to the rivers of peninsular India.\n4. The expenses incurred by farmers for digging bore-wells and for installing motors and pump-sets to draw ground-water will be completely reimbursed by the Government.\nSelect the correct answer using the codes given below :","options":{"a":"1 only","b":"1 and 2 only","c":"3 and 4 only","d":"1, 2, 3 and 4"},"s":"science","ca":true,"f":"Multiple statements"},{"n":6,"text":"Consider the following provisions under the Directive Principles of State Policy as enshrined in the Constitution of India:\n1. Securing for citizens of India a uniform civil code\n2. Organizing village Panchayats\n3. Promoting cottage industries in rural areas\n4. Securing for all the workers reasonable leisure and cultural opportunities\nWhich of the above are the Gandhian Principles that are reflected in the Directive Principles of State Policy?","options":{"a":"1, 2 and 4 only","b":"2 and 3 only","c":"1, 3 and 4 only","d":"1, 2, 3 and 4"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":7,"text":"Consider the following statements:\n1. Union Territories are not represented in the Rajya Sabha.\n2. It is within the purview of the Chief Election Commissioner to adjudicate the election disputes.\n3. According to the Constitution of India, the Parliament consists of the Lok Sabha and the Rajya Sabha only.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 3","c":"1 and 3","d":"None"},"s":"polity","ca":true,"f":"Multiple statements"},{"n":8,"text":"With reference to consumers' rights/privileges under the provisions of law in India, which of the following statements is/are correct?\n1. Consumers are empowered to take samples for food testing.\n2. When a consumer files a complaint in any consumer forum, no fee is required to be paid.\n3. In case of death of a consumer, his/her legal heir can file a complaint in the consumer forum on his/her behalf.\nSelect the correct answer using the codes given below :","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"international","ca":true,"f":"Multiple statements"},{"n":9,"text":"Regarding the office of the Lok Sabha Speaker, consider the following statements:\n1. He/She holds the office during the pleasure of the President.\n2. He/She need not be a member of the House at the time of his/her election but has to become a member of the House within six months from the date of his/her election.\n3. If he/she intends to resign, the letter of his/her resignation has to be addressed to the Deputy Speaker.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2 only","b":"3 only","c":"1, 2 and 3","d":"None"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":10,"text":"Which of the following are included in the original jurisdiction of the Supreme Court?\n1. A dispute between the Government of India and one or more States\n2. A dispute regarding elections to either House of the Parliament or that of Legislature of a State\n3. A dispute between the Government of India and a Union Territory\n4. A dispute between two or more States\nSelect the correct answer using the codes given below :","options":{"a":"1 and 2","b":"2 and 3","c":"1 and 4","d":"3 and 4"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":11,"text":"Consider the following kinds of organisms:\n1. Bacteria\n2. Fungi\n3. Flowering plants\nSome species of which of the above kinds of organisms are employed as biopesticides?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":12,"text":"Biomass gasification is considered to be one of the sustainable solutions to the power crisis in India. In this context, which of the following statements is/are correct?\n1. Coconut shells, groundnut shells and rice husk can be used in biomass gasification.\n2. The combustible gases generated from biomass gasification consist of hydrogen and carbon dioxide only.\n3. The combustible gases generated from biomass gasification can be used for direct heat generation but not in internal combustion engines.\nSelect the correct answer using the codes given below :","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":13,"text":"What is the role of ultraviolet (UV) radiation in the water purification systems?\n1. It inactivates/kills the harmful microorganisms in water.\n2. It removes all the undesirable odours from the water.\n3. It quickens the sedimentation of solid particles, removes turbidity and improves the clarity of water.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":14,"text":"Graphene is frequently in news recently. What is its importance?\n1. It is a two-dimensional material and has good electrical conductivity.\n2. It is one of the thinnest but strongest materials tested so far.\n3. It is entirely made of silicon and has high optical transparency.\n4. It can be used as 'conducting electrodes' required for touch screens, LCDs and organic LEDs.\nWhich of the statements given above are correct?","options":{"a":"1 and 2 only","b":"3 and 4 only","c":"1, 2 and 4 only","d":"1, 2, 3 and 4"},"s":"science","ca":true,"f":"Multiple statements"},{"n":15,"text":"Lead, ingested or inhaled, is a health hazard. After the addition of lead to petrol has been banned, what still are the sources of lead poisoning?\n1. Smelting units\n2. Pens and pencils\n3. Paints\n4. Hair oils and cosmetics\nSelect the correct answer using the codes given below :","options":{"a":"1, 2 and 3 only","b":"1 and 3 only","c":"2 and 4 only","d":"1, 2, 3 and 4"},"s":"science","ca":true,"f":"Multiple statements"},{"n":16,"text":"With reference to 'stem cells', frequently in the news, which of the following statements is/are correct?\n1. Stem cells can be derived from mammals only.\n2. Stem cells can be used for screening new drugs.\n3. Stem cells can be used for medical therapies.\nSelect the correct answer using the codes given below :","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":17,"text":"Consider the following statements: Chlorofluorocarbons, known as ozone-depleting substances, are used\n1. in the production of plastic foams\n2. in the production of tubeless tyres\n3. in cleaning certain electronic components\n4. as pressurizing agents in aerosol cans\nWhich of the statements given above is/are correct ?","options":{"a":"1, 2 and 3 only","b":"4 only","c":"1, 3 and 4 only","d":"1, 2, 3 and 4"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":18,"text":"A team of scientists at Brookhaven National Laboratory including those from, ‘India created the heaviest anti-matter fanti-helium nucleus). What is/are the implication / implications’ of the creation of anti-matter ?: 1, it will make mineral prospect and oil exploration easier and cheaper. “. Twill help probe the possibility ef the existence of stars and galaxies made of anti-matter,\n3. it will help understand. the evolution of the universe.\nSelect the correct answer using the codes: given below","options":{"a":"1 only","b":"2 and 3 only","c":"3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Direct"},{"n":19,"text":"Which. of the following is/are cited by the scientists as evidence / evidences for the continued expansion of universe ?\n1. Detection of microwaves in Space\n2. Observation of redshift phenomenon in apace\n3. Movement of asteroid in space\n4. Occurrence of supernova .. explosions in space\nSelect the correct answer “using the codes given, below","options":{"a":"1 and 2 ? ‘.","b":"2 only","c":"1, 3 ana","d":"None of the above can be cited as evidence"},"s":"science","ca":true,"f":"Multiple statements"},{"n":20,"text":"Electrically charged particles from space travelling at speeds of several hundred km /se¢e can severely haunt living beings if they reach the surface of the Earth. What prevents them fram reaching the surface of the Earth ?","options":{"a":"‘The Earth’s aiagnetie field diverts them towards its poles","b":"Ozone layer around the Earth. reflects them back to outer apace","c":"Moisture in the upper layers of atmosphere prevents them irom reaching the surface of the Earth","d":"Notice.of the statements fa, {b}"},"s":"science","ca":true,"f":"Direct"},{"n":21,"text":"With reference to the scientific progress of ancient India, which of the statements given below are correct?\n1. Different kinds of specialized surgical instruments were in common use by 1st century AD.\n2. Transplant of internal organs in the human body had begun by the beginning of 3rd century AD.\n3. The concept of sine of an angle was known in 5th century AD.\n4. The concept of cyclic quadrilaterals was known in 7th century AD.\nSelect the correct answer using the codes given below :","options":{"a":"1 and 2 only","b":"3 and 4 only","c":"1, 3 and 4 only","d":"1, 2, 3 and 4"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":22,"text":"With reference to the history of ancient India, which of the following was/were common to both Buddhism and Jainism?\n1. Avoidance of extremities of penance and enjoyment\n2. Indifference to the authority of the Vedas\n3. Denial of efficacy of rituals\nSelect the correct answer using the codes given below :","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"history","ca":false,"f":"Multiple statements"},{"n":23,"text":"Which of the following can be said to be essentially the parts of 'Inclusive Governance'?\n1. Permitting the Non-Banking Financial Companies to do banking\n2. Establishing effective District Planning Committees in all the districts\n3. Increasing the government spending on public health\n4. Strengthening the Mid-day Meal Scheme\nSelect the correct answer using the codes given below :","options":{"a":"1 and 2 only","b":"3 and 4 only","c":"2, 3 and 4 only","d":"1, 2, 3 and 4"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":24,"text":"‘The Niagara, the Dravida and the Vesara are the","options":{"a":"three misiri racial groups of the indian subcontinent","b":"‘three tain linguistic divisions into which the languages of India can be classified","c":"three main, styles of Indian temple architecture","d":"three main musical Gharanas prevalent in india"},"s":"history","ca":false,"f":"Direct"},{"n":25,"text":"The Congress ministries resigned in the seven provinces in 1939, because","options":{"a":"the Congress could not form ministries in the other four provinces","b":"emergence of a left wing in the Congress made the working of the ministries impossible","c":"there were widespread communal disturbances in their provinces","d":"None of the statements (a), (b) and (c) given above is correct"},"s":"misc","ca":true,"f":"Direct"},{"n":26,"text":"With reference to National Rural Health Mission, which of the following are the jobs of 'ASHA', a trained community health worker?\n1. Accompanying women to the health facility for antenatal care checkup\n2. Using pregnancy test kits for early detection of pregnancy\n3. Providing information on nutrition and immunization\n4. Conducting the delivery of baby\nSelect the correct answer using the codes given below :","options":{"a":"1, 2 and 3 only","b":"2 and 4 only","c":"1 and 3 only","d":"1, 2, 3 and 4"},"s":"general-science","ca":true,"f":"Multiple statements"},{"n":27,"text":"Which of the following is/are the principal feature(s) of the Government of India Act, 1919?\n1. Introduction of dyarchy in the executive government of the provinces\n2. Introduction of separate communal electorates for Muslims\n3. Devolution of legislative authority by the centre to the provinces\nSelect the correct answer using the codes given below :","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":28,"text":"During Indian freedom: struggle; the National Social Conference was formed. What-was the reason for its formation ?","options":{"a":"Different social reform groups ar orfanizdiions of Bengal region united to ferm a single body ta discuss the issues of larger interest and to prepare appropriate petitions /representations ta the -gavemumnent","b":"Indian National Congress did het want to include social. reforms iti its deliberations and decided to form a separate body for sich purpose","c":"Behramji Malabari and. M, G. Ranade decided ty bring together all the special reform groups ef the country under one organization","d":"None of the statements fal, {b} and fej given above is correct in this context"},"s":"history","ca":false,"f":"Direct"},{"n":29,"text":"Which of the following parties were established by Dr. B. R. Ambedkar ?\n1. The Peasants. and Workers Party of India\n2. AQ India Scheduled Castes Federation:\nS.. The Independent Labour Party\nSelect the.correct answer using the codes given below:","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"i-and 3 only","d":"i, 2 and 3 P- /SOA"},"s":"science","ca":true,"f":"Multiple statements"},{"n":30,"text":"Which of the following special! powers have been conferred on the Raja Sasha by the Constitution of india ?","options":{"a":"To change the existing territory of a State and to change the name of a State","b":"Fo pass “1 resolution empowering the Parliament to make laws in the State List and to create ore dr more All India. Services","c":"To amend the — election procedure of the President and to determine the pension of the President after his/her retirement","d":"To determine the functions of the Hdection Commission and toe determine the’ number of Election Cormunissioners"},"s":"polity","ca":true,"f":"Direct"},{"n":31,"text":"How does the National Rural Livelihood Mission seek to improve livelihood options of rural poor?\n1. By setting up a large number of new manufacturing industries and agribusiness centres in rural areas\n2. By strengthening 'self-help groups' and providing skill development\n3. By supplying seeds, fertilizers, diesel pump-sets and micro-irrigation equipment free of cost to farmers\nSelect the correct answer using the codes given below :","options":{"a":"1 and 2 only","b":"2 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":32,"text":"The Multi-dimensional Poverty Index developed by Oxford Poverty and. Human Development Initiative with UNDP. support.covers which of the following ?\n1. Deprivation of education, health, assets and services af household level\n2. Purchasing power parity at national level:\n3. Extent of budget deficit and GDP growth rate at rational level\nSelect the correct answer using the codes: given below =","options":{"a":"i only","b":"2 and 3 only.","c":"1 and 3 only","d":"1, 2 arid"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":33,"text":"Which of the following is/are among the Noticeable features of the recommendations of the Thirteertth Finance Commission ?\n1. A design for the Goods and Services Tax, and & compensation package linked, to adherence to the proposed design.\n2. A design for the creation of lakhs of jobs in the hext ten years in consonance with India’s demographic dividend P- / SGA 18\n3. Devolution ef a specified share: of central taxes to focal bodies. 438 grants\nSelect the correct answer using the codes given below:","options":{"a":"l-only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":34,"text":"What is/are the recent policy initiative{s} of Government of India to promote the growth = of manufacturing sector ? ]. Setting up of National Investment and Manufacturirig Zones ‘2. Providing the benefit‘of ‘single window clearance’\n3. Establishing the Technology Acquisition and Development Fund\nSelect the correct answer using the codes given below:","options":{"a":"1 only","b":"2 and 3. only","c":"i and 3 only.","d":"Zand 3"},"s":"economy","ca":true,"f":"Direct"},{"n":35,"text":"Which of the following are the methods of Parliamentary control over public fnarice .in India ? i. Placing Annual ‘Financial.\nStatement before the Parliament\n2. Withdrawal of moneys from Consolidated Fund of india only: after passing the Appropriation Bill 3, Provisions of supplementary grants and: vote-on-account — +, A ‘periodic or at least a tnid-year review of programme ef the Government. against macreeconormi¢ forecasts and expenditure by- a Parliament~ tary Budget Office §.. Introducing Finance’ Bill in the Parliament\nSelect the correct answer using the codes given below:","options":{"a":"i, 2, 3 and 5 only","b":"%t, 2 and 4 only","c":"3, 4 and 5S enly","d":"1, 2, 3, 4 and 5"},"s":"polity","ca":true,"f":"Direct"},{"n":36,"text":"Mahatma Gandhi undertook fast unto death in 1932, mainly because","options":{"a":"Round Table Conference failed to satisfy Indian political aspirations","b":"Congress and Muslim League had differences of opinion","c":"Ramsay Macdonald announced the Communal Award","d":"None of the statements (a), (b) and (c) given above is correct in this context"},"s":"history","ca":true,"f":"Direct"},{"n":37,"text":"With reference to Ryotwari Settlement, consider the following statements:\n1. The rent was paid directly by the peasants to the Government.\n2. The Government gave Pattas to the Ryots.\n3. The lands were surveyed and assessed before being taxed.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"1 and 2 only","c":"1, 2 and 3","d":"None"},"s":"history","ca":false,"f":"Multiple statements"},{"n":38,"text":"Consider the following specific stages of demographic transition associated with economic development:\n1. Low birthrate with low death rate\n2. High birthrate with high death rate\n3. High birthrate with low death rate\nSelect the correct order of the above stages using the codes given below:","options":{"a":"1, 2, 3","b":"2, 1, 3","c":"2, 3, 1","d":"3, 2, 1"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":39,"text":"In India, in the overall Index of Industrial Production, the Indices of Eight Core Industries have a combined weight of 37:90%. Which of the following are armoring those Eight Core Industries ? -. Cement 2. Fertilizers\n3. Natural gas\n4. Refinery products 5, Textiles\nSelect the correct answer using the codes given below:","options":{"a":"i and 5 only","b":"2, 3 and 4 only","c":"1, 2, 3 and 4 only.","d":"1, 2, 3, 4 and 3"},"s":"economy","ca":true,"f":"Direct"},{"n":40,"text":"Which of the following provisions of the Consti@ixion of India have a4 bearing on Education ?\n1. Directive Principles of State Policy\n2. Rural and Urban Local Bodies\n3. Fifth Schedule\n4. Sixth Schedule\n5. Seventh Schedule\nSelect the correct answer using the codes given below ;.","options":{"a":"1 and 2 only","b":"3, 4-and 5 only","c":"1, 2 arid S only","d":"1, 2, 3, 4 and 5"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":41,"text":"Government of India encourages the cultivation of 'sea buckthorn'. What is the importance of this plant?\n1. It helps in controlling soil erosion and in preventing desertification.\n2. It is a rich source of biodiesel.\n3. It has nutritional value and is well-adapted to live in cold areas of high altitudes.\n4. Its timber is of great commercial value.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2, 3 and 4 only","c":"1 and 3 only","d":"1, 2, 3 and 4"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":42,"text":"Which of the following is the chief characteristic of ‘mixed: farming’ ?","options":{"a":"Cultivation of both cash crops and food crops","b":"Cultivation of two or mere crops in the same field","c":"Rearing of animals and cultivation: of: crops together","d":"None of the above"},"s":"geography","ca":false,"f":"Direct"},{"n":43,"text":"A particular State in India has the following characteristics:\n1. It is located on the same latitude which passes through norther Rajasthan.\n2. it has over 80% of its area under forest cover.,. 3, Over 12% of forest cover constitutes Protected Area Network iri this. State,\nWhich one among the following States has all the above characteristics ?","options":{"a":"Arunachal Pradesh","b":"‘Assam.","c":"Himachal Pradesh","d":"Uttarakhand"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":44,"text":"Consider the following crops of India: id. Cowpea 2%. Green gram\n3. Pigeon pea\nWhich of the above is/are used as pulse, fodder and: green manure ?","options":{"a":"i and 2 only","b":"2. only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Direct"},{"n":45,"text":"Consider the following factors i.. Rotation. of the Earth\n2. Air pressure and wind\n3. Density of ocean water\n4. Revolution of the Earth:\nWhich of the above factors influence the ocean currents ?","options":{"a":"12 and 2-only","b":"4, 2 and 3","c":"1 and 4","d":"2, 3 and 4"},"s":"geography","ca":false,"f":"Direct"},{"n":46,"text":"With reference to the wetlands of: india, consider the following:\nStatements: 1, The country’s total geographical’ area under the category of wetlands is recorded more in. Gujarat as compared to other States. 2, In India, the total geographical! @rea of coastal wetlands is larger than that of inland wetlands.\nP- /SOA 24 “Which. of the statements giver: above is/are correct ?","options":{"a":"i only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"environment","ca":false,"f":"Direct"},{"n":47,"text":"Corisider the following crops of India,;\n1. Groundnut\n4. Sesamum.\n3. Pearl millet\nWhich of the above is/are: predominantly rained crop/crops ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"3 only","d":"1, 2 and’3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":48,"text":"When you travel in Himalayas, you will see the following:\n1. Deep gorges\n2. U-turn river courses\n3. Parallel mountain ranges\n4. Steep gradients causing landsliding\nWhich of the above can be said to be the evidences for Himalayas being young fold mountains?","options":{"a":"1 and 2 only","b":"1, 2 and 4 only","c":"3 and 4 only","d":"1, 2, 3 and 4"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":49,"text":"Normally, the temperature decreases with the increase in height from the Earth's surface, because\n1. the atmosphere can be heated upwards only from the Earth's surface\n2. there is more moisture in the upper atmosphere\n3. the air is less dense in the upper atmosphere\nSelect the correct answer using the codes given below :","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":50,"text":"The acidification of oceans is increasing. Why is this phenomenon a cause of concern?\n1. The growth and survival of calcareous phytoplankton will be adversely affected.\n2. The growth and survival of coral reefs will be adversely affected.\n3. The survival of some animals that have phytoplanktonic larvae will be adversely affected.\n4. The cloud seeding and formation of clouds will be adversely affected.\nWhich of the statements given above is/are correct ?","options":{"a":"1, 2 and 3 only","b":"2 only","c":"1 and 3 only","d":"1, 2, 3 and 4"},"s":"science","ca":true,"f":"Multiple statements"},{"n":51,"text":"In India, other than ensuring that public funds are used efficiently and for intended purpose, what is the importance of the office of the Comptroller and Auditor General (CAG)?\n1. CAG exercises exchequer control on behalf of the Parliament when the President of India declares national emergency/financial emergency.\n2. CAG reports on the execution of projects or programmes by the ministries are discussed by the Public Accounts Committee.\n3. Information from CAG reports can be used by investigating agencies to press charges against those who have violated the law while managing public finances.\n4. While dealing with the audit and accounting of government companies, CAG has certain judicial powers for prosecuting those who violate the law.\nWhich of the statements given above is/are correct?","options":{"a":"1, 3 and 4 only","b":"2 only","c":"2 and 3 only","d":"1, 2, 3 and 4"},"s":"polity","ca":true,"f":"Multiple statements"},{"n":52,"text":"The endeavour of 'Janani Suraksha Yojana' Programme is\n1. to promote institutional deliveries\n2. to provide monetary assistance to the mother to meet the cost of delivery\n3. to provide for wage loss due to pregnancy and confinement\nWhich of the statements given above is/are correct?","options":{"a":"1 and 2 only","b":"2 only","c":"3 only","d":"1, 2 and 3"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":53,"text":"The Prime Minister. of India, at the time of his/her appointment","options":{"a":"need not necessarily be a member of one of the Houses of the Parliament but must become a member of one of the Houses within six months","b":"need not necessarily be a member of one of the Houses of the Parliament but must become a member of the Lok Sasha within six months","c":"must be a member of one of the Houses of the Parliament","d":"must be a member of the Lok Sasha P- /50A"},"s":"polity","ca":false,"f":"Direct"},{"n":54,"text":"With reference to the Deliiitation Commission, consider the following statements:\n1. The orders of the Delimitation Commission cannot be challenged in a Court of Law.\n2. When the orders of the Delimitation Commission are laid before the: Lok Sasha: or State Legislative Assembly, they cannot effect any modifications in the orders.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both i and 2","d":"Neither 1 nor 2"},"s":"science","ca":true,"f":"Multiple statements"},{"n":55,"text":"Consider the following l. Hotels and restaurants\n2. Motor transport undertakings\n3. (‘Newspaper establishments\n4. Private medical institutions The employees of which of ‘the above can have the. ‘Social Security’ coverage under Employees’ State Insurance Scheme ?.","options":{"a":"1, 2 and 3-only","b":"4 only","c":"2, 3 and-4 only","d":"1, 2, Sand"},"s":"misc","ca":true,"f":"Direct"},{"n":56,"text":"According to the Constitution of India, it is the duty of the President of India to cause to be laid before the Parliament which of the following?\n1. The Recommendations of the Union Finance Commission\n2. The Report of the Public Accounts Committee\n3. The Report of the Comptroller and Auditor General\n4. The Report of the National Commission for Scheduled Castes\nSelect the correct answer using the codes given below:","options":{"a":"1 only","b":"2 and 4 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":true,"f":"Multiple statements"},{"n":57,"text":"A deadlock between the Lok Sabha and the Rajya Sabha calls for a joint sitting of the Parliament during the passage of\n1. Ordinary Legislation\n2. Money Bill\n3. Constitution Amendment Bill\nSelect the correct answer using the codes given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":58,"text":"How do District Rural Development Agencies (DRDAs) help in the reduction of rural poverty in India?\n1. DRDAs act as Panchayati Raj Institutions in certain specified backward regions of the country.\n2. DRDAs undertake area-specific scientific study of the causes of poverty and malnutrition and prepare detailed remedial measures.\n3. DRDAs secure inter-sectoral and inter-departmental coordination and cooperation for effective implementation of anti-poverty programmes.\n4. DRDAs watch over and ensure effective utilization of the funds intended for anti-poverty programmes.\nWhich of the statements given above is/are correct?","options":{"a":"1, 2 and 3 only","b":"3 and 4 only","c":"4 only","d":"1, 2, 3 and 4"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":59,"text":"Which of the following is/are among the Fundamental Duties of citizens laid down in the Indian Constitution?\n1. To preserve the rich heritage of our composite culture\n2. To protect the weaker sections from social injustice\n3. To develop the scientific temper and spirit of inquiry\n4. To strive towards excellence in all spheres of individual and collective activity\nSelect the correct answer using the codes given below:","options":{"a":"1 and 2 only","b":"2 only","c":"1, 3 and 4 only","d":"1, 2, 3 and 4"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":60,"text":"What is the provision to safeguard the autonomy af the Supreme Court of india ?\n1. * While appointing the Supreme 4 Court Judges, the President of India’ has to consult the Chief Justice of India.\n2. * The Siiprerhe® Court Judges can be removed by the Chief ‘ Justice of India only.\n3. The salaries of the Judges ard charged on the Consolidated Fund of India to which the legislature does net heave ta Wote,.\nPDTG-M-DA/ S04 32 4 All appointments of officers and staffs of the Supreme Court of India are made by the Government only after consulting the Chief Justice of tricia.\nWhich. af the statements given above is/sre correct ?","options":{"a":"1 and 3 only","b":"3 and 4 only","c":"4 only","d":"4, 2, 3 and 4"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":61,"text":"To meet its rapidly growing energy demand, some opine that India should pursue research and development on thorium as the future fuel of nuclear energy. In this context, what advantage does thorium hold over uranium?\n1. Thorium is far more abundant in nature than uranium.\n2. On the basis of per unit mass of mined mineral, thorium can generate more energy compared to natural uranium.\n3. Thorium produces less harmful waste compared to uranium.\nWhich of the statements given above is/are correct?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":62,"text":"The increasing amount of carbon dioxide in the air is slowly raising the temperature of the atmosphere, because it absorbs","options":{"a":"the water vapour of the air and retains its heat","b":"the ultraviolet part of the solar radiation","c":"all the solar radiations","d":"the infrared part of the solar radiation"},"s":"geography","ca":false,"f":"Direct"},{"n":63,"text":"Which one of the fallowing sets of elements was primarily responsible for the origin of life on the Earth ?","options":{"a":"Hydrogen, Oxygen, Sodium","b":"Carbon, Hydrogen, .Nitrogen","c":"Oxygen, Calcium, Phosphorus","d":"Carbon, Hydrogen, ‘Potassium"},"s":"general-science","ca":false,"f":"Direct"},{"n":64,"text":"What are the reasons for the people's resistance to the introduction of Bt brinjal in India?\n1. Bt brinjal has been created by inserting a gene from a soil fungus into its genome.\n2. The seeds of Bt brinjal are terminator seeds and therefore, the farmers have to buy the seeds before every season from the seed companies.\n3. There is an apprehension that the consumption of Bt brinjal may have adverse impact on health.\n4. There is some concern that the introduction of Bt brinjal may have adverse effect on the biodiversity.\nSelect the correct answer using the codes given below:","options":{"a":"1 and 2 only","b":"3 and 4 only","c":"1, 2 and 4 only","d":"1, 2, 3 and 4"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":65,"text":"Other than resistance to pests, what are the prospects for which genetically engineered plants have been created ?\n1. To enable them to withstand drought:\n2. To increase the: nutritive value of the produce 3, To.enable them to grow and de photosynthesis in spaceships and space stations.\n4. Td increase their shelf life\nSelect the correct answer using the codes given below:","options":{"a":"1 -and-2 only","b":"3 and 4 only","c":"1, 2 and 4 only","d":"1, 2, 3 and 4"},"s":"science","ca":true,"f":"Multiple statements"},{"n":66,"text":"Consider the following statements:\nThe most effective contribution made by Dadabhai Naoroji ta the case of Indian National Movement was that he 3, exposed the economic exploitation of India by the British\n2. interpreted the ancient Indian texts and restored the self-confidence of Indians.\n3. stressed the need for eradication of all the social evils before anything else\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 3 ‘only","c":"l-and 3 only","d":"i, Qand3"},"s":"history","ca":false,"f":"Direct"},{"n":67,"text":"With, reference to Dhrupad, one of the major traditions of India that hasibeen kept alive for centuries which of the following statements are correct ?\n1. Dhrupad originated = and developed in the. Rajput kingdornas during the Mughal period.\n2. Dhrupad is primarily a devotional and spiritual-music.\n3. Dhrupad Miap uses Sanskrit syllables from Mantras.\nP-DTO=-M=DA/50A 36°\nSelect the correct answer using the codes given below:","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1, 2 and 3","d":"None of the above is correct"},"s":"history","ca":false,"f":"Multiple statements"},{"n":68,"text":"How do you distinguish between Kuchipudi and Bharatanatyam dances?\n1. Dancers occasionally speaking dialogues is found in Kuchipudi dance but not in Bharatanatyam.\n2. Dancing on the brass plate by keeping the feet on its edges is a feature of Bharatanatyam but Kuchipudi dance does not have such a form of movements.\nSelect the correct answer using the codes given below:","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"history","ca":false,"f":"Multiple statements"},{"n":69,"text":"With reference to the religious history of medieval India, the Sufi mystics were known to pursue which of the following practices?\n1. Meditation and control of breath\n2. Severe ascetic exercises in a lonely place\n3. Recitation of holy songs to arouse a state of ecstasy in their audience\nSelect the correct answer using the codes given below:","options":{"a":"1 and 2 only","b":"2 and 3","c":"1 and 3","d":"None of the above"},"s":"history","ca":false,"f":"Multiple statements"},{"n":70,"text":"The Rowlatt Act aimed at","options":{"a":"compulsory economic support to war efforts","b":"imprisonment without trial and summary procedures for trial","c":"suppression of the Khilafat Movement","d":"imposition of restrictions on freedom of the press"},"s":"history","ca":false,"f":"Direct"},{"n":71,"text":"The Lahore Session of the indian National, Corigréss (1929) is very important in history, because\nI. the Congress. passed a resolution demanding complete independence 2, the rift between the extremists and tolerates.was resolved in that Session 3, a& resolution was passed rejecting the two-nation theory in that Session P- / SOA 33\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2. and 3","c":"1 and 3","d":"Nore of the above."},"s":"economy","ca":false,"f":"Multiple statements"},{"n":72,"text":"Lord Buddha's image is sometimes shown with the hand gesture called 'Bhumisparsha Mudra'. It symbolizes","options":{"a":"Buddha's calling of the Earth to watch over Mara and to prevent Mara from disturbing his meditation","b":"Buddha's calling of the Earth to witness his purity and chastity despite the temptations of Mara","c":"Buddha's reminder to his followers that they all arise from the Earth and finally dissolve into the Earth, and thus this life is transitory","d":"Both the statements (a) and (b) are correct in this context"},"s":"history","ca":false,"f":"Direct"},{"n":73,"text":"The religion of early Vedic Aryans was primarily of","options":{"a":"Bhakti","b":"image worship and Yajnas","c":"worship of nature and Yajnas","d":"worship of nature and Bhakti"},"s":"history","ca":false,"f":"Direct"},{"n":74,"text":"Which of the following statements infare correct regarding Brahma Samar ? i dt opposed idolatry.\n2. It derived the need fora priestly class for interpreting the religious texts,\n3. It popularized the doctrine that the Vedas are infallible,\nSelect the correct answer using the codes given below:","options":{"a":"1 only","b":"1 and 2 only","c":"3 only","d":"1, 2 and 3"},"s":"misc","ca":true,"f":"Direct"},{"n":75,"text":"The Reserve Bank of India (RBI) acis as a bankers’ bank. This would imply which of the following ?\n1. Other banks retain their deposits with the RBI.\n2. The RBi lends funds to the commercial banks in- limes of need.\n3. The RBI advises the commercial banks on monetary matters.\nSelect the correct answer: using the codes given below:","options":{"a":"2 and 3 only","b":"1 and 2 only","c":"1 and 3 only","d":"1, 2 and 3 P- ~DA/50A"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":76,"text":"Under which of the following circumstances may “capital gains’ arise ?\n1. When there is an increase in the sales of.a product\n2. When there is a -natural increase in the value of the property owned\n3. When you purchase a painting and there is a growth in its value due to increase in its popularity\nSelect the correct answer using the codes given below","options":{"a":"1 only","b":"2 arid 3 only","c":"2 only","d":"1, 2 and 3"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":77,"text":"Which of the following measures would result in an increase in the money supply in the economy?\n1. Purchase of government securities from the public by the Central Bank\n2. Deposit of currency in commercial banks by the public\n3. Borrowing by the government from the Central Bank\n4. Sale of government securities to the public by the Central Bank\nSelect the correct answer using the codes given below:","options":{"a":"1 only","b":"2 and 4 only","c":"1 and 3","d":"2, 3 and 4"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":78,"text":"Which of the following would include Foreign Direct Investment in India?\n1. Subsidiaries of foreign companies in India\n2. Majority foreign equity holding in Indian companies\n3. Companies exclusively financed by foreign companies\n4. Portfolio investment\nSelect the correct answer using the codes given below:","options":{"a":"1, 2, 3 and 4","b":"2 and 4 only","c":"1 and 3 only","d":"1, 2 and 3 only"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":79,"text":"Consider the following statements + The price of any currency in international market is decided by the\n1. World Bank\n2. demand for goods /services provided by the country corcéemed\n3. stability of the governinéent of the concerned country 4, economic potential of the country in question\nWhich of the statements given above are correct ?","options":{"a":"1, 2, rt millions of tonnes of coal?\n1. It is the policy of India to save its own coal reserves for future, and import it from other countries for the present use.\n2. Most of the power plants in India are coal-based and they are not able to get sufficient supplies of coal from within the country.\n3. Steel companies need large quantity of coking coal which has to be imported.\nWhich of the statements given above is/are correct?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":85,"text":"A person.stood alone in a desertion a, dark night and wanted to reach his village which was situated km east of the point where he was standing. He had no instruments to find the direction but he located the polestar. The most convenient way now to: reach his village is to walk-in the","options":{"a":"direction facing the polestar","b":"direction opposite to the polestar","c":"direction keeping the polestar to his left:","d":"direction keeping the polyester to his right"},"s":"geography","ca":false,"f":"Direct"},{"n":86,"text":"Recently, there has been a concern over the short supply of a group of elements called 'rare earth metals'. Why?\n1. China, which is the largest producer of these elements, has imposed some restrictions on their export.\n2. Other than China, Australia, Canada and Chile, these elements are not found in any country.\n3. Rare earth metals are essential for the manufacture of various kinds of electronic items and there is a growing demand for these elements.\nWhich of the statements given above is/are correct?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"general-science","ca":true,"f":"Multiple statements"},{"n":87,"text":"Consider the following protected areas:\n1. Bandipur\n2. Bhitarkanika\n3. Manas\n4. Sunderbans\nWhich of the above are declared Tiger Reserves?","options":{"a":"1 and 2 only","b":"1, 3 and 4 only","c":"2, 3 and 4 only",  following agricultural practices:\n1. Contour funding\n2. Relay cropping\n3. Zero tillage P- /SOA 50 in the context of global climate change, which of the above helps/help in carbon sequestration/storage in -the sail ?","options":{"a":"1 and 2 only","b":"3 only","c":"1, 2-and 3","d":"None of them"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":99,"text":"What would happen if phytoplankton of an ocean is completely destroyed for some reason?\n1. The ocean as a carbon sink would be adversely affected.\n2. The food chains in the ocean would be adversely affected.\n3. The density of ocean water would drastically decrease.\nSelect the correct answer using the codes given below:","options":{"a":"1 and 2 only","b":"2 only","c":"3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":100,"text":"Vultures which used to be very common in Indian countryside gome years ago are rarely seen nowadays. This is attributed to","options":{"a":"the destruction of their nesting sites by new invasive species","b":"a.drug used by cattle owners for treating their diseased cattle","c":"scarcity of food available to them","d":"a widespread, persistent: and fatal disease ainiong them."},"s":"geography","ca":true,"f":"Direct"}]});

"b":"2, 4 and 5 only","c":"1, 3 and 5 only","d":"1, 2, 3, 4 and 5"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":9,"text":"With reference to Indian History, the Members of the Constituent Assembly from the Provinces were","options":{"a":"directly elected by the people of those Provinces ‘","b":"nominated by the Indian National Congress and the Muslim League:","c":"elected by the Provincial Legislative Assemblies","d":"selected by the Government for their expertise in constitutional matters"},"s":"polity","ca":false,"f":"Direct"},{"n":10,"text":"Consider the following animals:\n1. Sea cow\n2. Sea horse\n3. Sea lion\nWhich of the above is/are mammal/mammals ?","options":{"a":"1 only","b":"1 and 3 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":11,"text":"Consider the following statements:\n1. An amendment to the Constitution of India can be initiated by an introduction of a bill in the Lok Sabha only.\n2. Ifsuch an amendment seeks to make changes in the federal character of the Constitution, the amendment also requires to be ratified by the legislature of all the States of India.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":12,"text":"Consider the following statements: Attorney General of India can\n1. take part in the proceedings of the Lok Sabha\n2. be a member of a committee of the Lok Sabha\n3. speak in the Lok Sabha\n4. vote in the Lok Sabha B- /46A 6\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 4","c":"1, 2 and 3","d":"1 and 3 only"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":13,"text":"With reference to the usefulness of the by-products of sugar industry, which of the following statements is/are correct ?\n1. Bagasse can be used as: biomass fuel for the generation of energy.\n2. Molasses can be used as one of the feedstocks for the production of synthetic chemical fertilizers.\n3. Molasses can be used for the production of ethanol.\nSelect the correct answer using the codes given below.","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":14,"text":"Variations in the length of daytime and nighttime from season to season are due to","options":{"a":"the earth’s rotation on its axis","b":"the earth’s revolution round the sun in an elliptical manner","c":"latitudinal position of the place","d":"revolution of the earth on a tilted axis"},"s":"science","ca":true,"f":"Direct"},{"n":15,"text":"The Narmada river flows to the west, while most other large peninsular rivers flow to the east. Why ?\n1. It occupies a linear rift valley.\n2. It flows between the Vindhyas and the Satpuras.\n3. The 1 and slopes to the west from Central India.\nSelect the correct answer using the codes given below.","options":{"a":"1 only","b":"2 and 3","c":"1 and 3","d":"None"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":16,"text":"On the planet earth, most of the freshwater exists as ice caps and glaciers. Out of the remaining freshwater, the largest proportion","options":{"a":"is found in atmosphere as moisture and clouds","b":"is found in freshwater lakes and rivers","c":"exists as groundwater","d":"exists as soil moisture"},"s":"geography","ca":false,"f":"Direct"},{"n":17,"text":"Consider the following pairs:\n1. Nokrek Biosphere Reserve: Garo Hills\n2. Logtak (Loktak) Lake: Barail Range\n3. Namdapha National Park: Dafla Hills Which correctly of matched ? the above pairs is/are","options":{"a":"1 only","b":"2 and 3 only","c":"1, 2 and 3","d":"None B- /46A"},"s":"environment","ca":false,"f":"Match / pairs"},{"n":18,"text":"Consider the following:\n1. Electromagnetic radiation\n2. Geothermal energy\n3. Gravitational force\n4. Plate movements\n5. Rotation of the earth\n6. Revolution of y animals\n2. Burning of coal by man\n3. Death of vegetation\nSelect the correct answer using the codes given below.","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":35,"text":"In which of the following States is lion-tailed macaque found in its natural habitat ?\n1. Tamil Nadu\n2. Kerala\n3. Karnataka\n4. Andhra Pradesh\nSelect the correct answer using the codes given below. é","options":{"a":"1, 2 and 3 only","b":"2 only","c":"1, 3 and 4 only","d":"1, 2, 3 and 4"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":36,"text":"Some Buddhist rock-cut caves are called Chaityas, while the others are called Viharas. What is the difference between the two ?","options":{"a":"Vihara is a place of worship, while Chaitya is the dwelling place of the monks","b":"Chaitya is a place of worship, while Vihara is the dwelling place of the monks","c":"Chaitya is the stupa at the far end of the cave, while Vihara is the hall axial to it","d":"There is no material difference between the two"},"s":"science","ca":true,"f":"Direct"},{"n":37,"text":"Which one of the following describes best the concept of Nirvana in Buddhism ?","options":{"a":"The extinction of the flame of desire","b":"The complete annihilation of self","c":"A state of bliss and rest","d":"A mental stage beyond all comprehension"},"s":"history","ca":false,"f":"Direct"},{"n":38,"text":"According to the Constitution of India, which of the following are fundamental for the governance of the country ?","options":{"a":"Fundamental Rights","b":"Fundamental Duties","c":"Directive Principles of State Policy","d":"Fundamental Rights and Fundamental Duties B- /46A"},"s":"polity","ca":false,"f":"Direct"},{"n":39,"text":"The people of India agitated against the arrival of Simon Commission because","options":{"a":"Indians never wanted the review of the working of the Act of 1919","b":"Simon Commission recommended the abolition of Dyarchy (Diarchy) in the Provinces","c":"there was no Indian member in the Simon Commission.","d":"the Simon Commission suggested the partition of the: country"},"s":"science","ca":true,"f":"Direct"},{"n":40,"text":"Quit India Movement was launched in response to","options":{"a":"Cabinet Mission Plan","b":"Cripps Proposals","c":"Simon Commission Report","d":"Wavell Plan"},"s":"history","ca":true,"f":"Direct"},{"n":41,"text":"The balance of payments of a country is a systematic record of","options":{"a":"all import and export transactions of a country during a given period of time, normally a year","b":"goods exported from a country during a year","c":"economic transaction between the government of one country to another","d":"capital movements from one country to another"},"s":"economy","ca":false,"f":"Direct"},{"n":42,"text":"The Reserve Bank of India regulates the commercial banks in matters of\n1. liquidity of assets\n2. branch expansion\n3. merger of banks\n4. winding-up of banks\nSelect the correct answer using the codes given below.","options":{"a":"1 and 4 only","b":"2, 3 and 4 only","c":"1, 2 and 3 only","d":"1, 2, 3 and 4"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":43,"text":"An increase in the Bank Rate generally indicates that the","options":{"a":"market rate of interest is likely to fall","b":"Central Bank is no longer making loans to commercial banks","c":"Central Bank is following an easy money policy","d":"Central Bank is following a tight money policy"},"s":"economy","ca":false,"f":"Direct"},{"n":44,"text":"In India, deficit financing is used for raising resources for","options":{"a":"economic development","b":"redemption of public debt","c":"adjusting the balance of payments","d":"reducing the foreign debt B- /46A"},"s":"economy","ca":false,"f":"Direct"},{"n":45,"text":"Which of the following characterizes/ characterize the people of Indus Civilization ?\n1. They possessed great palaces and temples.\n2. They worshipped both male and fema ","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":56,"text":"Which of the following constitute Capital Account ?\n1. Foreign Loans\n2. Foreign Direct Investment\n3. Private Remittances\n4. Portfolio Investment\nSelect the correct answer using the codes given below.","options":{"a":"1, 2 and 3","b":"1, 2 and 4","c":"2, 3 and 4","d":"1, 3 and 4"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":57,"text":"Consider the following historical places:\n1. Ajanta Caves\n2. Lepakshi Temple\n3. Sanchi Stupa\nWhich of the above places is/are also known for mural paintings ?","options":{"a":"1 only","b":"1 and 2 only","c":"1, 2 and 3","d":"None B- /46A"},"s":"history","ca":false,"f":"Multiple statements"},{"n":58,"text":"With reference to the history of philosophical thought in India, consider the following statements regarding Sankhya school:\n1. Sankhya does not accept the theory of rebirth or transmigration of soul.\n2. Sankhya holds that it is the self-knowledge that leads to liberation and not any exterior influence or agent.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":59,"text":"In the context of India, which of the following principles is/are implied institutionally in the parliamentary government ?\n1. Members of the Cabinet are Members of the Parliament.\n2. Ministers hold the office till they enjoy confidence in the Parliament.\n3. Cabinet is headed by the Head of the State.\nSelect the correct answer using the codes given below.","options":{"a":"1 and 2 only","b":"3 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":60,"text":"The annual range of temperature in the interior of the continents is high as compared to coastal areas. What is/are the reason/reasons ?\n1. Thermal difference between 1 and and water\n2. Variation in altitude between y","ca":false,"f":"Multiple statements"},{"n":75,"text":"In the context of Indian economy, ‘Open Market Operations’ refers to","options":{"a":"borrowing by scheduled banks from the RBI","b":"lending by commercial banks: to industry and trade","c":"purchase and sale of government securities by the RBI","d":"None of the above"},"s":"economy","ca":false,"f":"Direct"},{"n":76,"text":"Priority Sector Lending by banks in India constitutes the lending to","options":{"a":"agriculture","b":"micro and small enterprises","c":"weaker sections","d":"All of the above"},"s":"economy","ca":false,"f":"Direct"},{"n":77,"text":"Which one among the following industries is the maximum consumer of water in India ?","options":{"a":"Engineering","b":"Paper and pulp","c":"Textiles","d":"Thermal power"},"s":"economy","ca":false,"f":"Direct"},{"n":78,"text":"To obtain’ ffull benefits of demographic dividend, what should India do ?","options":{"a":"Promoting skill development","b":"Introducing more social security schemes","c":"Reducing infant mortality rate","d":"Privatization of higher education B- /46A"},"s":"misc","ca":true,"f":"Direct"},{"n":79,"text":"In the context of cultural history of India, a pose in dance and dramatics called ‘Tribhanga’ has been a favourite of Indian artists from ancient times till today. Which one of the following statements best describes this pose ?","options":{"a":"One leg is bent and the body is slightly but oppositely curved at waist and neck","b":"Facial expressions, hand gestures and make-up are g combined to symbolize certain epic or historic characters","c":"Movements of body, face and: hands are used to express oneself or to tell a story","d":"A little smile, slightly curved waist and certain hand gestures are emphasized to express the feelings of love or eroticism"},"s":"history","ca":false,"f":"Direct"},{"n":80,"text":"Annie Besant was\n1. responsible for starting the Home Rule Movement\n2. the founder of the Theosophical Society\n3. once the Presiden ography","ca":false,"f":"Match / pairs"},{"n":4,"text":"Consider the following pairs: Programme/ Project Ministry\n1. Drought-Prone: Ministry of Area Programme Agriculture\n2. Desert Development :~- Ministry of Programme Environment and Forests\n3. National Watershed: Ministry Development Project of Rural b for Rained Areas Development\nWhich of the above pairs is/are correctly matched ?.","options":{"a":"1 and 2 only","b":"3 only","c":"1, 2 and 3","d":"None 2"},"s":"environment","ca":true,"f":"Match / pairs"},{"n":5,"text":"With reference to Bombay Natural History Society (BNHS), consider the following statements:\n1. It is an autonomous organization under the Ministry of Environment and Forests.\n2. It strives to conserve nature through action-based research, education and public awareness,\n3. It organizes and conducts nature trails and camps for the general public.\nWhich of the statements given above is/are correct ?.","options":{"a":"1 and 3 only","b":"2 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":6,"text":"With reference to ‘Global Environment Facility’, which of the following statements is/are correct ?","options":{"a":"It serves as financial mechanism for ‘Convention on Biological Diversity’ and ‘United Nations Framework Convention on Climate Change’","b":"It undertakes scientific research on environmental issues at global level","c":"It is an agency under OECD to facilitate the transfer of technology and funds to underdeveloped countries with specific aim to protect their environment","d":"Both (a) and (b) B"},"s":"environment","ca":false,"f":"Direct"},{"n":7,"text":"With reference to technologies for solar power production, consider the following statements:\n1. ‘Photovoltaic’ is a technology that generates electricity by direct conversion of light into electricity, while ‘Solar Thermal’ is a technology that utilizes the Sun’s rays to generate heat which is further used in electricity generation ":"Certifying the skills acquired by trainees under the National Skill Development Programme."},"s":"science","ca":true,"f":"Direct"},{"n":4,"text":"From the ecological point of view, which one of the following assumes importance in being a good link between the Eastern Ghats and the Western Ghats ?","options":{"a":"Sathyamangalam Tiger Reserve","b":"Nallamala Forest","c":"Nagarhole National Park","d":"Seshachalam Biosphere Reserve"},"s":"environment","ca":false,"f":"Direct"},{"n":5,"text":"One of the implications of equality in society is the absence of","options":{"a":"Privileges","b":"Restraints","c":"Competition","d":"Ideology"},"s":"misc","ca":true,"f":"Direct"},{"n":6,"text":"Consider the following statements in respect of Trade Related Analysis of Fauna and Flora in Commerce (TRAFFIC):\n1. TRAFFIC is a bureau under United Nations Environment Programme (UNEP).\n2. The mission of TRAFFIC is to ensure that trade in wild plants and animals is not a threat to the conservation of nature.\nWhich of the above statements is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both1 and 2","d":"Neither 1 nor 2"},"s":"environment","ca":true,"f":"Multiple statements"},{"n":7,"text":"Which principle among the following was added to the Directive Principles of State Policy by the 42\" Amendment to the Constitution ?","options":{"a":"Equal pay for equal work for both men and women","b":"Participation of workers in the management of industries","c":"Right to work, education and public assistance","d":"Securing living wage and human conditions of work to workers"},"s":"polity","ca":false,"f":"Direct"},{"n":8,"text":"Which one of the following statements is correct ?","options":{"a":"Rights are claims of the State against the citizens.","b":"Rights are privileges which are incorporated in the Constitution of a State.","c":"Rights are claims of the citizens against the State.","d":"Rights are privileges of a few citizens against the many."},"s":"polity","ca":false,"f":"Direct"},{"n":9,"text":"Which of the following gives ‘Global Gender Gap Index’ ranking to the countries of the world ?","options":{"a":"World Economic Forum","b":"UN Human Rights Council","c":"UN Women ‘a","d":"World Health Organization"},"s":"international","ca":true,"f":"Direct"},{"n":10,"text":"Which of the following statements is/are correct regarding Smart India Hackathon 2017 ?\n1. It is a centrally sponsored scheme for developing every city of our country into Smart Cities in a decade.\n2. It is an initiative to identify new digital technology innovations for solving the many problems faced by our country.\n3. It is a programme aimed at making all the financial transactions in our country completely digital in a decade.\nSelect the correct answer using the code given below:","options":{"a":"1 and 3 only","b":"2 only","c":"3 only","d":"2 and 3 only"},"s":"science","ca":true,"f":"Multiple statements"},{"n":11,"text":"Which of the following statements is/are correct regarding the Monetary Policy Committee (MPC) ?\n1. It decides the RBI’s benchmark interest rates.\n2. It is a 12-member body including the Governor of RBI and is reconstituted every year..\n3. It functions under the chairmanship of the Union Finance Minister.\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"1 and 2 only","c":"3 only","d":"2 and 3 only"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":12,"text":"With reference to Manipuri Sankirtana, consider the following statements:\n1. It is a song and dance performance.\n2. Cymbals are the only musical instruments used in the performance. S: It is performed to narrate the life and deeds of Lord Krishna.\nWhich of the statements given above is/are correct ?","options":{"a":"1, 2 and 3","b":"1 and 3 only","c":"2 and 3 only 2","d":"1 only"},"s":"history","ca":false,"f":"Multiple statements"},{"n":13,"text":"Who among the following was/were associated with the introduction of Ryotwari Settlement in India durin gy’ seen in the news refers to","options":{"a":"ASEAN","b":"BRICS ’","c":"EU","d":"G20"},"s":"science","ca":true,"f":"Direct"},{"n":19,"text":"At one of the places in India, if you stand on the seashore and watch the sea, you will find that the sea water recedes from the shore line a few kilometres and comes back to the shore, twice a day, and you can actually walk on the sea floor when the water recedes. This unique phenomenon is seen at","options":{"a":"Bhavnagar","b":"Bheemunipatnam","c":"Chandipur","d":"Nagapattinam"},"s":"geography","ca":false,"f":"Direct"},{"n":20,"text":"With reference to the ‘Prohibition of Benami Property Transactions Act, 1988 (PBPT Act)’, consider the following statements:\n1. A property transaction is not treated as a benami transaction if the owner of the property is not aware of the transaction.\n2. Properties held benami are liable for confiscation by the Government.\n3. The Act provides for three authorities for investigations but does not provide for any appellate mechanism.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"1 and 3 only","d":"2 and 3 only"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":21,"text":"Due to some reasons, if there is a huge fall in the population of species of butterflies, what could be its likely consequence/consequences ?\n1. Pollination of some plants could be adversely affected.\n2. There could be a drastic increase in the fungal infections of some cultivated plants.\n3. It could Jead to a fall in the population of some species of wasps, spiders and - birds.\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only d","c":"1 and 3 only","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":22,"text":"It is possible to produce algae based biofuels, but what is/are the likely limitation(s) of developing countries in promoting this industry ?\n1. Production of algae based biofuels is po text":"The terms ‘Event Horizon’, ‘Singularity’, ‘String Theory’ and ‘Standard Model’ are sometimes seen in the news in the context of","options":{"a":"Observation and understanding of the Universe","b":"Study of the solar and the lunar eclipses","c":"Placing satellites in the orbit of the ‘ Earth","d":"Origin and evolution of living organisms on the Earth"},"s":"science","ca":true,"f":"Direct"},{"n":45,"text":"With reference to agriculture in India, how ean the technique of ‘genome sequencing’, often seen in the news, be used in the immediate future ?\n1. Genome sequencing can be used to identify genetic markers for disease resistance and drought tolerance in various crop plants.\n2. This technique helps in reducing the time required to develop new varieties of crop plants.\n3. It can be used to decipher the host-pathogen relationships in crops.\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":46,"text":"The main advantage of the parliamentary form of government is that","options":{"a":"the executive and legislature work independently.","b":"it provides continuity of policy and is more efficient.","c":"the executive remains responsible to the legislature. ’","d":"the head of the government cannot be changed without election."},"s":"polity","ca":false,"f":"Direct"},{"n":47,"text":"In the context of India, which one of the following is the correct relationship between Rights and Duties ?","options":{"a":"Rights are correlative with Duties.","b":"Rights are personal and hence independent of society and Duties.","c":"Rights, not Duties, are important for the advancement of the personality of the citizen.","d":"Duties, not Rights, are important for the stability of the State."},"s":"economy","ca":false,"f":"Direct"},{"n":48,"text":"The mind of the makers of the Constitution of India is reflected in which of the following ?","opti
