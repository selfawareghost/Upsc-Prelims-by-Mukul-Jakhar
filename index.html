PYQ.register("2022", {"id":"2022","year":2022,"title":"Civil Services (Preliminary) Examination 2022","paper":"General Studies Paper I","series":"A","durationMin":120,"type":"text","key":"bcbcadadacbbbbbbddbabdbcbacbbbdddcbddcbcabdbcaaaaccbdbbcbdbbxdbbcdcdaccaadcaaddadccbdbcbbabbbaaadddb","keyNote":"Official answer key released by UPSC.","questions":[{"n":1,"text":"“Rapid Financing Instrument” and “Rapid Credit Facility” are related to the provisions of lending by which one of the following ?","options":{"a":"Asian Development Bank","b":"International Monetary Fund","c":"United Nations Environment Programme Finance Initiative","d":"World Bank"},"s":"economy","ca":true,"f":"Direct"},{"n":2,"text":"With reference to the Indian economy, consider the following statements:\n1. An increase in Nominal Effective Exchange Rate (NEER) indicates the appreciation of rupee.\n2. An increase in the Real Effective Exchange Rate (REER) indicates an improvement in trade competitiveness.\n3. An increasing trend in domestic inflation relative to inflation in other countries is likely to cause an increasing divergence between NEER and REER.\nWhich of the above statements are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":3,"text":"With reference to the Indian economy, consider the following statements:\n1. If the inflation is too high, Reserve Bank of India (RBI) is likely to buy government securities.\n2. _—‘sIf the rupee is rapidly depreciating, RBI is likely to sell dollars in the market.\n3. If interest rates in the USA or European Union were to fall, that is likely to induce RBI to buy dollars.\nWhich of the ‘statements given above are correct ?","options":{"a":"1 and 2 only","b":"2and3 only —","c":"1 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":4,"text":"With reference to the “G20 Common Framework”, consider the following statements:\n1. It is an initiative endorsed by the G20 together with the Paris Club.\n2. ‘It is an initiative to support Low Income Countries with unsustainable debt.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":5,"text":"With reference to the Indian economy, what are the advantages of “Inflation-Indexed Bonds (IIBs)” ?.\n1. Government can reduce the coupon rates on its borrowing by way of IIBs.\n2. _IIBs provide protection to the investors from uncertainty regarding inflation.\n3. The interest received as well as capital gains on IIBs are not taxable.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":6,"text":"With reference to foreign-owned e-commerce firms operating in India, which of the following statements is/are correct ?\n1. They can sell their own goods in addition to offering their platforms as market-places.\n2. The degree to which they can own big sellers on their platforms is limited.\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":7,"text":"Which of the following activities constitute real sector in the economy ?\n1. Farmers harvesting their crops\n2. Textile mills converting raw cotton into fabrics\n3. A commercial bank lending money to a trading company\n4. A corporate body issuing Rupee Denominated Bonds overseas\nSelect the correct answer using the code given below:","options":{"a":"1 and 2 only","b":"2, 3 and 4 only","c":"1, 3 and 4 only","d":"1, 2, 3 and 4"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":8,"text":"Which one of the following situations best reflects “Indirect Transfers” often talked about in media recently with reference to India ?","options":{"a":"An Indian company investing in a foreign enterprise and paying taxes to the foreign country on the profits arising out of its investment","b":"A foreign company investing in India and paying taxes to the country of its base on the profits arising out of its investment","c":"An Indian company purchases tangible assets in a foreign country and sells such assets after their value increases and transfers the proceeds to India","d":"A foreign company transfers shares and such shares derive their substantial value from assets located in India"},"s":"economy","ca":true,"f":"Direct"},{"n":9,"text":"With reference to the expenditure made by an organisation or a company, which of the following statements is/are correct ?\n1. Acquiring new technology is capital expenditure.\n2. Debt financing is considered capital expenditure, while equity financing is considered revenue expenditure.\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":10,"text":"With reference to the Indian economy, consider the following statements:\n1. A share of the household financial savings goes towards government borrowings.\n2. Dated securities issued at market-related rates in auctions form a large component of internal debt.\nWhich of the above statements is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":11,"text":"Consider the following statements:\n1. Pursuant to the report of H.N. Sanyal Committee, the Contempt of Courts Act, 1971 was passed.\n2. The Constitution of India empowers the Supreme Court and the High Courts to punish for contempt of themselves.\n3. The Constitution of India defines Civil Contempt and Criminal Contempt.\n4. In India, the Parliament is vested with the powers to make laws on Contempt of Court.\nWhich of the statements given above is/are correct?","options":{"a":"1 and 2 only","b":"1, 2 and 4","c":"3 and 4 only","d":"3 only"},"s":"polity","ca":true,"f":"Multiple statements"},{"n":12,"text":"With reference to India, consider the following statements:\n1. Government law officers and legal firms are recognised as advocates, but corporate lawyers and patent attorneys are excluded from recognition as advocates.\n2. Bar Councils have the power to lay down the rules relating to legal education and recognition of law colleges.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"science","ca":true,"f":"Multiple statements"},{"n":13,"text":"Consider the following statements:\n1. A bill amending the Constitution requires a prior recommendation of the President of India.\n2. When a Constitution Amendment Bill is presented to the President of India, it is obligatory for the President of India to give his/her assent.\n3. A Constitution Amendment Bill must be passed by both the Lok Sabha and the Rajya Sabha by a special majority and there is no provision for joint sitting.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":14,"text":"Consider the following statements:\n1. The Constitution of India classifies the ministers into four ranks viz. Cabinet Minister, Minister of State with Independent Charge, Minister of State and Deputy Minister.\n2. The total number of ministers in the Union Government, including the Prime Minister, shall not exceed 15 percent of the total number of members in the Lok Sabha.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":15,"text":"Which of the following is/are the exclusive power(s) of Lok Sabha ?\n1. Toratify the declaration of Emergency\n2. To pass a motion of no-confidence against the Council of Ministers\n3. To impeach the President of India\nSelect the correct answer using the code given below:","options":{"a":"1 and 2","b":"2 only","c":"1 and 3","d":"3 only"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":16,"text":"With reference to anti-defection law in India, consider the following statements:\n1. The law specifies that a nominated legislator cannot join any political party within six months of being appointed to the House.\n2. The law does not provide any time-frame within which the presiding officer has to decide a defection case.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":17,"text":"Consider the following statements:\n1. Attorney General of India and Solicitor General of India are the only officers of the Government who are allowed to participate in the meetings of the Parliament of India.\n2. According to the Constitution of India, the Attorney General of India submits his resignation when the Government which appointed him resigns.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2.","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":18,"text":"With reference to the writs issued by the Courts in India, consider the following statements:\n1. Mandamus will not lie against a private ’ organisation unless it is entrusted with a public duty.\n2. Mandamus will not lie against a Company even though it may be a Government Company.\n3. Any public minded person can be a petitioner to move the Court to obtain the writ of Quo Warranto.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":19,"text":"With reference to Ayushman Bharat Digital Mission, consider the following statements:\n1. Private and public hospitals must adopt it.\n2. As it aims to achieve universal health coverage, every citizen of India should be part of it ultimately.\n3. It has seamless portability across the country.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2 only","b":"3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":20,"text":"With reference to Deputy Speaker of Lok Sabha, consider the following statements:\n1. As per the Rules of Procedure and Conduct of Business in Lok Sabha, the election of Deputy Speaker shall be held on such date as the Speaker may fix.\n2. There is a mandatory provision that the / election of a candidate as Deputy Speaker of Lok Sabha shall be from either the principal opposition party or the ruling party.\n3. The Deputy Speaker has the same power as of the Speaker when presiding over the sitting of the House and no appeal lies against his rulings.\n4. The well established parliamentary practice regarding the appointment of Deputy Speaker is that the motion is moved by the Speaker and duly seconded by the Prime Minister.\nWhich of the statements given above are correct ?","options":{"a":"1 and 3 only","b":"1, 2 and 3","c":"3 and 4 only","d":"2 and 4 only"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":21,"text":"Among the following crops, which one is the most important anthropogenic source of both methane and nitrous oxide ?","options":{"a":"Cotton","b":"Rice","c":"Sugarcane","d":"Wheat"},"s":"geography","ca":false,"f":"Direct"},{"n":22,"text":"“System of Rice Intensification” of cultivation, in which alternate wetting and drying of rice fields is practised, results in:\n1. Reduced seed requirement\n2. Reduced methane production\n3. Reduced electricity consumption\nSelect the correct answer using the code given below:","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":23,"text":"Which one of the following lakes of West Africa has become dry and turned into a desert ?","options":{"a":"Lake Victoria","b":"Lake Faguibine","c":"Lake Oguta","d":"Lake Volta"},"s":"geography","ca":false,"f":"Direct"},{"n":24,"text":"Gandikota canyon of South India was created by which one of the following rivers ?","options":{"a":"Cauvery","b":"Manjira","c":"Pennar","d":"Tungabhadra"},"s":"geography","ca":false,"f":"Direct"},{"n":25,"text":"Consider the following pairs:\nPeak Mountains;\n1. Namcha Barwa — Garhwal Himalaya\n2. NandaDevi — Kumaon Himalaya\n3. Nokrek — Sikkim Himalaya\nWhich of the pairs given above is/are correctly matched ?","options":{"a":"1 and 2","b":"2 only","c":"1 and 3","d":"3 only"},"s":"science","ca":true,"f":"Match / pairs"},{"n":26,"text":"The term “Levant” often heard in the news roughly corresponds to which of the following regions ?","options":{"a":"Region along the eastern Mediterranean shores","b":"Region along North African shores stretching from Egypt to Morocco","c":"Region along Persian Gulf and Horn of Africa","d":"The entire coastal areas of Mediterranean Sea"},"s":"international","ca":true,"f":"Direct"},{"n":27,"text":"Consider the following countries:\n1. Azerbaijan\n2. Kyrgyzstan\n3. Tajikistan\n4. Turkmenistan\n5. Uzbekistan\nWhich of the above have borders with Afghanistan ?","options":{"a":"1, 2 and 65 only","b":"1, 2, 3 and 4 only","c":"3, 4 and 5 only","d":"1, 2, 3, 4 and 5"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":28,"text":"With reference to India, consider the following statements:\n1. Monazite is a source of rare earths.\n2. Monazite contains thorium.\n3. Monazite occurs naturally in the entire Indian coastal sands in India.\n4. In India, Government bodies only can process or export monazite.\nWhich of the statements given above are correct ?","options":{"a":"1, 2 and 3 only","b":"1, 2 and 4 only","c":"3 and 4 only","d":"1, 2, 3 and 4"},"s":"science","ca":true,"f":"Multiple statements"},{"n":29,"text":"In the northern hemisphere, the logeht aay, of the year normally occurs in the: i}","options":{"a":"First half ofthe month ofJune","b":"Second half ofthe month of June","c":"First half ofthe month of July","d":"Second half of the month of July"},"s":"misc","ca":true,"f":"Direct"},{"n":30,"text":"Consider the following pairs: Wetland / Lake Location\n1. Hokera Wetland — Punjab\n2. Renuka Wetland — Himachal Pradesh\n3. Rudrasagar Lake — Tripura\n4. Sasthamkotta — Tamil Nadu Lake;\nHow many pairs given above are correctly matched ?","options":{"a":"Only one pair","b":"Only two pairs","c":"Only three pairs","d":"All four pairs"},"s":"environment","ca":false,"f":"How many"},{"n":31,"text":"Consider the following:\n1. Aarogya Setu\n2. CoWIN\n3. DigiLocker\n4. DIKSHA\nWhich of the above are built on top of open-source digital platforms?","options":{"a":"1 and 2 only","b":"2, 3 and 4 only","c":"1, 3 and 4 only","d":"1, 2, 3 and 4"},"s":"science","ca":true,"f":"Multiple statements"},{"n":32,"text":"With reference to Web 3.0, consider the following statements:\n1. Web 3.0 technology enables people to control their own data.\n2. In Web 3.0 world, there can be blockchain based social networks.\n3. Web 3.0 is operated by users collectively rather than a corporation.\nWhich of the statements given above are correct?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":33,"text":"With reference to “Software as a Service (SaaS)”, consider the following statements:\n1. SaaS buyers can customise the user interface and can change data fields.\n2. SaaS users can access their data through their mobile devices.\n3. Outlook, Hotmail and Yahoo! Mail are forms of SaaS.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":34,"text":"Which one of the following statements best reflects the idea behind the “Fractional Orbital Bombardment System” often talked about in media ?","options":{"a":"A hypersonic missile is launched into space to counter the asteroid approaching the Earth and explode it in space.","b":"A spacecraft lands on another planet after making several orbital motions.","c":"A missile is put into a stable orbit around the Earth and deorbits over a target on the Earth.","d":"A spacecraft moves along a comet with the same speed and places a probe on its surface."},"s":"science","ca":true,"f":"Direct"},{"n":35,"text":"Which one of the following is the context in which the term “qubit” is mentioned ?","options":{"a":"Cloud Services","b":"Quantum Computing","c":"Visible Light Communication Technologies","d":"Wireless Communication Technologies"},"s":"science","ca":true,"f":"Direct"},{"n":36,"text":"Consider the following communication technologies:\n1. Closed-circuit Television\n2. Radio Frequency Identification\n3. Wireless Local Area Network Which of the above are considered Short-Range devices/technologies ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":37,"text":"Consider the following statements:\n1. 1. Biofilms can form on medical implants within human tissues.\n2. Biofilms can form on food and food processing surfaces.\n3. Biofilms can exhibit antibiotic resistance.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":38,"text":"Consider the following statements in respect of probiotics:\n1. ‘Probiotics are made of both bacteria and yeast.\n2. ‘The organisms in probiotics are found in foods we ingest but they do not naturally occur in our gut.\n3. Probiotics help in the digestion of milk sugars.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"1 and 3","d":"2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":39,"text":"In the context of vaccines manufactured to prevent pandemic, consider the following statements:\n1. The Serum Institute of India produced vaccine named Covishield using mRNA platform.\n2. Sputnik V vaccine is manufactured using vector based platform.\n3. COVAXIN is an inactivated pathogen based vaccine.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":40,"text":"Ifa major solar storm (solar flare) reaches the Earth, which of the following are the possible effects on the Earth ?\n1. GPS and navigation systems could fail.\n2. Tsunamis could occur at equatorial regions.\n3. Power grids could be damaged.\n4. Intense auroras could occur over much of the Earth.\n5. Forest fires could take place over much\n6. Orbits of the satellites could be disturbed.\n7. Shortwave radio communication of the aircraft flying over polar regions could be interrupted. Select the correct answer using the code given below:","options":{"a":"1, 2, 4 and 5 only","b":"2, 3, 5, 6 and 7 only","c":"1, 3, 4, 6 and 7 only","d":"1, 2, 3, 4, 5, 6 and 7"},"s":"science","ca":true,"f":"Multiple statements"},{"n":41,"text":"“Climate Action Tracker” which monitors the emission reduction pledges of different countries is a:","options":{"a":"Database created by coalition of research organisations","b":"Wing of “International Panel of Climate Change”","c":"Committee under “United Nations Framework Convention on Climate Change”","d":"Agency promoted and financed by United Nations Environment Programme and World Bank"},"s":"environment","ca":true,"f":"Direct"},{"n":42,"text":"Consider the following statements:\n1. “The Climate Group” is an international non-profit organization that drives climate action by building large networks and runs them.\n2. The International Energy Agency in partnership with the Climate Group launched a global initiative “EP100”.\n3. EP100 brings together leading companies committed to driving innovation in energy efficiency and increasing competitiveness § while delivering on emission reduction goals.\n4. Some Indian companies are members of EP100.\n5. The International Energy Agency is the Secretariat to the “Under2 Coalition”.\nWhich of the statements given above are correct ?","options":{"a":"1, 2, 4 and 5","b":"1, 3 and 4 only","c":"2, 3 and 5 only","d":"1, 2, 3, 4 and 5"},"s":"international","ca":true,"f":"Multiple statements"},{"n":43,"text":"“If rainforests and tropical forests are the lungs of the Earth, then surely wetlands function as its kidneys.” Which one of the following functions of wetlands best reflects the above statement ?","options":{"a":"The water cycle in wetlands involves surface runoff, subsoil percolation and evaporation.","b":"Algae form the nutrient base upon which fish, crustaceans, molluscs, birds, reptiles and mammals thrive.","c":"Wetlands play a vital role in maintaining sedimentation balance and soil stabilization.","d":"Aquatic plants absorb heavy metals and excess nutrients."},"s":"environment","ca":false,"f":"Direct"},{"n":44,"text":"In the context of WHO Air Quality Guidelines, consider the following statements:\n1. The 24-hour mean of PM,,,, should not exceed 15 yg/m® and annual mean of PM,,, should not exceed g/m.\n2. In a year, the highest levels of ozone pollution occur during the periods of inclement weather.\n3. PM,, can penetrate the lung barrier and enter the bloodstream.\n4. Excessive ozone in the air can trigger’ asthma,\nWhich of the statements given above are correct ?","options":{"a":"1, 3 and 4","b":"1 and 4 only","c":"2, 3 and 4","d":"1 and 2 only"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":45,"text":"With reference to “Gucchi” sometimes mentioned in the news, consider the following statements:\n1. Itis a fungus.\n2. It grows in some Himalayan forest areas.\n3. It is commercially cultivated in the Himalayan foothills of north-eastern India.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"3 only","c":"1 and 2","d":"2 and 3"},"s":"geography","ca":true,"f":"Multiple statements"},{"n":46,"text":"With reference to polyethylene terephthalate, the use of which is so widespread in our daily lives, consider the following statements:\n1. Its fibres can be blended with wool and cotton fibres to reinforce their properties.\n2. Containers made of it can be used to store any alcoholic beverage.\n3. Bottles made of it can be recycled into other products.\n4. Articles made of it can be easily disposed of by incineration without causing greenhouse gas emissions.\nWhich of the statements given above are correct ?","options":{"a":"1 and 3","b":"2 and 4","c":"1 and 4","d":"2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":47,"text":"Which of the following is not a bird ?","options":{"a":"Golden Mahseer","b":"Indian Nightjar","c":"Spoonbill","d":"White Ibis"},"s":"environment","ca":false,"f":"Direct"},{"n":48,"text":"Which of the following are nitrogen-fixing plants ?\n1. Alfalfa\n2. Amaranth\n3. Chickpea\n4. Clover\n5. Purslane (Kulfa)\n6. Spinach Select the correct answer using the code given es below:","options":{"a":"1, 3 and 4 only","b":"1, 3, 5 and 6 only 1","c":"2, 4, 5 and 6 only","d":"1, 2, 4, 5 and 6"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":49,"text":"“Biorock technology” is talked about in which one of the following situations ?","options":{"a":"Restoration of damaged coral reefs","b":"Development of building materials using plant residues","c":"Identification of areas for exploration/extraction of shale gas","d":"Providing salt licks for wild animals in forests/protected areas"},"s":"science","ca":true,"f":"Direct"},{"n":50,"text":"The “Miyawaki method” is well known for the:","options":{"a":"Promotion of commercial farming in arid and semi-arid areas","b":"Development oof gardens using genetically modified flora","c":"Creation of mini forests in urban areas","d":"Harvesting wind energy on coastal areas and on sea surfaces"},"s":"environment","ca":false,"f":"Direct"},{"n":51,"text":"In the Government of India Act 1919, the: functions of Provincial Government were divided into “Reserved” and “Transferred” subjects. Which of the following were treated as “Reserved” subjects ?\n1. Administration of Justice\n2. Local Self-Government\n3. Land Revenue\n4. Police\nSelect the correct answer using the code given below:","options":{"a":"1, 2 and 3","b":"2, 3 and 4","c":"1, 3 and 4","d":"1, 2 and 4"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":52,"text":"In medieval India, the term “Fanam” referred to","options":{"a":"clothing","b":"coins","c":"ornaments","d":"weapons"},"s":"history","ca":false,"f":"Direct"},{"n":53,"text":"Consider the following freedom fighters:\n1. Barindra Kumar Ghosh\n2. Jogesh Chandra Chatterjee\n3. Rash Behari Bose\nWho of the above was/were actively associated with the Ghadar Party ?","options":{"a":"1 and 2","b":"2 only","c":"1 and 3","d":"3 only"},"s":"history","ca":false,"f":"Multiple statements"},{"n":54,"text":"With reference to the proposals of Cripps Mission, consider the following statements:\n1. The Constituent Assembly would have members nominated by the Provincial Assemblies as well as the Princely States.\n2. Any Province, which is not prepared to accept the new Constitution would have the right to sign a separate agreement with Britain regarding its future status.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":true,"f":"Multiple statements"},{"n":55,"text":"With reference to Indian history, consider the following texts:\n1. Nettipakarana\n2.‘ Parishishtaparvan\n8. Avadanashataka\n4. Trishashtilakshana Mahapurana\nWhich of the above are Jaina texts ?","options":{"a":"1, 2 and 3","b":"2 and 4 only","c":"1, 3 and 4","d":"2, 3 and 4"},"s":"history","ca":false,"f":"Multiple statements"},{"n":56,"text":"With reference to Indian history, consider the following pairs:\nHistorical person Known as\n1. Aryadeva — Jaina scholar\n2. Dignaga — Buddhist scholar\n3. Nathamuni — Vaishnava scholar\nHow many pairs given above are correctly matched ?","options":{"a":"None of the pairs","b":"Only one pair","c":"Only two pairs","d":"All three pairs"},"s":"history","ca":false,"f":"How many"},{"n":57,"text":"With reference to Indian history, consider the following statements:\n1. The first Mongol invasion of India happened during the reign of Jalal-ud-din Khalji.\n2. During the reign of Ala-ud-din Khalji, one Mongol assault marched up to Delhi and besieged the city.\n3. Muhammad-bin-Tughlaq temporarily lost portions of north-west of his kingdom to: Mongols. - Which of the statements given above is/are correct ?","options":{"a":"1 and 2","b":"2 only","c":"1 and 3","d":"3 only"},"s":"history","ca":false,"f":"Multiple statements"},{"n":58,"text":"With reference to Indian history, who of the following were known as “Kulah-Daran” ?","options":{"a":"Arab merchants","b":"Qalandars","c":"Persian calligraphists","d":"Sayyids"},"s":"international","ca":true,"f":"Direct"},{"n":59,"text":"With reference to Indian history, consider the following statements:\n1. The Dutch established their factories/warehouses on the east coast on lands granted to them by Gajapati rulers.\n2. Alfonso de Albuquerque captured Goa from the Bijapur Sultanate.\n3. The English East India Company established a factory at Madras on a plot of 1 and leased from a representative of the Vijayanagara empire.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"history","ca":false,"f":"Multiple statements"},{"n":60,"text":"According to Kautilya’s Arthashastra, which of the following are correct ?\n1. A person could be a slave as a result of a judicial punishment.\n2. Ifa female slave bore her master a son, she was legally free.\n3. If a son born to a female slave was fathered by her master, the son was entitled to the legal status of the master’s son.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"history","ca":false,"f":"Multiple statements"},{"n":61,"text":"Consider the following statements:\n1. Tight monetary policy of US Federal Reserve could lead to capital flight.\n2. Capital flight may increase the interest cost of firms with existing External Commercial Borrowings (ECBs).\n3. Devaluation of domestic currency decreases the currency risk associated with ECBs.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":62,"text":"Consider the following States:\n1. Andhra Pradesh\n2. Kerala\n3. Himachal Pradesh\n4. ‘Tripura\nHow many of the above are generally known as tea-producing States ?","options":{"a":"Only one State","b":"Only two States","c":"Only three States","d":"All four States"},"s":"geography","ca":false,"f":"How many"},{"n":63,"text":"Consider the following statements:\n1. In India, credit rating agencies are regulated by Reserve Bank of India.\n2. The rating agency popularly known as ICRA is a public limited company.\n3. Brickwork Ratings is an Indian credit rating agency.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":64,"text":"With reference to the ‘Banks Board Bureau (BBB)’, which of the following statements are correct ?\n1. The Governor of RBI is the Chairman of BBB.\n2. BBB recommends for the selection of heads for Public Sector Banks.\n3. BBB helps the Public Sector Banks in developing strategies and capital raising plans.\nSelect the correct answer using the code given below:","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":65,"text":"With reference to Convertible Bonds, consider the following statements:\n1. As there is an option to exchange the bond for equity, Convertible Bonds pay a lower rate of interest.\n2. The option to convert to equity affords the bondholder a degree of indexation to rising consumer prices.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":66,"text":"Consider the following:\n1. Asian Infrastructure Investment Bank\n2. Missile Technology Control Regime\n3. Shanghai Cooperation Organisation India is a member of which of the above ?","options":{"a":"1 and 2 only","b":"S3 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":67,"text":"Consider the following statements:\n1. Vietnam has been one of the fastest growing economies in the world in the recent years.\n2. Vietnam is led by a multi-party political system.\n3. Vietnam’s economic growth is linked to its integration with global supply chains and focus on exports.\n4. For a long time Vietnam’s low labour costs and stable exchange rates have attracted global manufacturers.\n5. Vietnam has the most productive e-service sector in the Indo-Pacific region.\nWhich of the statements given above are correct ?","options":{"a":"2 and 4","b":"3 and 5","c":"1, 3 and 4","d":"1 and 2"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":68,"text":"In India, which one of the following is responsible for maintaining price stability by controlling inflation ?","options":{"a":"Department of Consumer Affairs","b":"Expenditure Management Commission","c":"Financial Stability and Development Council","d":"Reserve Bank of India"},"s":"economy","ca":true,"f":"Direct"},{"n":69,"text":"With reference to Non-Fungible Tokens (NFTs), consider the following statements:\n1. They enable the digital representation of physical assets.\n2. They are unique cryptographic tokens that exist on a blockchain.\n3. They can be traded or exchanged at equivalency and therefore can be used as a medium of commercial transactions.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":70,"text":"Consider the following pairs: Reservoirs States\n1. Ghataprabha — Telangana\n2. GandhiSagar — Madhya Pradesh\n3. IndiraSagar — Andhra Pradesh\n4. Maithon — Chhattisgarh\nHow many pairs given above are not correctly matched ?","options":{"a":"Only one pair","b":"Only two pairs","c":"Only three pairs","d":"All four pairs"},"s":"history","ca":false,"f":"How many"},{"n":71,"text":"In India, which one of the following compiles information on industrial disputes, closures, retrenchments and lay-offs in factories employing workers ?","options":{"a":"Central Statistics Office","b":"Department for Promotion of Industry and Internal Trade","c":"Labour Bureau","d":"National Technical Manpower Information System"},"s":"economy","ca":false,"f":"Direct"},{"n":72,"text":"In India, what is the role of the Coal Controller’s Organization (CCO) ?\n1. CCO is the major source of Coal Statistics in Government of India.\n2. It monitors progress of development of Captive Coal/Lignite blocks.\n3. It hears any objection to the Government’s notification relating to acquisition of coal-bearing areas.\n4. It ensures that coal mining companies deliver the coal to end users in the prescribed time.\nSelect the correct answer using the code given below:","options":{"a":"1, 2 and 3","b":"3 and 4 only","c":"1 and 2 only","d":"1, 2 and 4"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":73,"text":"Ifa particular area is brought under the Fifth Schedule of the Constitution of India, which one of the following statements best reflects the consequence of it ?","options":{"a":"This would prevent the transfer of 1 and of tribal people to non-tribal people.","b":"This would create a local self-governing body in that area.","c":"This would convert that area into a Union Territory.","d":"The State having such areas would be declared a Special Category State."},"s":"polity","ca":false,"f":"Direct"},{"n":74,"text":"Consider the following statements:\n1. The India Sanitation Coalition is a platform to promote sustainable sanitation and is funded by the Government of India and the World Health Organization.\n2. The National Institute of Urban Affairs is an apex body of the Ministry of Housing and Urban Affairs in Government of India and provides innovative solutions to address the challenges of Urban India.\nWhich of the statements given above is/are correct ? '","options":{"a":"Lonly","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"international","ca":true,"f":"Multiple statements"},{"n":75,"text":"Which one of the following has been constituted. under the Environment (Protection) Act, 1986 ?","options":{"a":"Central Water Commission","b":"Central Ground Water Board","c":"Central Ground Water Authority","d":"National Water Development Agency Ip Pigs"},"s":"environment","ca":true,"f":"Direct"},{"n":76,"text":"With reference to the “United Nations Credentials Committee”, consider the following statements:\n1. It is a committee set up by the UN Security Council and works under its supervision. a It traditionally meets in March, June and September every year.\n3. It assesses the credentials of all UN members before submitting a report to the General Assembly for approval.\nWhich of the statements given above is/are correct ?","options":{"a":"3 only","b":"1 and 3","c":"2 and 3","d":"1 and 2"},"s":"international","ca":true,"f":"Multiple statements"},{"n":77,"text":"Which one of the following statements best describes the ‘Polar Code’ ?","options":{"a":"It is the international code of safety for ships operating in polar waters.","b":"It is the agreement of the countries around the North Pole regarding the demarcation of their territories in the polar region.","c":"It is a set of norms to be followed by the countries whose scientists undertake research studies in the North Pole and South Pole.","d":"It is a trade and security agreement of the member countries of the Arctic Council."},"s":"geography","ca":false,"f":"Direct"},{"n":78,"text":"With reference to the United Nations General Assembly, consider the following statements:\n1. The UN General Assembly can grant observer status to the non-member States.\n2. Inter-governmental organisations can seek observer status in the UN General Assembly.\n3. Permanent Observers in the UN General Assembly can maintain missions at the UN headquarters.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"international","ca":true,"f":"Multiple statements"},{"n":79,"text":"With reference to the “Tea Board” in India, consider the following statements:\n1. The Tea Board is a statutory body.\n2. It is a regulatory body attached to the Ministry of Agriculture and Farmers Welfare.\n3. The Tea Board’s Head Office is situated in Bengaluru.\n4. The Board has overseas offices at Dubai and Moscow.\nWhich of the statements given above are correct ?","options":{"a":"1 and 3","b":"2 and 4","c":"Sand4","d":"1 and 4"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":80,"text":"Which one of the following best describes the term “greenwashing” ?","options":{"a":"Conveying a false impression that a — company’s products are eco-friendly and environmentally sound","b":"Non-inclusion of ecological/ environmental costs in the Annual Financial Statements of a country","c":"Ignoring the disastrous ecological consequences while undertaking infrastructure development","d":"Making mandatory provisions for environmental costs in a government project/programme"},"s":"environment","ca":true,"f":"Direct"},{"n":81,"text":"Consider the following statements:\n1. High clouds primarily reflect solar radiation and cool the surface of the Earth.\n2. Low clouds have a high absorption of infrared radiation emanating from the Earth’s surface and thus cause warming effect.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"science","ca":true,"f":"Multiple statements"},{"n":82,"text":"Consider the following statements:\n1. Bidibidi is a large refugee settlement in north-western Kenya.\n2. Some people who fled from South Sudan civil war live in Bidibidi.\n3. Some people who fled from civil war in Somalia live in Dadaab refugee complex in Kenya.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2","b":"2 only","c":"2 and 3","d":"3 only"},"s":"science","ca":true,"f":"Multiple statements"},{"n":83,"text":"Consider the following countries:\n1. Armenia\n2. Azerbaijan\n3. Croatia\n4. Romania\n5. Uzbekistan\nWhich of the above are members of the Organization of Turkic States ?","options":{"a":"1, 2 and 4","b":"1 and 3","c":"2 and 5","d":"3, 4 and 5"},"s":"international","ca":true,"f":"Multiple statements"},{"n":84,"text":"Consider the following statements:\n1. Gujarat has the largest solar park in India.\n2. Kerala has a fully solar powered International Airport.\n3. Goa has the largest floating solar photovoltaic project in India. Which of the statements given above is/are correct ?","options":{"a":"1 and 2","b":"2 only","c":"1 and 3","d":"3 only"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":85,"text":"With reference to the United Nations Convention on the Law of Sea, consider the following statements:\n1. Acoastal state has the right to establish the breadth of its territorial sea up to a limit not exceeding 12 nautical miles, measured from baseline determined in ie accordance with the convention.\n2. Ships of all states, whether coastal or 1 and-locked, enjoy the right of innocent passage through the territorial sea.\n3. The Exclusive Economic Zone shall not extend beyond 200 nautical miles from the baseline from which the breadth of the territorial sea is measured. Which of the statements given above are correct ?","options":{"a":"and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":86,"text":"Which one of the following statements best reflects the issue with Senkaku Islands, sometimes mentioned in the news ?","options":{"a":"It is generally believed that they are artificial islands made by a country around South China Sea.","b":"China and Japan engage in maritime disputes over these islands in East China Sea.","c":"A permanent American military base has been set up there to help Taiwan to increase its defence capabilities.","d":"Though International Court of Justice declared them as no man’s 1 and, some South-East Asian countries claim them."},"s":"geography","ca":true,"f":"Direct"},{"n":87,"text":"Consider the following pairs: Country Important reason for being in the news recently\n1. Chad — Setting up of permanent\n2. Guinea — Suspension of Constitution and Government by military\n3. Lebanon — Severe and prolonged economic depression\n4. Tunisia — Suspension of Parliament by President\nHow many pairs given above are correctly matched ?","options":{"a":"Only one pair","b":"Only two pairs","c":"Only three pairs","d":"All four pairs"},"s":"economy","ca":true,"f":"How many"},{"n":88,"text":"Consider the following pairs:\nRegion often mentioned in the news — Country\n1. Anatolia — Turkey\n2. Amhara — Ethiopia\n3. Cabo Delgado — Spain\n4. Catalonia — Italy\nHow many pairs given above are correctly matched?","options":{"a":"Only one pair","b":"Only two pairs","c":"Only three pairs","d":"All four pairs"},"s":"international","ca":true,"f":"How many"},{"n":89,"text":"With reference to Indian laws about wildlife protection, consider the following statements: 1. Wild animals are the sole property of the government.. 2 When a wild animal is declared protected, such animal is entitled for equal protection whether it is found in protected areas or outside.\n3. Apprehension of a protected wild animal becoming a danger to human life is sufficient ground for its capture or\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2","b":"2 only","c":"1 and 3","d":"3 only"},"s":"environment","ca":false,"f":"Direct"},{"n":90,"text":"Certain species of which one of the following organisms are well known as cultivators of fungi ?","options":{"a":"Ant","b":"Cockroach","c":"Crab","d":"Spider"},"s":"environment","ca":false,"f":"Direct"},{"n":91,"text":"Consider the following pairs: Site of Ashoka’s Location in the major rock edicts State of\n1. Dhauli — Odisha\n2. Erragudi — Andhra Pradesh\n3. Jaugada — Madhya Pradesh\n4. Kalsi — Karnataka\nHow many pairs given above are correctly matched ?","options":{"a":"Only one pair","b":"Only two pairs","c":"Only three pairs","d":"All four pairs"},"s":"history","ca":false,"f":"How many"},{"n":92,"text":"Consider the following pairs: King. Dynasty\n1. Nannuka — Chandela\n2. Jayashakti — Paramara\n3. NagabhataII — Gurjara-Pratihara\n4. Bhoja — Rashtrakuta\nHow many pairs given above are correctly matched ?","options":{"a":"Only one pair","b":"Only two pairs","c":"Only three pairs","d":"All four pairs"},"s":"history","ca":false,"f":"How many"},{"n":93,"text":"Which one of the following statements about Sangam literature in ancient South India is correct ?","options":{"a":"Sangam poems are devoid of any reference to material culture.","b":"The social classification of Varna was known to Sangam poets.","c":"Sangam poems have no reference to warrior ethic.","d":"Sangam literature refers to magical forces as irrational."},"s":"history","ca":false,"f":"Direct"},{"n":94,"text":"“Yogavadsistha” was translated into Persian by Nizamuddin Panipati during the reign of:","options":{"a":"Akbar","b":"Humayun","c":"Shahjahan","d":"Aurangzeb"},"s":"history","ca":false,"f":"Direct"},{"n":95,"text":"The world’s second tallest statue in sitting pose of Ramanuja was inaugurated by the Prime Minister of India at Hyderabad recently. Which one of the following statements correctly represents the teachings of Ramanuja ?","options":{"a":"The best means of salvation was devotion.","b":"Vedas are eternal, self-existent and wholly authoritative.","c":"Logical arguments were essential means for the highest bliss.","d":"Salvation was to be obtained through meditation."},"s":"polity","ca":true,"f":"Direct"},{"n":96,"text":"The Prime Minister recently inaugurated the new Circuit House near Somnath Temple at Veraval. Which of the following statements are correct regarding Somnath Temple ?\n1. Somnath Temple is one of the Jyotirlinga shrines.\n2. A description of Somnath Temple was given by Al-Biruni.\n3. Pran Pratishtha of Somnath Temple (installation of the present day temple) was done by President S. Radhakrishnan. Select the correct answer using the code given below:","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"history","ca":true,"f":"Multiple statements"},{"n":97,"text":"Which one of the following statements best describes the role of B cells and T cells in the human body ? °","options":{"a":"They protect the body from environmental allergens.","b":"They alleviate the body’s pain and inflammation.","c":"They act as immunosuppressants in the body.","d":"They protect the body from the diseases caused by pathogens."},"s":"general-science","ca":false,"f":"Direct"},{"n":98,"text":"Consider the following statements:\n1. Other than those made by humans, nanoparticles do not exist in nature.\n2. Nanoparticles of some metallic oxides are used in the manufacture of some cosmetics.\n3. Nanoparticles of some commercial products which enter the environment are unsafe for humans.\nWhich of the statements given above is/are correct ?","options":{"a":"‘1 only","b":"3 only","c":"1 and 2","d":"2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":99,"text":"Consider the following statements: DNA Barcoding can be a tool to:\n1. assess the age of a plant or animal.\n2. distinguish among species that look alike.\n3. identify undesirable animal or plant materials in processed foods.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"3 only","c":"lLand2","d":"2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":100,"text":"Consider the following:\n1. Carbon monoxide\n2. Nitrogen oxide\n3. Ozone\n4. Sulphur dioxide Excess of which of the above in the environment is/are cause(s) of acid rain ?","options":{"a":"1, 2 and 3","b":"2 and 4 only","c":"4 only","d":"1, 3 and 4"},"s":"environment","ca":false,"f":"Multiple statements"}]});

PYQ.register("2023", {"id":"2023","year":2023,"title":"Civil Services (Preliminary) Examination 2023","paper":"General Studies Paper I","series":"A","durationMin":120,"type":"text","key":"abbaddcaddccaacdbcbcdababbccbcaacxadbbbcabbddbbacdbcacbaddbcacddcdacaabcdbbcbdcaabadcccdadbbdcbbddcc","keyNote":"Official answer key released by UPSC.","questions":[{"n":1,"text":"Consider the following statements:\n1. Jhelum River passes through Wular Lake.\n2. Krishna River directly feeds Kolleru Lake.\n3. Meandering of Gandak River formed Kanwar Lake.\nHow many of the statements given above are correct?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None"},"s":"geography","ca":false,"f":"How many"},{"n":2,"text":"Mundra Port —: Largest privately owned port in India\n3. Visakhapatnam: Largest container port in Port India\nHow many of the above pairs are correctly matched ?","options":{"a":"Only one pair","b":"Only two pairs","c":"All three pairs","d":"None of the pairs"},"s":"geography","ca":false,"f":"How many"},{"n":3,"text":"Consider the following trees:\n1. Jackfruit (Artocarpus heterophyllus)\n2. Mahua (Madhuca indica)\n3. Teak (Tectona grandis)\nHow many of the above are deciduous trees ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None /62A"},"s":"environment","ca":false,"f":"How many"},{"n":4,"text":"Consider the following statements:\n1. India has more arable area than China.\n2. The proportion of irrigated area is more in India as compared to China.\n3. The average productivity per hectare in Indian agriculture is How higher many of than the that above in statements China. are correct ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None"},"s":"international","ca":true,"f":"Multiple statements"},{"n":5,"text":"Which one of the following is the best example of repeated falls in sea level, giving rise to present-day extensive marshland ?","options":{"a":"Bhitarkanika Mangroves","b":"Marakkanam Salt Pans","c":"Naupada Swamp","d":"Rann of Kutch"},"s":"geography","ca":false,"f":"Direct"},{"n":6,"text":"Ilmenite and rutile, abundantly available in certain coastal tracts of India, are rich sources of which one of the following ?","options":{"a":"Aluminium","b":"Copper","c":"Iron","d":"Titanium"},"s":"geography","ca":false,"f":"Direct"},{"n":7,"text":"About three-fourths of world’s cobalt, a metal required for the manufacture of batteries for electric motor vehicles, is produced by","options":{"a":"Argentina","b":"Botswana","c":"the Democratic Republic of the Congo","d":"Kazakhstan"},"s":"science","ca":true,"f":"Direct"},{"n":8,"text":"Which one of the following is a part of the Congo Basin ?","options":{"a":"Cameroon","b":"Nigeria","c":"South Sudan","d":"Uganda"},"s":"geography","ca":false,"f":"Direct"},{"n":9,"text":"Consider the following statements:\n1. 1. Amarkantak Hills are at the confluence of Vindhya and Sahyadri Ranges..\n2. Biligirirangan Hills constitute the easternmost part of Satpura Range.\n3. Seshachalam Hills constitute the southernmost part of Western Ghats.\nHow many of the statements given above are correct ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None"},"s":"geography","ca":false,"f":"How many"},{"n":10,"text":"With reference to India’s projects on connectivity, consider the following statements:\n1. East-West Corridor under Golden Quadrilateral Project connects: Dibrugarh and Surat.\n2. - Trilateral Highway connects Moreh —~ in Manipur and Chiang Mai in, Thailand via Myanmar.\n3. Bangladesh-China-India-Myanmar Economic Corridor connects Varanasi. in Uttar Pradesh with Kunming in China. -\nHow many of the above statements are correct ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None /62A"},"s":"international","ca":true,"f":"How many"},{"n":11,"text":"Consider the following statements:\nStatement-I: India, despite having uranium deposits, depends on coal for most of its electricity production.\nStatement-II: Uranium, enriched to the extent of at least 60%, is required for the production of electricity.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I","b":"Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I","c":"Statement-I is correct but Statement-II is incorrect","d":"Statement-I is incorrect but Statement-II is correct"},"s":"geography","ca":false,"f":"Statement I/II"},{"n":12,"text":"Consider the following statements:\nStatement-I: Marsupials are not naturally found in India.\nStatement-II: é Marsupials can thrive only in montane grasslands with no predators.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I","b":"Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for. Statement-I","c":"Statement-I is correct’ but Statement-II is incorrect","d":"Statement-I is incorrect but Statement-II is correct"},"s":"economy","ca":false,"f":"Statement I/II"},{"n":13,"text":"‘Invasive Species Specialist Group’ (that develops Global Invasive Species Database) belongs to which one of the following organizations ?","options":{"a":"The International Union for Conservation of Nature","b":"The United Nations Environment Programme; ‘","c":"The United Nations World Commission for Environment and Development F","d":"The World Wide Fund for Nature"},"s":"environment","ca":true,"f":"Direct"},{"n":14,"text":"Consider the following fauna:\n1. Lion-tailed Macaque\n2. Malabar Civet\n3. Sambar Deer\nHow many of the above are generally nocturnal or most active after sunset ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None"},"s":"environment","ca":false,"f":"How many"},{"n":15,"text":"Which of the following organisms perform waggle dance for others of their kin to indicate the direction and the distance to a source of their food ?.","options":{"a":"Butterflies","b":"Dragonflies","c":"Honeybees","d":"Wasps /62A"},"s":"environment","ca":false,"f":"Direct"},{"n":16,"text":"Consider the following statements:\n1. Some mushrooms have medicinal properties.\n2. Some mushrooms have psychoactive properties.\n3. Some mushrooms have insecticidal properties.\n4. Some mushrooms have bioluminescent properties.\nHow many of the above statements are correct ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All four"},"s":"environment","ca":false,"f":"How many"},{"n":17,"text":"Consider the following statements regarding the Indian squirrels:\n1. They build nests by making burrows in the ground. ' 2.‘ They store their food materials like nuts and seeds in the ground.\n3. They are omnivorous.\nHow many of the above statements are correct ? ‘","options":{"a":"Only one","b":"Only two","c":"All three","d":"None"},"s":"misc","ca":true,"f":"How many"},{"n":18,"text":"Consider the following ‘statements:\n1. Some microorganisms can grow in environments with temperature above the boiling point of water.\n2. Some microorganisms can grow in environments with temperature below the freezing point of water.\n3. Some microorganisms can grow in highly acidic environment with a pH below 3.\nHow many of the above statements are correct ?:","options":{"a":"Only one","b":"Only two","c":"All three","d":"None."},"s":"environment","ca":false,"f":"How many"},{"n":19,"text":"Which one of the following makes a tool with a stick to scrape insects from a hole in a tree or a log of wood ?","options":{"a":"Fishing cat","b":"Orangutan","c":"Otter","d":"Sloth bear"},"s":"environment","ca":false,"f":"Direct"},{"n":20,"text":"Consider the following:\n1. 1. Aerosols\n2. Foam agents.\n3. Fire retardants\n4. Lubricants In the making of how many of the above are hydrofluorocarbons used ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All four"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":21,"text":"Consider the following statements:\nStatement-I: Interest income from the deposits in Infrastructure Investment Trusts (InvITs) distributed to their investors is exempted from tax, but the dividend is taxable.\nStatement-II: InvITs are recognized as borrowers under the ‘Securitization and Reconstruction of Financial Assets and Enforcement of Security Interest Act, 2002’.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I","b":"Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I","c":"Statement-I is correct but Statement-II is incorrect","d":"Statement-I is incorrect but Statement-II is correct"},"s":"economy","ca":false,"f":"Statement I/II"},{"n":22,"text":"Consider the following statements:\nStatement-I: . In the post-pandemic recent past, many Central Banks worldwide had carried out interest rate hikes.\nStatement-II: Central Banks generally assume that they have the ability to counteract the rising consumer prices via monetary policy means.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II is the \"correct explanation for Statement-I","b":"Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I","c":"Statement-I is correct’ but Statement-II is incorrect","d":"Statement-I is incorrect but Statement-II is correct"},"s":"economy","ca":true,"f":"Statement I/II"},{"n":23,"text":"Consider the following statements:\nStatement-I: Carbon markets are likely to be one of the most widespread tools in the fight against climate change.\nStatement-II: Carbon markets transfer resources from the private sector to the State. \\: Which one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II, are correct and Statement-II is the correct explanation for Statement-I","b":"Both Statement-I and Statement-II ’ are correct and Statement-II is not the correct explanation for Statement-I","c":"Statement-I is correct’ but Statement-II is incorrect","d":"Statement-I is incorrect’ but Statement-II is correct"},"s":"environment","ca":false,"f":"Statement I/II"},{"n":24,"text":"Which one of the following activities of the Reserve Bank of India is considered to be part of ‘sterilization’ ?","options":{"a":"Conducting ‘Open Market Operations’","b":"Oversight of settlement and payment systems","c":"Debt and cash management for the Central and State Governments","d":"Regulating the functions of Non- banking Financial Institutions"},"s":"economy","ca":false,"f":"Direct"},{"n":25,"text":"Consider the following markets:\n1. 1. Government Bond Market\n2. Call Money Market\n3. Treasury Bill Market:\n4. Stock Market\nHow many of the above are included in capital markets ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All four"},"s":"economy","ca":false,"f":"How many"},{"n":26,"text":"Which one of the following best describes the concept of ‘Small Farmer Large Field’ ?","options":{"a":"Resettlement of a large number of people, uprooted from their countries due to war, by giving them a large cultivable 1 and which they cultivate collectively and share the produce","b":"Many marginal farmers in an area organize themselves into groups and synchronize and harmonize selected agricultural operations","c":"Many marginal farmers in an area together make a contract with a corporate body and surrender their 1 and to the corporate body for a fixed term for which the corporate body makes a payment of agreed amount to the farmers","d":"Acompany extends loans, technical knowledge and material inputs to a number of small farmers in an area so that they produce the agricultural commodity required. by the company (for its manufacturing process and commercial production"},"s":"geography","ca":false,"f":"Direct"},{"n":27,"text":"Consider the following statements:\n1. The Government of India provides Minimum Support Price for niger (Guizotia abyssinica) seeds.:\n2. Niger is cultivated as a Kharif crop.\n3. Some tribal people in India use niger seed oil for cooking.\nHow many of the above statements are correct ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None 1, 1"},"s":"geography","ca":false,"f":"How many"},{"n":28,"text":"Consider the investments in the following assets 1. Brand: recognition\n2. Inventory\n3. Intellectual property\n4. Mailing list of clients \"7 How many of the above are considered intangible investments ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All four"},"s":"economy","ca":false,"f":"How many"},{"n":29,"text":"Consider the following:\n1. Demographic performance\n2. Forest and ecology\n3. Governance reforms.\n4. Stable government\n5. Tax and fiscal efforts For the horizontal tax devolution, the Fifteenth Finance Commission used how many of the above as criteria other than population area and income distance ?","options":{"a":"Only two","b":"Only three","c":"Only four","d":"All five"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":30,"text":"Consider the following infrastructure sectors:\n1. Affordable housing 2\n2. Mass rapid transport\n3. Health care\n4. Renewable energy On how many of the above does UNOPS Sustainable Investments in Infrastructure and Innovation (S3i) initiative focus for its investments ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All four /62A"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":31,"text":"In essence, what does Due Process of Law’ mean ? ‘","options":{"a":"The principle of natural justice","b":"The procedure established by law","c":"Fair application of law","d":"Equality before law"},"s":"misc","ca":true,"f":"Direct"},{"n":32,"text":"Consider the following statements:\nStatement-I: In India, prisons are managed by State Governments with their own rules and regulations for the day-to-day administration of prisons.\nStatement-II: ’ In India, prisons are governed by the Prisons Act, 1894 which expressly kept the subject of prisons in the control of Provincial Governments.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I","b":"Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I","c":"Statement-I is correct’ but Statement-II is incorrect","d":"Statement-I is incorrect but Statement-II is correct"},"s":"misc","ca":true,"f":"Statement I/II"},{"n":33,"text":"Which one of the following statements best reflects the Chief purpose of the ‘Constitution’ of a country ?","options":{"a":"It determines the objective for the making of necessary laws.","b":"It enables the creation of political offices and a government.","c":"It defines and limits the powers of government. '","d":"It secures social justice, social equality and social security."},"s":"polity","ca":false,"f":"Direct"},{"n":34,"text":"In India, which one of the following Constitutional Amendments was widely believed to be enacted to overcome the judicial interpretations of the Fundamental Rights ?","options":{"a":"1st Amendment","b":"42nd Amendment","c":"44th Amendment","d":"86th Amendment"},"s":"polity","ca":false,"f":"Direct"},{"n":35,"text":"Consider the following organizations/ bodies in India:\n1. 1. The National Commission for Backward Classes\n2. The National Human Rights ‘ Commission\n3. The National Law Commission,\n4. The National Consumer Disputes Redressal Commission\nHow many of the above are constitutional bodies ?","options":{"a":"Only one","b":"Only two","c":"Only three.","d":"All four."},"s":"science","ca":true,"f":"How many"},{"n":36,"text":"Consider the following statements:\n1. If the election of the President of India is declared void by the Supreme Court of India, all acts done by him/her in the performance of duties of his/her office of President before the date of decision become invalid.\n2. Election for the post of the President of India can be postponed on the ground that some Legislative Assemblies have been dissolved, and elections are yet to take place.\n3. When a Bill is presented to the President of India, the Constitution prescribes time limits within which he/she has to declare his/her assent.:\nHow many of the above statements are correct ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None /62A"},"s":"polity","ca":false,"f":"How many"},{"n":37,"text":"With reference to Finance Bill and Money Bill in the Indian Parliament, consider the following statements:\n1. When the Lok Sabha transmits Finance Bill to the Rajya Sabha, it can amend or reject the Bill.\n2. When the Lok Sabha transmits Money Bill to the Rajya Sabha, ’ jt cannot amend or reject the Bill, it can only make recommendations.\n3. In the case of disagreement between the Lok Sabha and the Rajya Sabha, there is no joint sitting for Money Bill, but a joint sitting becomes necessary for Finance Bill.\nHow many of the above statements are correct ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None"},"s":"polity","ca":false,"f":"How many"},{"n":38,"text":"Consider the following statements:\nOnce the Central Government notifies an area as a ‘Community Reserve’\n1. the Chief Wildlife Warden of the. State becomes the governing authority of such forest\n2. hunting is not allowed in such area\n3. people of such area are allowed to collect non-timber forest produce\n4. people of such area are allowed traditional agricultural practices. How many of the above statements are correct ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All four"},"s":"environment","ca":false,"f":"How many"},{"n":39,"text":"With reference to ‘Scheduled Areas’. in India, consider the following statements:\n1. Within a State, the notification of an area as Scheduled Area takes place through an Order of the President.\n2. The largest administrative unit forming the Scheduled Area is the District and the lowest is the cluster of villages in the Block..\n3. The Chief Ministers of the concerned States are required to submit annual reports to the - Union Home Ministry on the administration of Scheduled Areas in the States, '\nHow many of the above statements are correct ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None"},"s":"science","ca":true,"f":"How many"},{"n":40,"text":"Consider Statement-I the: following statements: The Supreme Court of India has held in some judgements that the reservation policies made under Article 16(4) of the Constitution of administration. India for maintenance would be limited of by efficiency Article 335 of ‘ Statement-II: Article 335 of the Constitution of India defines the term ‘efficiency of administration’.: Which one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I","b":"Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I","c":"Statement-I is correct but, Statement-II is incorrect","d":"Statement-I is incorrect but Statement-II is correct"},"s":"polity","ca":false,"f":"Statement I/II"},{"n":41,"text":"In which one of the following regions was Dhanyakataka, which flourished as a prominent Buddhist centre under the Mahasanghikas, located ?","options":{"a":"Andhra","b":"Gandhara ‘i","c":"Kalinga","d":"Magadha."},"s":"history","ca":false,"f":"Direct"},{"n":42,"text":"With reference to ancient India, consider the following statements:\  the time of child-\n3. It provides for periodic deworming to children and adolescents.\n4. It addresses non-nutritional causes of anaemia in endemic pockets with special focus on malaria, hemoglobinopathies and fluorosis.\nHow many of the statements given above are correct ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All four."},"s":"general-science","ca":true,"f":"How many"},{"n":53,"text":"Consider the following statements:\n1. Carbon fibres are used in the manufacture of components used in automobiles and aircrafts.\n2. Carbon fibres once used cannot be recycled.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"science","ca":true,"f":"Multiple statements"},{"n":54,"text":"Consider the following actions:\n1. Detection of car crash/collision which results in the deployment of airbags almost instantaneously\n2. Detection of accidental free fall of a laptop towards the ground which results in the immediate turning off of the hard drive\n3. Detection of the tilt of the smartphone which results in the rotation of display between portrait and landscape mode In how many of the above actions is the function of accelerometer required ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None 2, 1 (P70."},"s":"misc","ca":true,"f":"Multiple statements"},{"n":55,"text":"With reference to the role of biofilters in Recirculating Aquaculture System, consider 1. Biofilters the following provide waste statements treatment: 2. by Biofilters removing convert uneaten ammonia fish feed. present 3. in Biofilters fish waste increase to nitrate. phosphorus as nutrient for fish in water.\nHow many of the statements given above are correct ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None"},"s":"environment","ca":false,"f":"How many"},{"n":56,"text":"Consider the following pairs:\nObjects in. Description space\n1. Cepheids: Giant clouds of dust and tries:\n1. Bulgaria.\n2. Czech Republic\n3. Hungary\n4. Latvia\n5. Lithuania\n6. Romania\nHow many of the above-mentioned countries share a 1 and border with Ukraine ?","options":{"a":"Only two","b":"Only three","c":"Only four","d":"Only five"},"s":"geography","ca":false,"f":"How many"},{"n":62,"text":"With reference to the Earth’s atmosphere, which one of the following statements is correct ?","options":{"a":"The total amount of insolation received at the equator is roughly about 10 times of that received at the poles.","b":"Infrared rays constitute roughly two-thirds of insolation.","c":"Infrared waves are largely absorbed by water vapour that is concentrated in the lower atmosphere.","d":"Infrared waves are a part of visible spectrum of electromagnetic waves of solar radiation."},"s":"geography","ca":false,"f":"Direct"},{"n":63,"text":"Consider the following statements:\nStatement-I: The soil in tropical rain forests is rich in nutrients.. Statement-II: The high temperature and moisture of tropical rain forests cause dead organic matter in the soil to. decompose quickly.. Which one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II. are correct and Statement-II is the correct explanation for Statement-I","b":"Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I","c":"Statement-I is correct but Statement-II is incorrect","d":"Statement-I is imcorrect but Statement-II is correct"},"s":"geography","ca":false,"f":"Statement I/II"},{"n":64,"text":"Consider the following statements:\nStatement-I: The temperature contrast between continents and oceans is greater during summer than in winter.\nStatement-II: ,* The specific heat of water is more than that of 1 and surface.: - Which Tespect one of the of the above following statements ? is correct in","options":{"a":"Both Statement-I and Statement-II 5 are correct and Statement-II is the correct explana or Eg carbon capture and sequestration ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None"},"s":"environment","ca":false,"f":"How many"},{"n":69,"text":"‘Aerial metagenomics’ best refers to which one of the following situations ?","options":{"a":"Collecting DNA samples from air in a habitat at one go","b":"Understanding the genetic makeup of avian species of a habitat","c":"Using air-borne devices to collect blood samples from moving animals","d":"Sending drones to inaccessible areas to collect plant and animal ° samples from 1 and surfaces and water bodies"},"s":"environment","ca":false,"f":"Direct"},{"n":70,"text":"‘Microsatellite DNA’ is used in the case of which one of the following ?","options":{"a":"Studying the evolutionary: relationships among various species of fauna","b":"Stimulating ‘stem cells’ to transform into diverse functional tissues","c":"Promoting clonal propagation of horticultural plants","d":"Assessing the efficacy of drugs by conducting series of drug trials in a population"},"s":"science","ca":true,"f":"Direct"},{"n":71,"text":"Consider the following statements with reference to India: d\n1. According to the ‘Micro, Small and Medium Enterprises Development (MSMED) Act, 2006’, the ‘medium enterprises’ are those’ with investments in plant and machinery between ®15 crore and 25 crore.\n2. All bank loans to the Micro, Small and Medium Enterprises qualify ’ under the priority sector.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":72,"text":"With reference to Central Bank digital currencies, consider the following statements:\n1. It is possible to make payments in a digital currency without using US dollar or SWIFT system..\n2. A digital currency can be distributed with a condition programmed into it such as a timeframe for spending it.\nWhich of the statements given above is/are correct ? ‘","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"science","ca":true,"f":"Multiple statements"},{"n":73,"text":"In the context of finance, the term ‘beta’ refers to","options":{"a":"the process of simultaneous buying and selling of an asset from different platforms","b":"an investment strategy of a portfolio manager to balance risk versus reward","c":"a type of systemic risk that arises where perfect hedging is not possible.","d":"a numeric value that measures the fluctuations of a stock to changes in the overall stock market"},"s":"economy","ca":false,"f":"Direct"},{"n":74,"text":"Consider the following statements:\n1. The Self-Help Group (SHG) programme was originally initiated by the State Bank of India by providing microcredit to the financially deprived.\n2. In an SHG, all members of a group take responsibility for a loan that an individual member takes.\n3. The Regional Rural Banks and Scheduled Commercial Banks support SHGs. ‘ How many of the above statements are correct ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None"},"s":"economy","ca":true,"f":"How many"},{"n":75,"text":"Consider the following statements: Statement-I: India’s public sector health care system largely focuses on curative care with limited rehabilitative preventive, care. promotive and\nStatement-II: Under India’s decentralized approach to health care delivery, the States are primarily responsible for organizing ’ health services. ' Which one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct correct explanation and Statement-II for Statement-I is the e","b":"Both Statement-I and Statement-II are not correct the correct and explanation Statement-II for is Statement-I","c":"Statement-I is correct’ but ? Statement-II is incorrect","d":"Statement-II Statement-I is is correct incorrect but"},"s":"misc","ca":true,"f":"Statement I/II"},{"n":76,"text":"Consider the following statements:\nStatement-I: According to the United Nations’ ‘World Water Development Report, 2022’, India extracts more than a quarter of the world’s groundwater withdrawal each year.\nStatement-II: India needs to extract more than a quarter of the world’s groundwater each year to satisfy the drinking water and sanitation needs of almost 18% of world’s population living in its territory.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I","b":"Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I","c":"Statement-I is correct’ but Statement-II is incorrect","d":"Statement-I is incorrect but: Statement-II is correct"},"s":"international","ca":true,"f":"Statement I/II"},{"n":77,"text":"Consider the following statements:\n1. According to the Constitution of India, the Central Government has a duty to protect States from internal disturbances.\n2. The Constitution of India exempts the States from providing legal counsel to a person being held for preventive detention.\n3. According to the Prevention of Terrorism Act, 2002, confession of the accused before the police cannot be used as evidence.\nHow many of the above statements are correct ?","options":{"a":"Only one","b":"Only two","c":"All three","d":"None 3, 1"},"s":"polity","ca":false,"f":"How many"},{"n":78,"text":"Which one of the following countries has been suffering from decades of civil strife and food shortages and was in news in the recent past for its very severe famine ?","options":{"a":"Angola","b":"Costa Rica","c":"Ecuador","d":"Somalia"},"s":"geography","ca":true,"f":"Direct"},{"n":79,"text":"Consider the following statements:\n1. In India, the Biodiversity Management Committees are key to the realization of the objectives of the Nagoya Protocol.\n2. The Biodiversity Management Committees have
