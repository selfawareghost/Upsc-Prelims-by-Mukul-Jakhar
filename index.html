ct ?","options":{"a":"1 only","b":"2 only","c":"Bothland2.","d":"Neither 1 nor 2"},"s":"history","ca":false,"f":"Multiple statements"},{"n":54,"text":"Mediterranean Sea is a border of which of the: following countries ?\n1. Jordan\n2. ~Traq\n3. Lebanon 4, Syria\nSelect the correct answer using the code given below:","options":{"a":"1, 2 and 3 only","b":"2 and 3 only","c":"3 and 4 only","d":"1, 3 and 4 only"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":55,"text":"With reference to ‘National Investment and Infrastructure Fund’, which of the following statements is/are correct ?\n1. It is an organ of NITI Aayog.\n2. It has a corpus of 4, 00, 000 crore at present.\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":56,"text":"The Global Infrastructure Facility is a/an","options":{"a":"ASEAN initiative to upgrade infrastructure in Asia and financed by credit from the Asian Development Bank.","b":"World Bank collaboration that facilitates the preparation and structuring of complex infrastructure Public-Private Partnerships (PPPs) to enable mobilization of private sector and institutional investor capital.","c":"Collaboration among the major banks of the world working with the OECD and focused on expanding the set of infrastructure projects that have the potential to mobilize private investment.","d":"UNCTAD funded initiative that seeks to finance and facilitate infrastructure development in the world."},"s":"economy","ca":true,"f":"Direct"},{"n":57,"text":"For election to the Lok Sabha, a nomination paper can be filed by","options":{"a":"anyone residing in India.","b":"a resident of the constituency from which the election is to be contested.","c":"any citizen of India whose name appears in the electoral roll of a constituency.","d":"any citizen of India."},"s":"polity","ca":false,"f":"Direct"},{"n":58,"text":"Consider the following statements:\n1. In India, the Himalayas are spread over five States only.\n2. Western Ghats are spread over five ’ States only.\n8. Pulicat Lake is spread over two States only.\nWhich of the statements given above is/are correct ? ‘","options":{"a":"1 and 2 only","b":"3 only","c":"2 and 3 only","d":"1 and 3 only"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":59,"text":"Biological Oxygen Demand (BOD) is a standard criterion for","options":{"a":"Measuring oxygen levels in blood","b":"Computing oxygen levels in forest ecosystems","c":"Pollution assay in aquatic ecosystems","d":"Assessing oxygen levels in high altitude regions “C24"},"s":"environment","ca":false,"f":"Direct"},{"n":60,"text":"With reference to the role of abitat in — the United Nations programme working towards a better urban future, which of the statements is/are correct ? is abitat has been mandated by the United Nations General Assembly to promote socially and environmentally sustainable towns and cities to provide adequate shelter for all. Z Its partners are either governments or local urban authorities only.\n3. abitat contributes to the overall objective of the United Nations system to reduce poverty and to promote access to safe drinking water and basic sanitation.\nSelect the correct answer using the code given below","options":{"a":"1, 2 and 3","b":"1 and 3 only","c":"2 and 3 only","d":"1 only"},"s":"international","ca":true,"f":"Direct"},{"n":61,"text":"With reference to ‘National Skills Qualification Framework (NSQF)’, which of the statements given below is/are correct ?\n1. Under NSQF, a learner can acquire the certification for competency only through formal learning.\n2. An outcome expected from the implementation of NSQF is the mobility between vocational and general education.\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2 }","d":"Neither 1 nor 2 -A)"},"s":"science","ca":true,"f":"Multiple statements"},{"n":62,"text":"In the context of Indian history, the principle of ‘Dyarchy (diarchy)’ refers to","options":{"a":"Division of the central legislature into two houses.","b":"Introduction of double government i.e., Central and State governments.","c":"Having two sets of rulers one in London and another in Delhi.","d":"Division of the subjects delegated to the provinces into two categories."},"s":"history","ca":false,"f":"Direct"},{"n":63,"text":"Consider the following in respect of ‘National Career Service’:\n1. National Career Service is an initiative of the Department of Personnel and Training, Government of India.\n2. National Career Service has been launched in a Mission Mode to improve the employment opportunities to uneducated youth of the country.\nWhich of the above statements is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"science","ca":true,"f":"Multiple statements"},{"n":64,"text":"Which of the following statements best describes the term ‘Scheme for Sustainable Structuring of Stressed Assets (S4A)’, recently seen in the news ?","options":{"a":"It is a procedure for considering ecological costs of developmental schemes formulated by the Government.","b":"It is a scheme of RBI for reworking the financial structure of big corporate entities facing genuine difficulties.","c":"It is a disinvestment plan of the Government regarding Central Public Sector Undertakings.","d":"It is an important provision in ‘The Insolvency and Bankruptcy Code’ recently implemented by the Government."},"s":"economy","ca":true,"f":"Direct"},{"n":65,"text":"Consider the following statements:\n1. Climate and Clean Air Coalition ‘ (CCAC) to Reduce Short Lived Climate. Pollutants is a unique initiative of G20 group of countries.\n2. The CCAC focuses on methane, black carbon and hydrofluorocarbons.:\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"environment","ca":true,"f":"Multiple statements"},{"n":66,"text":"With reference to ‘Indian Ocean Dipole (IODY sometimes mentioned in the news while forecasting Indian monsoon, which of the following statements is/are correct ?\n1. IOD phenomenon is characterised by a difference in sea surface temperature between tropical Western Indian Ocean and tropical Eastern Pacific Ocean.\n2. An IOD phenomenon can influence an El Nino’s impact on the monsoon.\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both 1land2","d":"Neither 1 nor 2"},"s":"geography","ca":true,"f":"Multiple statements"},{"n":67,"text":"If you want to see gharials in their natural habitat, which one of the following is the best place to visit ?.","options":{"a":"Bhitarkanika Mangroves","b":"Chambal River","c":"Pulicat Lake","d":"Deepor Beel"},"s":"environment","ca":false,"f":"Direct"},{"n":68,"text":"Consider the following in respect of Indian Ocean Naval Symposium (IONS):\n1. Inaugural IONS was held in India in 2015 under the chairmanship of the Indian Navy.\n2 IONS is. a voluntary initiative that seeks to increase maritime co-operation among navies of the littoral states of the Indian Ocean Region.\nWhich of the above statements is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both1and2","d":"Neither 1 nor 2"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":69,"text":"The painting of Bodhisattva Padmapani is one of the most famous and oft-illustrated paintings at ‘","options":{"a":"Ajanta","b":"Badami","c":"Bagh","d":"Ellora"},"s":"history","ca":false,"f":"Direct"},{"n":70,"text":"Consider the following pairs: Traditions Communities\n1. Chaliha Sahib Festival — Sindhis\n2. Nanda Raj Jaat Yatra - Gonds\n38. Wari-Warkari — Santhals\nWhich of the pairs given above is/are correctly matched ?","options":{"a":"1 only ’","b":"2 and 3 only","c":"1 and 3 only","d":"None of the above"},"s":"history","ca":false,"f":"Match / pairs"},{"n":71,"text":"Which of the following practices can help in water conservation in agriculture ?\n1. ‘Reduced or zero tillage of the 1 and\n2. Applying gypsum before irrigating the field\n3. Allowing crop residue to remain in the field\nSelect the correct answer using the code given below: :","options":{"a":"1 and 2 only","b":"3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":72,"text":"Consider the following statements: The nation-wide ‘Soil Health Card Scheme’ aims at i, expanding the cultivable area under irrigation.\n2. enabling the banks to assess the quantum of loans to be granted to farmers on the basis of soil quality.\n3. checking the overuse of fertilizers in farmlands.\nWhich of the above statements is/are correct ?","options":{"a":"1 and 2 only","b":"3 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":true,"f":"Direct"},{"n":73,"text":"Consider the following pairs: Commonly used / Unwanted or consumed materials controversial chemicals likely to be found in them 1 Lipstick —- Lead\n2. Soft drinks — Brominated vegetable oils\n3. Chinese — Monosodium fast food glutamate.\nWhich of the pairs given above is/are correctly matched ?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"general-science","ca":false,"f":"Match / pairs"},{"n":74,"text":"Organic Light Emitting Diodes (OLEDs) are used to create digital display in many devices. What are the advantages of OLED displays over Liquid Crystal displays ?\n1. OLED displays can be fabricated on flexible plastic substrates.\n2.‘ Roll-up displays embedded in clothing can be made using OLEDs.\n3. Transparent displays are possible using, OLEDs.\nSelect the correct answer using the code given below:","options":{"a":"1 and 3 only","b":"2 only","c":"1, 2 and 3","d":"None of the above statements is correct"},"s":"science","ca":true,"f":"Multiple statements"},{"n":75,"text":"Which of the following is/are famous for Sun temples ?\n1. Arasavalli c\n2. Amarakantak\n3. Omkareshwar\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"history","ca":false,"f":"Multiple statements"},{"n":76,"text":"Consider the following statements:\n1. In the election for Lok Sabha or State Assembly, the winning candidate must get at least 50 percent of the votes polled, to be declared elected.\n2. According to the provisions laid down in the Constitution of India, in Lok Sabha, the Speaker’s post goes to the majority party and the Deputy Speaker’s to the Opposition.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":77,"text":"Which of the following has/have occurred in India after its liberalization of economic policies in 1991 ?\n1. Share of agriculture in GDP increased enormously.\n2. Share of India’s exports in world trade increased.\n3. FDI inflows increased. 4, India’s foreign exchange reserves increased enormously..\nSelect the correct answer using the codes given below:","options":{"a":"1 and 4 only","b":"2, 3 and 4 only","c":"2 and 3 only","d":"1, 2, 3 and 4"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":78,"text":"What is the application of Somatic Cell Nuclear Transfer Technology ?","options":{"a":"Production of biolarvicides","b":"Manufacture of biodegradable plastics","c":"Reproductive cloning of animals","d":"Production of organisms free of diseases"},"s":"science","ca":true,"f":"Direct"},{"n":79,"text":"Consider the following statements:\n1. National Payments Corporation of India (NPCI) helps in promoting the financial inclusion in the country.\n2. NPCI has launched RuPay, a card payment scheme.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both1land2","d":"Neither 1 nor 2"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":80,"text":"The term ‘M-STrIPES’ is sometimes seen in the news in the context of","options":{"a":"Captive breeding of Wild Fauna","b":"Maintenance of Tiger Reserves","c":"Indigenous Satellite Navigation System","d":"Security of National Highways"},"s":"science","ca":true,"f":"Direct"},{"n":81,"text":"What is/are the most likely advantages of implementing ‘Goods and Services Tax (GST) ?\n1. It will replace multiple taxes collected by multiple authorities and will thus create a: single market in India.\n2. It will drastically reduce the ‘Current Account Deficit’ of India and will enable it to increase its foreign exchange reserves.\n3. It will enormously increase the growth and size of economy of India and will enable it to overtake China in the near future.\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":82,"text":"‘Broad-based Trade and Investment Agreement (BTIA)’ is sometimes seen in the news in the context of negotiations held between India and","options":{"a":"European Union","b":"Gulf Cooperation Council","c":"Organization for Economic Cooperation and Development","d":"Shanghai Cooperation Organization"},"s":"economy","ca":true,"f":"Direct"},{"n":83,"text":"Consider the following statements:\n1. India has ratified the Trade Facilitation Agreement (TFA) of WTO.\n2. TFAisa part of WTO's Bali Ministerial Package of 2013.\n8. TFAcame into force in January 2016.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2 only","b":"1 and 3 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"international","ca":true,"f":"Multiple statements"},{"n":84,"text":"What is the importance of developing Chabahar Port by India ?","options":{"a":"India’s trade with African countries will enormously increase.","b":"India’s relations with oil-producing Arab countries ‘will be strengthened.","c":"India will nnecting institutions of higher education with local communities to address development challenges through appropriate technologies.","c":"Strengthening India’s scientific research institutions in order to make India a scientific and technological power.","d":"Developing human capital by allocating special funds for health care and education of rural and urban poor, and organizing skill development programmes and vocational training for them."},"s":"science","ca":true,"f":"Direct"},{"n":90,"text":"Consider the following statements:\n1. The Election Commission of India is a five-member body.:\n2. Union Ministry of Home Affairs decides the election schedule for the conduct of both general elections and bye-elections.\n3. Election Commission resolves the’ disputes relating to splits/mergers of recognised political parties.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2 only —","b":"2 only","c":"2 and 3 only","d":"3 only"},"s":"polity","ca":true,"f":"Multiple statements"},{"n":91,"text":"In India, if a species of tortoise is declared protected under Schedule I of the Wildlife (Protection) Act, 1972, what does it imply ?","options":{"a":"It enjoys the same level of protection as the tiger.","b":"It no longer exists in the wild, a few individuals are under captive protection and now it is impossible to prevent its extinction.","c":"It is endemic to a particular region of India.","d":"Both (b) and (c) stated above are correct in this context."},"s":"environment","ca":false,"f":"Direct"},{"n":92,"text":"In India, Judicial Review implies","options":{"a":"the power of the Judiciary to pronounce upon the constitutionality of laws and executive orders.","b":"the power of the Judiciary to question the wisdom of the laws enacted by the Legislatures.","c":"the power of the Judiciary to review all the legislative enactments before they are assented to by the President.","d":"the power of the Judiciary to review its own judgements given earlier in similar or different cases."},"s":"polity","ca":false,"f":"Direct"},{"n":93,"text":"With reference to Indian freedom struggle, consider the following events:\n1. Mutiny in Royal Indian Navy\n2. Quit India Movement launched\n8. Second Round Table Conference What is the correct chronological sequence of the above events ? '","options":{"a":"1-2-3","b":"2-1-3","c":"3-2-1","d":"3-1-2"},"s":"history","ca":true,"f":"Multiple statements"},{"n":94,"text":"Consider the following statements:\n1. Tax revenue as a percent of GDP of India has steadily increased in the last decade.\n2. Fiscal deficit as a percent of GDP of India has steadily increased in the last decade.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only .","b":"2 only","c":"Both 1 and oa","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":95,"text":"Recently there was a proposal to translocate some of the lions from their natural habitat in Gujarat to which one of the following sites ?","options":{"a":"Corbett National Park","b":"Kuno Palpur Wildlife Sanctuary","c":"Mudumalai Wildlife Sanctuary","d":"Sariska National Park"},"s":"environment","ca":true,"f":"Direct"},{"n":96,"text":"Which of the following are not necessarily the consequences of the proclamation of the President’s rule in a State ?\n1. Dissolution of the State Legislative Assembly\n2. Removal of the Council of Ministers in the State °\n3. Dissolution of the local bodies\nSelect the correct answer using the code given below:","options":{"a":"1 and 2 only","b":"1 and 3 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":97,"text":"Which of the following are envisaged by the Right against Exploitation in the Constitution of India ?\n1. Prohibition of traffic in human beings. and forced labour\n2. Abolition of untouchability\n3. Protection of the interests of minorities\n4. Prohibition of employment of children in factories and mines\nSelect the correct PYQ.register("2018", {"id":"2018","year":2018,"title":"Civil Services (Preliminary) Examination 2018","paper":"General Studies Paper I","series":"A","durationMin":120,"type":"text","key":"bdcbacadcacdadcacdabbbabbddaaacaacbbbbabcdcbcbcccdccbadccccdadbbabddcdbdbccdacabbbbdabdcbcbcbaabcadb","keyNote":"Official answer key released by UPSC.","questions":[{"n":1,"text":"In the first Lok Sabha, the single largest party in the opposition was the Swatantra Party. x In the Lok Sabha, a “Leader of the Opposition” was recognised for the first time in 1969.\n3. In the Lok Sabha, if a party does not have a minimum of 75 members, its leader cannot be recognised as the Leader of the Opposition.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 3 only","b":"2 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Direct"},{"n":2,"text":"Which of the following leaf modifications occur(s) in the desert areas to inhibit water loss ?\n1. Hard and waxy leaves\n2. Tiny leaves\n3. Thorns instead of leaves\nSelect the correct answer using the code given below:","options":{"a":"2 and 3 only","b":"2 only","c":"3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":3,"text":"As per the NSSO 70‘ Round “Situation Assessment Survey of Agricultural Households”, consider the following statements:\n1. Rajasthan has the highest percentage share of agricultural households among F its rural households.\n2. Out of the total agricultural households in the country, a little over 60 percent belong to OBCs.\n3. In Kerala, a little over 60 percent of agricultural households reported to have received maximum income from sources other than agricultural activities.\nWhich of the statements given above is/are correct ?","options":{"a":"2 and 3 only","b":"2 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":true,"f":"Multiple statements"},{"n":4,"text":"How is the National Green Tribunal (NGT) different from the Central Pollution Control Board (CPCB) ?\n1. The NGT has been established by an Act whereas the CPCB has been created by an executive order of the Government.\n2. The NGT provides environmental justice and helps reduce the burden of litigation in the higher courts whereas the CPCB promotes cleanliness of streams and wells, and aims to improve the quality of air in the country.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":5,"text":"Consider the following statements:\n1. The Parliament of India can place a particular law in the Ninth Schedule of the Constitution of India.\n2. The validity of a law placed in the Ninth Schedule cannot be examined by any court and no judgement can be made on it.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":6,"text":"Which one of the following best describes the term “Merchant Discount Rate” sometimes seen in news ?","options":{"a":"The incentive given by a bank to a merchant for accepting payments through debit cards pertaining to that bank.","b":"The amount paid back by banks to their customers when they use debit cards for financial transactions for purchasing goods or services.","c":"The charge to a merchant by a bank for accepting payments from his customers through the bank’s debit cards.","d":"The incentive given by the Government to merchants for promoting digital payments by their customers through Point of Sale (PoS) machines and debit cards."},"s":"economy","ca":true,"f":"Direct"},{"n":7,"text":"What is/are the consequence/consequences of a country becoming the member of the ‘Nuclear Suppliers Group’ ?\nA; It will have access to the latest and most efficient nuclear technologies.\n2. It automatically becomes a member of “The Treaty on the Non-Proliferation of Nuclear Weapons (NPT)”.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"science","ca":true,"f":"Direct"},{"n":8,"text":"With reference to India’s decision to levy an equalization tax of 6% on online advertisement services offered by non-resident entities, which of the following statements is/are correct ?\n1. It is introduced as a part of the Income Tax Act.\n2. Non-resident entities that offer advertisement services in India can claim a tax credit in their home country under the “Double Taxation Avoidance Agreements”.\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":9,"text":"Consider the following statements:\n1. The Fiscal Responsibility and Budget Management (FRBM) Review Committee Report has recommended a debt to GDP ratio of 60% for the general (combined) government by 2023, comprising 40% for the Central Government and 20% for the State Governments.\n2. The Central Government has domestic liabilities of 21% of GDP as compared to that of 49% of GDP of the State Governments.\n3. As per the Constitution of India, it is mandatory for a State to take the Central Government’s consent for raising any loan if the former owes any outstanding liabilities to the latter.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":10,"text":"Consider the following statements:\n1. The quantity of imported edible oils is more than the domestic production of edible oils in the last five years.\n2. The Government does not impose any customs duty on all the imported edible oils as a special case.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":11,"text":"He wrote biographies of Mazzini, Garibaldi, Shivaji and Shrikrishna stayed in America for some time and was also elected to the Central Assembly. He was","options":{"a":"Aurobindo Ghosh","b":"Bipin Chandra Pal","c":"Lala Lajpat Rai","d":"Motilal Nehru"},"s":"international","ca":true,"f":"Direct"},{"n":12,"text":"Consider the following statements:\n1. Aadhaar card can be used as a proof of citizenship or domicile.\n2. Once issued, Aadhaar number cannot be deactivated or omitted by the Issuing Authority.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":13,"text":"Which of the following has/have shrunk immensely/dried up in the recent past due to human activities ?\n1. Aral Sea\n2. Black Sea\n3. Lake Baikal\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 and 3","c":"2 only","d":"1 and 3"},"s":"geography","ca":true,"f":"Multiple statements"},{"n":14,"text":"“Rule of Law Index” is released by which of the following ?","options":{"a":"Amnesty International","b":"International Court of Justice","c":"The Office of UN Commissioner for Human Rights.","d":"World Justice Project"},"s":"economy","ca":true,"f":"Direct"},{"n":15,"text":"Which one of the following links all the ATMs in India ?","options":{"a":"Indian Banks’ Association","b":"National Securities Depository Limited","c":"National Payments Corporation of India","d":"Reserve Bank of India"},"s":"economy","ca":false,"f":"Direct"},{"n":16,"text":"Consider the following statements:\nA Capital Adequacy Ratio (CAR) is the amount that banks have to maintain in the form of their own funds to offset any loss that banks incur if the account-holders fail to repay dues.\nZz CAR is decided by each individual bank.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Direct"},{"n":17,"text":"The identity platform ‘Aadhaar’ provides open “Application Programming Interfaces (APIs)”. What does it imply ?\n1. It can be integrated into any electronic device.\n2. Online authentication using iris is possible.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":18,"text":"Very recently, in which of the following countries have lakhs of people either suffered from severe famine/acute malnutrition or died due to starvation caused by war/ethnic conflicts ?","options":{"a":"Angola and Zambia","b":"Morocco and Tunisia","c":"Venezuela and Colombia","d":"Yemen and South Sudan"},"s":"general-science","ca":true,"f":"Direct"},{"n":19,"text":"Regarding Wood’s Dispatch, which of the following statements are true ?\n1. Grants-in-Aid system was introduced.\n2. Establishment of universities was recommended.\n3. English as a medium of instruction at all levels of education was recommended.\nSelect the correct answer using the code given below:","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":20,"text":"With reference to the Parliament of India, which of the following Parliamentary Committees scrutinizes and reports to the House whether the powers to make regulations, rules, sub-rules, by-laws, etc. conferred by the Constitution or delegated by the Parliament are being properly exercised by the Executive within the scope of such delegation ?","options":{"a":"Committee on Government Assurances","b":"Committee on Subordinate Legislation","c":"Rules Committee","d":"Business Advisory Committee"},"s":"polity","ca":true,"f":"Direct"},{"n":21,"text":"Consider the following statements:\n1. As per the Right to Education (RTE) Act, to age 18 years or above, shall be the head of the household for the purpose of issuance of a ration card.\n3. Pregnant women and lactating mothers are entitled to a ‘take-home ration’ of 1600 calories per day during pregnancy and for six months thereafter.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2","b":"2 only","c":"1 and 3","d":"3 only"},"s":"science","ca":true,"f":"Direct"},{"n":26,"text":"India enacted The Geographical Indications of Goods (Registration and Protection) Act, 1999 in order to comply with the obligations to","options":{"a":"ILO","b":"IMF","c":"UNCTAD","d":"WTO"},"s":"international","ca":true,"f":"Direct"},{"n":27,"text":"Consider the following statements:\n1. In India, State Governments do not have the power to auction non-coal mines.\n2. Andhra Pradesh and Jharkhand do not have gold mines. Y @ Rajasthan has iron ore mines.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2","b":"2 only","c":"1 and 3","d":"Sonly"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":28,"text":"With reference to digital payments, consider the following statements:\n1. BHIM app allows the user to transfer money to anyone with a UPI-enabled bank account. “2. While a chip-pin debit card has four factors of authentication, BHIM app has only two factors of authentication.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"science","ca":true,"f":"Multiple statements"},{"n":29,"text":"Among the following cities, which one lies on a longitude closest to that of Delhi ? —","options":{"a":"Bengaluru","b":"Hyderabad","c":"Nagpur","d":"Pune"},"s":"geography","ca":false,"f":"Direct"},{"n":30,"text":"International Labour Organization’s Conventions 138 and 182 are related to","options":{"a":"Child labour","b":"Adaptation of agricultural practices to global climate change","c":"Regulation of food prices and food security","d":"Gender parity at the workplace"},"s":"international","ca":true,"f":"Direct"},{"n":31,"text":"Regarding Money Bill, which of the following statements is not correct ?","options":{"a":"A bill shall be deemed to be a Money Bill if it contains only provisions relating to imposition, abolition, remission, alteration or regulation of any tax.","b":"A Money Bill has provisions for the custody of the Consolidated Fund of India or the Contingency Fund of India.","c":"A Money Bill is concerned with the appropriation of moneys out of the Contingency Fund of India.","d":"A Money Bill deals with the regulation of borrowing of money or giving of any guarantee by the Government of India."},"s":"polity","ca":true,"f":"Direct"},{"n":32,"text":"With reference to the election of the President of India, consider the following statements:\n1. The value of the vote of each MLA varies from State to State.\n2. The value of the vote of MPs of the Lok Sabha is more than the value of the vote of MPs of the Rajya Sabha.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2 -~A)"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":33,"text":"In the Indian context, what is the implication of ratifying the ‘Additional Protocol’ with the ‘International Atomic Energy Agency (LAEA)Y’ ?","options":{"a":"The civilian nuclear reactors come under IAEA safeguards.","b":"The military nuclear installations come under the inspection of IAEA.","c":"The country will have the privilege to buy uranium from the Nuclear Suppliers Group (NSG).","d":"The country automatically becomes a member of the NSG."},"s":"general-science","ca":false,"f":"Direct"},{"n":34,"text":"Consider the following countries:\n1. Australia\n2. Canada\n3. China\n4. India\n5. Japan\n6. USA\nWhich of the above are among the ‘free-trade partners’ of ASEAN ?","options":{"a":"1, 2, 4 and 5","b":"3, 4, 5 and 6","c":"1, 3, 4 and 5","d":"2, 3, 4 and 6"},"s":"international","ca":true,"f":"Multiple statements"},{"n":35,"text":"With reference to the ‘Global Alliance for Climate-Smart Agriculture (GACSA)’, which of the following statements is/are correct ?\n1. GACSA is an outcome of the Climate Summit held in Paris in 2015.\n2. Membership of GACSA does not create any binding obligations.\n3. India was instrumental in the creation of GACSA.\nSelect the correct answer using the code given below:","options":{"a":"1 and 3 only","b":"2 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"international","ca":true,"f":"Multiple statements"},{"n":36,"text":"Which of the following is/are the aim/aims of “Digital India” Plan of the Government of India ?\n1. Formation of India’s own Internet companies like China did.\n2. Establish a policy framework to encourage overseas multinational corporations that collect Big Data to build their large data centres within our national geographical boundaries.\n3. Connect many of our villages to the Internet and bring Wi-Fi to many of our schools, public places and major tourist centres.\nSelect the correct answer using the code given below:","options":{"a":"1 and 2 only","b":"3 only","c":"2 and 3 only","d":"l1, 2and3 -~A)"},"s":"science","ca":true,"f":"Multiple statements"},{"n":37,"text":"Consider the following pairs: Towns sometimes Country mentioned in news\n1. Aleppo — Syria\n2. Kirkuk — Yemen\n3. Mosul — Palestine\n4. Mazar-i-sharif — Afghanistan\nWhich of the pairs given above are correctly matched ?","options":{"a":"1 and 2","b":"1 and 4","c":"2 and 3","d":"3 and 4"},"s":"international","ca":true,"f":"Match / pairs"},{"n":38,"text":"In the Federation established by The Government of India Act of 1935, residuary powers were given to the","options":{"a":"Federal Legislature","b":"Governor General","c":"Provincial Legislature","d":"Provincial Governors"},"s":"polity","ca":false,"f":"Direct"},{"n":39,"text":"Consider the following statements:\n1. The Speaker of the Legislative Assembly shall vacate his/her office if he/she ceases to be a member of the Assembly.\n2. Whenever the Legislative Assembly is dissolved, the Speaker shall vacate his/her office immediately.\nWhich of ‘the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":40,"text":"Which one of the following reflects the most appropriate relationship between law and liberty ?","options":{"a":"If there are more laws, there is less liberty.","b":"Ifthere are no laws, there is no liberty.","c":"If there is liberty, laws have to be made by the people.","d":"If laws are changed too often, liberty is in danger."},"s":"misc","ca":true,"f":"Direct"},{"n":41,"text":"Consider the following statements:\n1. No criminal proceedings shall be instituted against the Governor of a State in any court during his term of office.\n2. The emoluments and allowances of the Governor of a State shall not be diminished during his term of office. - Which of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":42,"text":"The well-known painting “Bani Thani” belongs to the","options":{"a":"Bundi school","b":"Jaipur school","c":"Kangra school","d":"Kishangarh school"},"s":"history","ca":false,"f":"Direct"},{"n":43,"text":"What is “Terminal High Altitude Area Defense (THAAD)”, sometimes seen in the news ?","options":{"a":"An Israeli radar system","b":"India’s indigenous anti-missile programme","c":"An American anti-missile system","d":"A defence collaboration between Japan and South Korea a"},"s":"science","ca":true,"f":"Direct"},{"n":44,"text":"With reference to cultural history of India, consider the following statements:\n1. Most of the Tyagaraja Kritis are devotional songs in praise of Lord Krishna.\n2. Tyagaraja created several new ragas.\n3. Amnamacharya and Tyagaraja are contemporaries.\n4. Annamacharya kirtanas are devotional songs in praise of Lord Venkateshwara.\nWhich of the statements given above are correct ?","options":{"a":"1 and 3 only","b":"2 and 4 only","c":"1, 2 and 3","d":"2, 3 and 4"},"s":"history","ca":false,"f":"Multiple statements"},{"n":45,"text":"Which of the following are regarded as the main features of the “Rule of Law” ?\n1. Limitation of powers\n2. Equality before law\n3. People’s responsibility to the Government\n4. Liberty and civil rights\nSelect the correct answer using the code given below:","options":{"a":"1 and 3 only","b":"2 and 4 only","c":"1, 2 and 4 only","d":"1, 2, 3 and 4"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":46,"text":"Which one of the following statements correctly describes the meaning of legal tender money ?","options":{"a":"The money which is tendered in courts of law to defray the fee of legal cases","b":"The money which a creditor is under compulsion to accept in settlement of his claims","c":"The bank money in the form of cheques, drafts, bills of exchange, etc.","d":"The metallic money in circulation in a country"},"s":"economy","ca":false,"f":"Direct"},{"n":47,"text":"If a commodity is provided free to the public by the Government, then","options":{"a":"the opportunity cost is zero.","b":"the opportunity cost is ignored.","c":"the opportunity cost is transferred from the consumers of the product to the tax-paying public.","d":"the opportunity cost is transferred from the consumers of the product to the Government."},"s":"economy","ca":false,"f":"Direct"},{"n":48,"text":"Increase in absolute and per capita real GNP do not connote a higher level of economic development, if","options":{"a":"industrial output fails to keep pace with agricultural output.","b":"agricultural output fails to keep pace with industrial output.","c":"poverty and unemployment increase.","d":"imports grow faster than exports."},"s":"economy","ca":false,"f":"Direct"},{"n":49,"text":"Consider the following statements:\nHuman capital formation as a concept is better explained in terms of a process which enables\n1. individuals of a country to accumulate more capital.\n2. increasing the knowledge, skill levels and capacities of the people of the country.\n3. accumulation of tangible wealth. 4, accumulation of intangible wealth.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2","b":"2 only.","c":"2 and 4","d":"1, 3 and 4"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":50,"text":"Despite being a high saving economy, capital formation may not result in significant increase in output due to","options":{"a":"weak administrative machinery","b":"illiteracy","c":"high population density","d":"high capital-output ratio"},"s":"economy","ca":false,"f":"Direct"},{"n":51,"text":"After the Santhal Uprising subsided, what was/were the measure/measures taken by the colonial government ?\n1. The territories called ‘Santhal Paraganas’ were created. Z: It became illegal for a Santhal to transfer 1 and to a non-Santhal.\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"history","ca":false,"f":"Multiple statements"},{"n":52,"text":"Economically, one of the results of the British rule in India in the 19° century was the","options":{"a":"increase in the export of Indian handicrafts","b":"growth in the number of Indian owned factories","c":"commercialization of Indian agriculture","d":"rapid increase in the urban population"},"s":"economy","ca":false,"f":"Direct"},{"n":53,"text":"If the President of India exercises his power as provided under Article 356 of the Constitution in respect of a particular State, then","options":{"a":"the Assembly of the State is automatically dissolved.","b":"the powers of the Legislature of that State shall be exercisable by or under the authority of the Parliament.","c":"Article 19 is suspended in that State.","d":"the President can make laws relating to that State."},"s":"polity","ca":false,"f":"Direct"},{"n":54,"text":"Consider the following pairs: Craft Heritage of\n1. Puthukkuli shawls — Tamil Nadu\n2. Sujni embroidery — Maharashtra\n3. Uppada Jamdani saris — Karnataka\nWhich of the pairs given above is/are correct ?","options":{"a":"1 only","b":"1 and 2","c":"Bonly","d":"2 and 3"},"s":"general-science","ca":false,"f":"Match / pairs"},{"n":55,"text":"In which of the following areas can GPS technology be used ?\n1. Mobile phone operations\n2. Banking operations\n3. Controlling the power grids\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":56,"text":"B6. Consider the following statements:\n1. The Reserve Bank of India manages and services Government of India Securities but not any State Government Securities.\n2. Treasury bills are issued by the Government of India and there are no treasury bills issued by the State Governments.\n3. Treasury bills offer are issued at a discount from the par value.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2 only","b":"3 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":57,"text":"Consider the following statements:\n1. The Earth’s magnetic field has reversed every few hundred thousand years.\n2. When the Earth was created more than 4000 million years ago, there was 54% oxygen and no carbon dioxide.\n3. When living organisms originated, they modified the early atmosphere of the Earth.\nWhich of the statements given above is/are: correct ?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":58,"text":"The terms ‘WannaCry, Petya and EternalBlue’ sometimes mentioned in the news recently are related to","options":{"a":"Exoplanets","b":"Cryptocurrency","c":"Cyber attacks","d":"Mini satellites"},"s":"general-science","ca":true,"f":"Direct"},{"n":59,"text":"With reference to the circumstances in Indian agriculture, the concept of “Conservation Agriculture” assumes significance. Which of the following fall under the Conservation Agriculture ?\n1. Avoiding the monoculture practices\n2. Adopting minimum tillage\n8. Avoiding the cultivation of plantation crops\n4. Using crop residues to cover soil surface\n5. Adopting spatial and temporal crop sequencing/crop rotations\nSelect the correct answer using the code given below:","options":{"a":"1, 3 and 4","b":"2, 3, 4 and 5","c":"2, 4 and 5","d":"1, 2, 3and5 -~A)"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":60,"text":"The term “sixth mass extinction/sixth extinction” is often mentioned in the news in the context of the discussion of","options":{"a":"Widespread monoculture practices in agriculture and large-scale commercial farming with indiscriminate use of chemicals in many parts of the world that may result in the loss of good native ecosystems.","b":"Fears of a possible collision of a meteorite with the Earth in the near future in the manner it happened 65 million years ago that caused the mass extinction of many species. including those of dinosaurs.","c":"Large scale cultivation of genetically modified crops in many parts of the world and promoting their cultivation in other parts of the world which may cause the disappearance of good native crop plants and the loss of food biodiversity.","d":"Mankind’s over-exploitation/misuse of natural resources, fragmentation/loss of natural habitats, destruction of ecosystems, pollution and global climate change."},"s":"environment","ca":true,"f":"Direct"},{"n":61,"text":"With reference to the Indian Regional Navigation Satellite System (IRNSS), consider the following statements:\n1. IRNSS has three satellites in geostationary and four satellites in geosynchronous orbits.\n2. IRNSS covers entire India and about 5500 sq. km beyond its borders.\n3. India will have its own satellite navigation system with full global coverage by the middle of 2013.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"1 and 2 only","c":"2 and 3 only","d":"None"},"s":"science","ca":true,"f":"Multiple statements"},{"n":62,"text":"Consider the following phenomena: i Light is affected by gravity. oe. The Universe is constantly expanding.\n3. Matter warps its surrounding space-time.\nWhich of the above is/are the prediction/predictions of Albert Einstein’s General Theory of Relativity, often discussed in media ?","options":{"a":"1 and 2 only","b":"3 only","c":"1 and 3 only","d":"1, 2and3 -~A)"},"s":"general-science","ca":true,"f":"Direct"},{"n":63,"text":"With reference to the Genetically Modified mustard (GM mustard) developed in India, consider the following statements:\n1. GM mustard has the genes of a soil bacterium that give the plant the property of pest-resistance to a wide variety of pests.\n2. GM mustard has the genes that allow the plant cross-pollination and hybridization.\n3. GM mustard has been developed jointly by the IARI and Punjab Agricultural University.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 3 only","b":"2 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":64,"text":"Consider the following pairs:\nTerms sometimes Context / Topic seen in news\n1. Belle II — Artificial experiment Intelligence 2: Blockchain — Digital/ technology Cryptocurrency\n3. as9 — Particle Physics\nWhich of the pairs given above is/are correctly matched ?","options":{"a":"1 and 3 only","b":"2 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Match / pairs"},{"n":65,"text":"Which of the following statements best describes “carbon fertilization” ?","options":{"a":"Increased plant growth due to increased concentration of carbon dioxide in the atmosphere","b":"Increased temperature of Earth due to increased concentration of carbon dioxide in the atmosphere","c":"Increased acidity of oceans as a result of increased concentration of carbon dioxide in the atmosphere","d":"Adaptation of all living beings on Earth to the climate change brought about by the increased concentration of carbon dioxide in the atmosphere"},"s":"environment","ca":false,"f":"Direct"},{"n":66,"text":"When the alarm of your smartphone rings in the morning, you wake up and tap it to stop the alarm which causes your geyser to be switched on automatically. The smart mirror in your bathroom shows the day’s weather and also indicates the level of water in your overhead tank. After you take some groceries from your refrigerator for making breakfast, it recognises the shortage of stock in it and places an order for the supply of fresh grocery items. When you step out of your house and lock the door, all lights, fans, geysers and AC machines get switched off automatically. On your way to office, your car warns you about traffic congestion ahead and suggests an alternative route, and if you are late for a meeting, it sends a message to your office accordingly.\nIn the context of emerging communication technologies, which one of the following terms best applies to the above scenario ?","options":{"a":"Border Gateway Protocol","b":"Internet of Things","c":"Internet Protocol","d":"Virtual Private Network"},"s":"science","ca":true,"f":"Direct"},{"n":67,"text":"With reference to solar power production in India, consider the following statements:\n1. India is the third largest in the world in the manufacture of silicon wafers used in photovoltaic units.\n2. ‘The solar power tariffs are determined by the Solar Energy Corporation of India.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both1iand2","d":"Neither 1 nor 2"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":68,"text":"The staple commodities of export by the English East India Company from Bengal in the middle of the 18\" century were","options":{"a":"Raw cotton, oil-seeds and opium","b":"Sugar, salt, zinc and lead","c":"Copper, silver, gold, spices and tea","d":"Cotton, silk, saltpetre and opium"},"s":"history","ca":false,"f":"Direct"},{"n":69,"text":"Which one of the following is a very significant aspect of the Champaran ’ Satyagraha ?","options":{"a":"Active all-India participation of lawyers, students and women in the National Movement","b":"Active involvement of Dalit and Tribal communities of India in the National Movement","c":"Joining of peasant unrest to India’s National Movement","d":"Drastic decrease in the cultivation of plantation crops and commercial crops"},"s":"history","ca":false,"f":"Direct"},{"n":70,"text":"Who among the following were the founders of the “Hind Mazdoor Sabha” established in 1948 ?","options":{"a":"B. Krishna Pillai, E.MLS. Namboodiripad and K.C. George","b":"Jayaprakash Narayan, Deen Dayal Upadhyay and M.N. Roy","c":"C.P. Ramaswamy lyer, K. Kamaraj and Veeresalingam Pantulu","d":"Ashok Mehta, T.S. Ramanujam and G.G. Mehta"},"s":"international","ca":true,"f":"Direct"},{"n":71,"text":"With reference to the religious practices in India, the “Sthanakvasi” sect belongs to","options":{"a":"Buddhism","b":"Jainism","c":"Vaishnavism","d":"Shaivism"},"s":"history","ca":false,"f":"Direct"},{"n":72,"text":"With reference to the cultural history of India, consider the following statements:\n1. White marble was used in making Buland Darwaza and Khankah at Fatehpur Sikri. Zz. Red sandstone and marble were used in making Bara Imambara and Rumi Darwaza at Lucknow.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Bothland2","d":"Neither 1 nor 2 Ait"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":73,"text":"Which one of the following foreign travellers elaborately discussed about diamonds and diamond mines of India ?","options":{"a":"Francois Bernier","b":"Jean-Baptiste Tavernier","c":"Jean de Thevenot","d":"Abbe Barthelemy Carre"},"s":"misc","ca":true,"f":"Direct"},{"n":74,"text":"With reference to Indian history, who among the following is a future Buddha, yet to come to save the world ?","options":{"a":"Avalokiteshvara","b":"Lokesvara","c":"Maitreya","d":"Padmapani"},"s":"history","ca":false,"f":"Direct"},{"n":75,"text":"Which one of the following statements does not apply to the system of Subsidiary Alliance introduced by Lord Wellesley ?","options":{"a":"To maintain a large standing army at other’s expense","b":"To keep India safe from Napoleonic danger","c":"To secure a fixed income for the Company","d":"To establish British paramountcy over the Indian States"},"s":"history","ca":false,"f":"Direct"},{"n":76,"text":"Which of the following led to the introduction of English Education in India ?\n1. Charter Act of 1813\n2. General Committee of Public Instruction, 1823\n3. Orientalist and Anglicist Controversy\nSelect the correct answer using the code given below:","options":{"a":"1 and 2 only","b":"2 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":77,"text":"Which one of the following is an artificial lake ?","options":{"a":"Kodaikanal (Tamil Nadu)","b":"Kolleru (Andhra Pradesh)","c":"Nainital (Uttarakhand)","d":"Renuka (Himachal Pradesh)"},"s":"geography","ca":false,"f":"Direct"},{"n":78,"text":"With reference to Pradhan Mantri Kaushal Vikas Yojana, consider the following statements:\n1. It is the flagship scheme of the Ministry of Labour and Employment.\n2. ‘It, among other things, will also impart training in soft skills, entrepreneurship, financial and digital literacy.\n3. ‘It aims to align the competencies of the unregulated workforce of the country to the National Skill Qualification Framework.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 3 only","b":"2 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":79,"text":"In 1920, which of the following changed its name to “Swarajya Sabha” ?","options":{"a":"All India Home Rule League","b":"Hindu Mahasabha","c":"South Indian Liberal Federation","d":"The Servants of India Society"},"s":"polity","ca":false,"f":"Direct"},{"n":80,"text":"Which among the following events happened earliest ?","options":{"a":"Swami Dayanand established Arya Samaj.","b":"Dinabandhu Mitra wrote Neeldarpan.","c":"Bankim Chandra Chattopadhyay wrote Anandmath.","d":"Satyendranath Tagore became the first Indian to succeed in the Indian Civil Services Examination."},"s":"history","ca":false,"f":"Direct"},{"n":81,"text":"Which of the following is/are the possible consequence/s of heavy sand mining in riverbeds ?\n1. Decreased salinity in the river\n2. — Pollution of groundwater\n3. Lowering of the water-table\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":82,"text":"With reference to agricultural soils, consider the following statements:\n1. A high content of organic matter in soil drastically reduces its water holding capacity.\n2. Soil does not play any role in the sulphur cycle.\n3. Irrigation over a period of time can contribute to the salinization of some agricultural lands.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2 only","b":"3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":83,"text":"The Partnership for Action on Green Economy (PAGE), a UN mechanism to assist countries transition towards greener and more inclusive economies, emerged at","options":{"a":"The Earth Summit on Sustainable Development 2002, Johannesburg","b":"The United Nations Conference on Sustainable Development 2012, Rio de Janeiro","c":"The United Nations Framework Convention on Climate Change 2015, Paris","d":"The World Sustainable Development Summit 2016, New Delhi -~A)"},"s":"international","ca":true,"f":"Direct"},{"n":84,"text":"“3D printing” has applications in which of the following ?\n1. Preparation of confectionery items\n2. Manufacture of bionic ears\n3. Automotive industry 4, Reconstructive surgeries\n5. Data processing technologies\nSelect the correct answer using the code given below:","options":{"a":"1, 3 and 4 only","b":"2, 3 and 5 only","c":"1 and 4 only","d":"1, 2, 3, 4 and 5"},"s":"science","ca":true,"f":"Multiple statements"},{"n":85,"text":"Consider the following statements: :\n1. The Barren Island voleano is an active volcano located in the Indian territory.\n2. Barren Island lies about 140 km east of Great Nicobar.\n3. The last time the Barren Island voleano erupted was in 1991 and it has remained inactive since then.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 3","c":"3 only","d":"1 and 3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":86,"text":"Why is a plant called Prosopis juliflora often mentioned in news ?","options":{"a":"Its extract is widely used in cosmetics.","b":"It tends to reduce the biodiversity in the area in which it grows.","c":"Its extract is used in the synthesis of pesticides.","d":"None of the above"},"s":"environment","ca":true,"f":"Direct"},{"n":87,"text":"Consider the following statements:\n1. Most of the world’s coral reefs are in tropical waters.\n2. More than one-third of the world’s coral reefs are located in the territories of Australia, Indonesia and Philippines.\n3. Coral reefs host far more number of animal phyla than those hosted by tropical rainforests,\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2 only","b":"3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":88,"text":"“Momentum for Change: Climate Neutral Now” is an initiative launched by","options":{"a":"The Intergovernmental Panel on Climate Change","b":"The UNEP Secretariat","c":"The UNFCCC Secretariat","d":"The World Meteorological Organization"},"s":"environment","ca":true,"f":"Direct"},{"n":89,"text":"With reference to educational institutions during colonial rule in India, consider the following pairs:\nInstitution Founder\n1. Sanskrit College — William at Benaras Jones\n2. CaleuttaMadarsa — Warren Hastings\n3. ‘Fort William — Arthur College Wellesley\nWhich of the pairs given above is/are correct ?","options":{"a":"1 and 2","b":"2 only","c":"1 and 3","d":"3 only"},"s":"history","ca":false,"f":"Match / pairs"},{"n":90,"text":"Consider the following pairs: Regions sometimes Country mentioned in news * Catalonia — Spain\n2. Crimea — Hungary\n3. Mindanao — Philippines\n4. Oromia ' — Nigeria\nWhich of the pairs given above are correctly matched ?","options":{"a":"1, 2 and 3","b":"3 and 4 only","c":"1 and 3 only","d":"2 and 4 only"},"s":"geography","ca":true,"f":"Match / pairs"},{"n":91,"text":"Consider the following events:\n1. The first democratically elected communist party government formed in a State in India.\n2. India's then largest bank, 'Imperial Bank of India', was renamed 'State Bank of India'.\n3. Air India was nationalised and became the national carrier.\n4. Goa became a part of independent India.\nWhich of the following is the correct chronological sequence of the above events?","options":{"a":"4 – 1 – 2 – 3","b":"3 – 2 – 1 – 4","c":"4 – 2 – 1 – 3","d":"3 – 1 – 2 – 4"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":92,"text":"Right to Privacy is protected as an intrinsic part of Right to Life and Personal Liberty.\nWhich of the following in the Constitution of India correctly and appropriately imply the above statement ?","options":{"a":"Article 14 and the provisions under the 424 Amendment to the Constitution","b":"Article 17 and the Directive Principles of State Policy in Part IV","c":"Article 21 and the freedoms guaranteed in Part III","d":"Article 24 and the provisions under the 44** Amendment to the Constitution"},"s":"polity","ca":false,"f":"Direct"},{"n":93,"text":"Consider the following:\n1. Areca nut\n2. Barley\n3. Coffee\n4. Finger millet\n5. Groundnut\n6. Sesamum\n7. Turmeric The Cabinet Committee on Economic Affairs has announced the Minimum Support Price for which of the above ?","options":{"a":"1, 2, 3 and 7 only.","b":"2, 4, 5 and 6 only","c":"1, 3, 4, 5 and 6 only","d":"1, 2, 3, 4, 5, 6 and 7"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":94,"text":"In which one of the following States is Pakhui Wildlife Sanctuary located ?","options":{"a":"Arunachal Pradesh","b":"Manipur","c":"Meghalaya","d":"Nagaland"},"s":"environment","ca":false,"f":"Direct"},{"n":95,"text":"With reference to India’s satellite launch vehicles, consider the following statements:\n1. PSLVs launch the satellites useful for Earth resources monitoring whereas GSLVs are designed mainly to launch communication satellites.\n2. Satellites launched by PSLV appear to remain permanently fixed in the same position in the sky, as viewed from a particular location on Earth.\n3. GSLV Mk II is a four-staged launch vehicle with the first and third stages using solid rocket motors and the second and fourth stages using liquid rocket engines.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 3","c":"1 and 2","d":"3 only"},"s":"science","ca":true,"f":"Multiple statements"},{"n":96,"text":"With reference to the governance of public sector banking in India, consider the following statements:\n1. Capital infusion into public sector banks by the Government of India has steadily increased in the last decade.\n2. To put the public sector banks in order, the merger of associate banks with the parent State Bank of India has been affected.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":97,"text":"Consider the following items:\n1. Cereal grains hulled\n2. Chicken eggs cooked\n3. Fish processed and canned\n4. Newspapers containing advertising material\nWhich of the above items is/are exempted under GST (Goods and Services Tax) ?","options":{"a":"1 only","b":"2 and 3 only","c":"1, 2 and 4 only","d":"1, 2, 3 and 4"},"s":"science","ca":true,"f":"Multiple statements"},{"n":98,"text":"Consider the following statements:\n1. The definition of “Critical Wildlife Habitat” is incorporated in the Forest Rights Act, 2006.\n2. ‘For the first time in India, Baigas have been given Habitat Rights.\n3. Union Ministry of Environment, Forest and Climate Change officially decides and declares Habitat Rights for Primitive and Vulnerable Tribal Groups in any part of India.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"Sonly","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":99,"text":"Consider the following:\n1. Birds 2 Dust blowing\n3. Rain 4, Wind blowing\nWhich of the above spread plant diseases ?","options":{"a":"1 and 3 only","b":"3 .and 4 only","c":"1, 2 and 4 only","d":"1, 2, 3 and 4"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":100,"text":"With reference to organic farming in India, consider the following statements:\n1. ‘The National Programme for Organic Production’ (NPOP) is operated under the guidelines and directions of the Union Ministry of Rural Development.\n2. ‘The Agricultural and Processed Food Products Export Development Authority’ (APEDA) functions as the Secretariat for the implementation of NPOP.\n3. Sikkim has become India’s first fully organic State.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"B8 only","d":"1, 2 and 3"},"s":"economy","ca":true,"f":"Multiple statements"}]});

eference to forced labour (Vishti) in: India during the Gupta period, which one of the following statements is correct ?","options":{"a":"It was considered a source of income for the State, a sort of tax paid by the people.","b":"It was totally absent in the Madhya Pradesh and Kathiawar regions of the Gupta Empire.","c":"The forced laborer was entitled to weekly wages.","d":"The eldest son of the laborer was sent as the forced laborer he <e,. ("},"s":"economy","ca":false,"f":"Direct"},{"n":11,"text":"Building ‘Kalyaana Mandapas’ was a notable feature in the temple construction in the kingdom of","options":{"a":"Chalukya","b":"Chandela","c":"Rashtrakuta","d":"Vijayanagara"},"s":"history","ca":false,"f":"Direct"},{"n":12,"text":"Consider the following statements:\n1. In the revenue administration of. Delhi Suitanate, the in-charge of revenue collection was known as ‘Amil’,\n2. The Iqta system of Sultans of Delhi was an ancient indigenous institution.\n3. The office of ‘Mir Bakshi’ came into existence during the reign of Khalji Sultans of Delhi.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"1 and 2 only","c":"3 only","d":"1, 2 and 3"},"s":"history","ca":false,"f":"Multiple statements"},{"n":13,"text":"Consider the following statements:\n1. Saint Nimbarka was a contemporary of Akbar.;\n2. Saint Kabir was greatly influenced by Shaikh Ahmad Sirhindi.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2 /54A 7."},"s":"history","ca":false,"f":"Multiple statements"},{"n":14,"text":"With reference to the British colonial rule in India, consider the following statements:\n1. Mahatma Gandhi was instrumental in the abolition of the system of indentured labour’.\n2. In Lord Chelmsford’s ‘War Conference’, Mahatma Gandhi did not support the resolution on recruiting Indians for World War.\n3. Consequent upon the breaking of Salt Law by Indian people, the Indian National Congress was declared illegal by the colonial rulers.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only.","b":"1 and 3 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"history","ca":false,"f":"Multiple statements"},{"n":15,"text":"With reference to Indian National Movement, consider the following pairs:\nPerson Position held\n1. Sir Tej Bahadur: President, All India Sapru Liberal Federation\n2. K. C. Neogy: Member, The Constituent Assembly\n3. P. C. Josh: General Secretary, Communist Party of India\nWhich of the pairs given above is/are correctly matched ?","options":{"a":"1 only","b":"1 and 2 only","c":"3 only","d":"1, 2 and 3"},"s":"history","ca":false,"f":"Match / pairs"},{"n":16,"text":"With reference to Mian Hansen, which one of the following statements is not correct ?","options":{"a":"Hansen was the title given to him by Emperor Akbar.","b":"Hansen composed Dhrupads on Hindu gods and goddesses. ’","c":"Hansen composed songs on his patrons.","d":"Hansen invented many Ragas."},"s":"history","ca":false,"f":"Direct"},{"n":17,"text":"Who among the following Mughal Emperors’ shifted emphasis from illustrated manuscripts to album and individual portrait ?","options":{"a":"Humayun","b":"Akbar","c":"Jahangir","d":"Shah Japan"},"s":"history","ca":false,"f":"Direct"},{"n":18,"text":"Which one of the following National Parks: lies completely in the temperate alpine zone ?:","options":{"a":"Manas National Park","b":"Namdapha National Park","c":"Nora Valley National Park","d":"Valley of Flowers National Park /S84A"},"s":"environment","ca":false,"f":"Direct"},{"n":19,"text":"Atal Innovation Mission is set up under the ‘","options":{"a":"Department of Science and Technology","b":"Ministry of Labour and Employment","c":"NITI Aayog","d":"Ministry of Skill Development and Entrepreneurship"},"s":"science","ca":true,"f":"Direct"},{"n":20,"text":"On 21st June, the Sun","options":{"a":"does not set below the horizon at the Arctic Circle","b":"does not set below the horizon at the Antarctic Circle","c":"shines vertically overhead at noon on the Equator","d":"shines vertically overhead at the Tropic of Capricorn"},"s":"geography","ca":false,"f":"Direct"},{"n":21,"text":"Which one of the following groups of plants was domesticated in the ‘New World’ and introduced into the ‘Old World’ ?","options":{"a":"Tobacco, cocoa and rubber","b":"Tobacco, cotton and rubber","c":"Cotton, coffee and sugarcane","d":"Rubber, coffee and wheat"},"s":"geography","ca":false,"f":"Direct"},{"n":22,"text":"Consider the following statements:\n1. Asiatic lion is naturally found in India only.\n2. Double-humped camel is naturally found in India only.\n3. One-horned rhinoceros is naturally found in India only.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":23,"text":"Consider the following pairs:\nFamous place River\n1. Pandharpur: Chandrabhaga\n2. Tiruchirappalli: Cauvery.\n3. Hampi: Malaprabha\nWhich of the pairs given above are: correctly matched ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3 /54A"},"s":"geography","ca":false,"f":"Match / pairs"},{"n":24,"text":"In a given year in India, official poverty lines are higher in some States than in others because.","options":{"a":"poverty rates vary from State to State","b":"price levels vary from State to State.","c":"Gross State Product varies from State to State","d":"quality of public distribution varies from State to State"},"s":"economy","ca":false,"f":"Direct"},{"n":25,"text":"In the context of which of the following do some scientists suggest the use of cirrus cloud thinning technique and the injection of sulfate aerosol into stratosphere ?","options":{"a":"Creating the artificial rains in some regions","b":"Reducing the frequency and intensity of tropical cyclones","c":"Reducing the adverse effects of solar wind on the Earth","d":"Reducing the global warming"},"s":"science","ca":true,"f":"Direct"},{"n":26,"text":"In the context of which one of the following are the terms ‘pyrolysis and plasma gratification’ mentioned ?","options":{"a":"Extraction of rare earth elements","b":"Natural gas extraction technologies","c":"Hydrogen fuel-based automobiles","d":"Waste-to-energy technologies"},"s":"science","ca":true,"f":"Direct"},{"n":27,"text":"Which of the following are in Agasthyamala Biosphere Reserve ?","options":{"a":"Neyyar, Peppara and Shendurney Wildlife Sanctuaries and Kalakad Mundanthurai Tiger Reserve","b":"Mudumalai, Sathyamangalam and Wayanad Wildlife Sanctuaries and Silent Valley National Park","c":"Kaundinya, Gundla Brahmeswaram and Papikonda Wildlife y Sanctuaries and Mukurthi National Park","d":"Kawal and Sri Venkateswara Wildlife Sanctuaries and Nagarjunasagar-Srisailam Tiger Reserve"},"s":"environment","ca":false,"f":"Direct"},{"n":28,"text":"Consider the following statements:\n1. Some species of turtles are herbivores.\n2. Some species of fish are herbivores.\n3. Some species of marine mammals are herbivores.\n4. Some species of snakes are viviparous.. Which of the statements given above are correct ?","options":{"a":"1 and 3 only","b":"2, 3 and 4 only","c":"2 and 4 only","d":"1, 2, 3 and 4 /54A"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":29,"text":"Consider the following pairs:\nWildlife Naturally found in\n1. Blue-finned Mahseer: Cauvery River\n2. Irrawaddy Dolphin: Chambal River\n3. Rusty-spotted Cat: Eastern Ghats\nWhich of the pairs given above are correctly matched ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Match / pairs"},{"n":30,"text":"Why is there a great concern about the ‘microbes’ that are released into environment ?","options":{"a":"They are considered harmful to marine ecosystems. ‘","b":"They are considered to cause skin cancer in children.","c":"They are small enough to be absorbed by crop plants in irrigated fields.","d":"They are often found to be used as food adulterants. 3"},"s":"environment","ca":false,"f":"Direct"},{"n":31,"text":"Recently, there was a growing awareness in our country about the importance of Himalayan nettle (Girardinia diversifolia) because it is found to be a sustainable source of","options":{"a":"anti-malarial drug","b":"biodiesel","c":"pulp for paper industry","d":"textile fire"},"s":"economy","ca":true,"f":"Direct"},{"n":32,"text":"For the measurement/estimation of which of the following are satellite: images/remote sensing data used ?\n1. Chlorophyll content in the vegetation of a specific location\n2. Greenhouse gas emissions from rice paddies of a specific location\n3. Land surface temperatures of a specific location\nSelect the correct answer using the code given below.","options":{"a":"1 only","b":"2 and 3 only","c":"3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":33,"text":"Consider the following States:\n1. Chhattisgarh\n2. Madhya Pradesh\n3. Maharashtra\n4. Odisha: With reference to the States mentioned above, in terms of percentage of forest cover to the total area of State, which ° one of the following is the correct ascending order ?","options":{"a":"2-3-1-4","b":"2-3-4-1","c":"3-2-4-1","d":"3-2~1-4 /54A"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":34,"text":"Which of the following statements are correct about the deposits of ‘methane hydrate’ ?\n1. Global warming might trigger the release of methane gas from these deposits.\n2. Large deposits of ‘methane hydrate’ are found in Arctic Tundra and under the seafloor.\n3. Methane in atmosphere oxidizes to carbon dioxide after a decade or two.\nSelect the correct answer using the code given below.","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":35,"text":"Consider th iety"},"s":"economy","ca":false,"f":"Direct"},{"n":81,"text":"With reference to the Constitution of India, consider the following statements:\n1. No High Court shall have the jurisdiction to declare any central law to be constitutionally invalid.\n2. An amendment to the Constitution of India cannot be called into 5; question by the Supreme Court of India.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":82,"text":"Consider the following statements:\n1. Purchasing Power Parity (PPP} exchange rates are calculated by comparing the prices of the same basket of goods and services in different countries.\n2. In terms of PPP dollars, India is the sixth largest economy in the world. ' Which is/are correct ? of the statements given above","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2 /54A."},"s":"economy","ca":false,"f":"Multiple statements"},{"n":83,"text":"With reference to the cultivation of Kharif crops in India in the last five years, consider the following statements:\n1. Area under rice cultivation is the highest i\n2. Area under the cultivation of jowar is more than that of oilseed.\n3. Area of cotton cultivation is more than that of sugarcane. —\n4. Area under sugarcane cultivation has steadily decreased i\nWhich of the statements given above are correct ?","options":{"a":"1 and 3 only","b":"2, 3 and 4 only:","c":"2 and 4 only","d":"1, 2, 3 and 4"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":84,"text":"Among the agricultural commodities imported by India, which one of the following accounts for the highest imports in terms of value in the last five years ?","options":{"a":"Spices","b":"Fresh fruits","c":"Pulses","d":"Vegetable oils"},"s":"economy","ca":false,"f":"Direct"},{"n":85,"text":"In the context of polity, which one of the following would you accept as the most appropriate de es?","options":{"a":"Japan","b":"Russia","c":"The United Kingdom","d":"The United States of America"},"s":"science","ca":true,"f":"Direct"},{"n":90,"text":"The money multiplier in an economy increases with which one of the following ?","options":{"a":"Increase in the cash reserve ratio","b":"Increase in the banking habit of the population","c":"Increase in the statutory liquidity ratio","d":"Increase in the population of the country 39 iv TP ATMO."},"s":"economy","ca":false,"f":"Direct"},{"n":91,"text":"In the context of digital technologies for entertainment, consider the following statements:\n1. In Augmented Reality {AR), a simulated environment is created and the physical world is completely shut out.\n2. In Virtual Reality (VR), images generated from a computer are projected onto real-life objects or surroundings.\n3. AR allows individuals to be present in the world and improves the experience using the camera of smart-phone or PC.\n4. VR closes the world, and transposes an individual, providing complete immersion experience.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2 only","b":"3 and 4","c":"1, 2 and 3","d":"4 only"},"s":"science","ca":true,"f":"Multiple statements"},{"n":92,"text":"The word ‘Denisovan’ is sometimes mentioned in media in reference to","options":{"a":"fossils of a kind of dinosaurs","b":"an early human species","c":"a cave system found in North-East India","d":"a geological period in the history of; Indian subcontinent"},"s":"science","ca":true,"f":"Direct"},{"n":93,"text":"With reference to the recent developments in science, which one of: the following statements is not correct ?","options":{"a":"Functional chromosomes can be created by joining segments of DNA taken from cells of different species.","b":"Pieces of artificial functional DNA can be created in laboratories. /54A","c":"A piece of DNA taken out from an animal cell can be made to replicate outside a living cell in a laboratory.","d":"Cells taken out from plants and animals can be made to undergo cell division in laboratory petra dishes."},"s":"general-science","ca":true,"f":"Direct"},{"n":94,"text":"Consider the following statements: ; A digital signature is\n1. an electronic record that identifies the certifying authority issuing it\n2. used to serve as a proof of identity of an individual to access information or server on Internet,\n3. an electronic method of signing an electronic document and ensuring that the original content is unchanged\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 3 only","c":"3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":95,"text":"In the context of wearable technology, which of the following tasks is/are accomplished by wearable devices ?\n1. Location identification of a person\n2. Sleep monitoring of a person\n3. Assisting the hearing impaired person\nSelect the correct answer using the code given below.","options":{"a":"1 only","b":"2 and 3 only","c":"3 only","d":"1, 2 and 3"},"s":"international","ca":true,"f":"Multiple statements"},{"n":96,"text":"‘RNA interference (RNAi)’ technology has gained popularity in the last few years. Why ?\n1. It is used in developing gene silencing therapies.\n2. It can be used in developing therapies for the treatment of cancer.:\n3. It can be used to develop hormone replacement therapies.\n4. It can be used to produce crop plants that are resistant to viral pathogens.\nSelect the correct answer using the code given below.","options":{"a":"1, 2 and 4","b":"2 and 3","c":"1 and 3","d":"1 and 4 only"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":97,"text":"Recently, scientists observed the merger of giant ‘backhoes’ billions of lightyear away from the Earth. What is the significance of this observation ?","options":{"a":"Highs boson particles’ were detected.","b":"‘Gravitational waves’ were detected.","c":"Possibility of inter-galactic space travel through ‘wormhole’ was confirmed.","d":"It enabled the scientists to understand ‘singularity’."},"s":"environment","ca":true,"f":"Direct"},{"n":98,"text":"Which of the following are the reasons for the occurrence of multi-drug resistance in microbial pathogens in India?\n1. Genetic predisposition of some people\n2. Taking incorrect doses of antibiotics to cure diseases\n3. Using antibiotics in livestock farming\n4. Multiple chronic diseases in some people\nSelect the correct answer using the code given below.","options":{"a":"1 and 2","b":"2 and 3 only","c":"1, 3 and 4","d":"2, 3 and 4"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":99,"text":"What is Cas9 protein that is often mentioned in news ?","options":{"a":"A molecular scissors used in targeted gene editing","b":"A biosensor used in the accurate detection of pathogens in patients","c":"A gene that makes plants pestresistant","d":"A herbicidal substance synthesized in genetically modified crops"},"s":"general-science","ca":true,"f":"Direct"},{"n":100,"text":"Which one of the following statements is not correct ?","options":{"a":"Hepatitis B virus is transmitted much like HIV.","b":"Hepatitis B, unlike Hepatitis C, does not have a vaccine.","c":"Globally, the number of people infected with Hepatitis B and C viruses are several times more than those infected with HIV.","d":"Some of those infected with. Hepatitis B and C viruses do not show the symptoms for many years."},"s":"general-science","ca":false,"f":"Direct"}]});
