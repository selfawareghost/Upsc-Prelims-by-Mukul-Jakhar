ights over virtual items” ?","options":{"a":"Big data analytics","b":"Cryptography","c":"Metaverse","d":"Virtual matrix"},"s":"environment","ca":false,"f":"Direct"},{"n":49,"text":"With reference to the rule/rules imposed by the Reserve Bank of India while treating foreign banks, consider the following statements:\n1. There is no minimum capital requirement for wholly owned banking subsidiaries in India.\n2. For wholly owned banking subsidiaries in India, at least 50% of the board members should be Indian nationals.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":50,"text":"With reference to Corporate Social Responsibility (CSR) rules in India, consider the following statements:\n1. CSR rules specify that expenditures that benefit the company directly or its employees will not be considered as CSR activities.\n2. CSR rules do not specify minimum spending on CSR activities.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2 ~A)"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":51,"text":"Consider the following statements:\nStatement-I: If the United States of America (USA) were to. default on its debt, holders of US Treasury Bonds will not be able to exercise their claims to receive payment.\nStatement-II: The USA Government debt is not backed by any hard assets, but only by the faith of the Government.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II explains Statement-I","b":"Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I","c":"Statement-I is correct, but Statement-II is incorrect","d":"Statement-I is incorrect, but Statement-II is correct"},"s":"international","ca":true,"f":"Statement I/II"},{"n":52,"text":"Consider the following statements:\nStatement-I: Syndicated lending spreads the risk of borrower default across multiple lenders.\nStatement-ll: The syndicated loan can be a fixed amount/lump sum of funds, but cannot be a credit line.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II explains Statement-I","b":"Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I","c":"Statement-I is correct, but Statement-II is incorrect","d":"Statement-I is incorrect, but Statement-II is correct"},"s":"economy","ca":false,"f":"Direct"},{"n":53,"text":"Consider the following statements in respect of the digital rupee:\n1. It is a sovereign currency issued by the Reserve Bank of India (RBI) in alignment with its monetary policy.\n2. It appears as a liability on the RBI's balance sheet.\n3. It is insured against inflation by its very design.\n4. It is freely convertible against commercial bank money and cash.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"1 and 3 only","c":"2 and 4 only","d":"1, 2 and 4"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":54,"text":"With reference to ancient India, Gautama Buddha was generally known by which of the following epithets ?\n1. Nayaputta\n2. Shakyamuni\n3. Tathagata\nSelect the correct answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1, 2 and 3","d":"None of the above are epithets of Gautama Buddha"},"s":"history","ca":false,"f":"Multiple statements"},{"n":55,"text":"Consider the following information:\nSite Port town a. a site Pee (Pa ae site Salihundam Andhra Rock-cut Pradesh cave shrines In which of the above rows is the given information correctly matched ?","options":{"a":"1 and 2","b":"2and3","c":"B3and4","d":"1 and 4"},"s":"geography","ca":false,"f":"Match / pairs"},{"n":56,"text":"Who of the following rulers of medieval India gave permission to the Portuguese to build a fort at Bhatkal ?","options":{"a":"Krishnadevaraya","b":"Narasimha Saluva","c":"Muhammad Shah III","d":"Yusuf Adil Shah"},"s":"history","ca":true,"f":"Direct"},{"n":57,"text":"With reference to revenue collection by Cornwallis, consider the following statements:\n1. Under the Ryotwari Settlement of revenue collection, the peasants were exempted from revenue payment in case of bad harvests or natural calamities.\n2. Under the Permanent Settlement in Bengal, if the Zamindar failed to pay his revenues to the state, on or before the fixed date, he would be removed from his Zamindari.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"history","ca":false,"f":"Multiple statements"},{"n":58,"text":"Consider the following statements:\n1. There are no parables in Upanishads.\n2. Upanishads were composed earlier than the Puranas.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"history","ca":false,"f":"Multiple statements"},{"n":59,"text":"Consider the following statements:\n1. India is a member of the International Grains Council.\n2. A country needs to be a member of the International Grains Council for exporting or importing rice and wheat.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":60,"text":"Which one of the following was the latest inclusion in the Intangible Cultural Heritage\nList of UNESCO ?","options":{"a":"Chhau dance","b":"Durga puja","c":"Garba dance","d":"Kumbh mela"},"s":"history","ca":false,"f":"Direct"},{"n":61,"text":"Who was the Provisional President of the Constituent Assembly before Dr. Rajendra Prasad took over ?","options":{"a":"C. Rajagopalachari","b":"Dr. B.R. Ambedkar","c":"TT.T. Krishnamachari","d":"Dr. Sachchidananda Sinha"},"s":"international","ca":true,"f":"Direct"},{"n":62,"text":"With reference to the Government of India Act, 1935, consider the following statements:\n1. ‘It provided for the establishment of an All India Federation based on the union of the British Indian Provinces and Princely States.\n2. Defence and Foreign Affairs were kept under the control of the federal legislature.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":63,"text":"Which one of the following is a work attributed to playwright Bhasa ?","options":{"a":"Kavyalankara","b":"Natyashastra","c":"Madhyama-vyayoga","d":"Mahabhashya"},"s":"history","ca":false,"f":"Direct"},{"n":64,"text":"Sanghabhuti, an Indian Buddhist monk, who travelled to China at the end of the fourth century AD, was the author of a commentary on:","options":{"a":"Prajnaparamita Sutra","b":"Visuddhimagga","c":"Sarvastivada Vinaya","d":"Lalitavistara"},"s":"misc","ca":true,"f":"Direct"},{"n":65,"text":"Consider the following properties included in the World Heritage List released by UNESCO:\n1. Shantiniketan\n2. Rani-ki-Vav\n3. Sacred Ensembles of the Hoysalas\n4. Mahabodhi Temple Complex at Bodhgaya\nHow many of the above properties were included in 2023 ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All four"},"s":"history","ca":true,"f":"How many"},{"n":66,"text":"As per Article 368 of the Constitution of India, the Parliament may amend any provision of the Constitution by way of:\n1. Addition\n2. Variation\n3. Repeal\nSelect the correct answer using the code given below:","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":67,"text":"Consider the following countries:\n1. Italy\n2. Japan\n3. Nigeria\n4. South Korea\n5. South Africa\nWhich of the above countries are frequently mentioned in the media for their low birth rates, or ageing population or declining population ?","options":{"a":"1, 2 and 4","b":"1, 3 and 5","c":"2 and 4 only","d":"3 and 5 only"},"s":"international","ca":true,"f":"Multiple statements"},{"n":68,"text":"Which of the following statements are correct in respect of a Money Bill in the Parliament ?\n1. Article 109 mentions special procedure in respect of Money Bills.\n2. A Money Bill shall not be introduced in the Council of States.\n3. The Rajya Sabha can either approve the Bill or suggest changes but cannot reject it.\n4. Amendments to a Money Bill suggested by the Rajya Sabha have to be accepted by the Lok Sabha.\nSelect the answer using the code given below:","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1, 2 and 3","d":"1, 3 and 4"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":69,"text":"Which of the following is/are correctly matched in terms of equivalent rank in the three services of Indian Defence forces ? [army [Airforce [Navy Brigadier Air Commander Commodore Major Air Vice Vice Admiral General Marshal Major Squadron Lieutenant Leader Commander re Colonel Captain\nSelect the correct answer using the code given below:","options":{"a":"1 and 4","b":"1 and 3","c":"2, 3and4","d":"3 only"},"s":"science","ca":true,"f":"Match / pairs"},{"n":70,"text":"The North Eastern Council (NEC) was established by the North Eastern Council Act, 1971. Subsequent to the amendment of NEC Act in 2002, the Council comprises which of the following members ?\n1. Governor of the Constituent State\n2. Chief Minister of the Constituent State\n3. Three Members to be nominated by the President of India\n4. The Home Minister of India\nSelect the correct answer using the code given below:","options":{"a":"1, 2 and 3 only","b":"1, 3 and 4 only","c":"2 and 4 only","d":"1, 2, 3 and 4"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":71,"text":"How many Delimitation Commissions have been constituted by the Government of India till December 2023 ?","options":{"a":"One","b":"Two","c":"Three","d":"Four"},"s":"science","ca":true,"f":"How many"},{"n":72,"text":"The Constitution (718* Amendment) Act, 1992 amends the Eighth Schedule to the Constitution to include which of the following languages ?\n1. Konkani\n2. Manipuri\n3. Nepali\n4. Maithili\nSelect the correct answer using the code given below:","options":{"a":"1, 2 and 3","b":"1, 2 and 4","c":"1, 3 and 4","d":"2, 3 and 4"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":73,"text":"Consider the following pairs: [Party ‘(ite Leader ‘ Bharatiya Jana Dr. Shyama Prasad Sangh Mukherjee no sen Congress for Jagjivan Ram Democracy + Pere Dev eee\nHow many of the above are correctly matched ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All four"},"s":"misc","ca":true,"f":"How many"},{"n":74,"text":"Which of the following statements are correct about the Constitution of India ?\n1. Powers of the Municipalities are given in Part IX A of the Constitution.\n2. Emergency provisions are given in Part XVIII of the Constitution.\n3. Provisions related to the amendment of the Constitution are given in Part XX of the Constitution.\nSelect the answer using the code given below:","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":75,"text":"Which one of the following statements is correct as per the Constitution of India ?","options":{"a":"Inter-State trade and commerce is a State subject under the State List.","b":"Inter-State migration is a State subject under the State List.","c":"Inter-State quarantine is a Union subject under the Union List.","d":"Corporation tax is a State subject under the State List."},"s":"polity","ca":false,"f":"Direct"},{"n":76,"text":"Under which of the following Articles of the Constitution of India, has the Supreme Court of India placed the Right to Privacy ?","options":{"a":"Article 15","b":"Article 16","c":"Article 19","d":"Article 21"},"s":"polity","ca":false,"f":"Direct"},{"n":77,"text":"What are the duties of the Chief of Defence Staff (CDS) as Head of the Department of Military Affairs ?\n1. Permanent Chairman of Chiefs of Staff Committee\n2. Exercise military command over the three Service Chiefs\n3. Principal Military Advisor to Defence Minister on all tri-service matters\nSelect the correct answer using the code given below:","options":{"a":"1, 2 and 3","b":"1 and 2 only","c":"2 and 3 only","d":"1 and 3 only"},"s":"science","ca":true,"f":"Multiple statements"},{"n":78,"text":"Operations undertaken by the Army towards upliftment of the local population in remote areas to include addressing of their basic needs is called:","options":{"a":"Operation Sankalp","b":"Operation Maitri","c":"Operation Sadbhavana","d":"Operation Madad"},"s":"science","ca":true,"f":"Direct"},{"n":79,"text":"The longest border between any two countries in the world is between:","options":{"a":"Canada and the United States of America","b":"Chile and Argentina","c":"China and India","d":"Kazakhstan and Russian Federation"},"s":"geography","ca":false,"f":"Direct"},{"n":80,"text":"Which of the following statements about the Ethics Committee in the Lok Sabha are correct ?\n1. Initially it was an ad-hoc Committee.\n2. Only a Member of the Lok Sabha can make a complaint relating to unethical conduct of a member of the Lok Sabha.\n3. This Committee cannot take up any matter which is sub-judice.\nSelect the answer using the code given below:","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":81,"text":"Consider the following statements regarding ‘Nari Shakti Vandan Adhiniyam’:\n1. Provisions will come into effect from the 18\" Lok Sabha.\n2. This will be in force for 15 years after becoming an Act.\n3. There are provisions for the reservation of seats for Scheduled Castes Women within the quota reserved for the Scheduled Castes.\nWhich of the statements given above are correct ?","options":{"a":"1, 2 and 3","b":"1 and 2 only","c":"2 and 3 only","d":"1 and 3 only"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":82,"text":"Which of the following statements about ‘Exercise Mitra Shakti-2023’ are correct ?\n1. This was a joint military exercise between India and Bangladesh.\n2. It commenced in Aundh (Pune).\n3. Joint response during counter-terrorism operations was a goal of this operation.\n4. Indian Air Force was a part of this exercise.\nSelect the answer using the code given below:","options":{"a":"1, 2 and 3","b":"1, 2 and 4","c":"1, 3 and 4","d":"2, 3 and 4"},"s":"general-science","ca":true,"f":"Multiple statements"},{"n":83,"text":"A Writ of Prohibition is an order issued by the Supreme Court or High Courts to:","options":{"a":"a government officer prohibiting him from taking a particular action.","b":"the Parliament/Legislative Assembly to pass a law on Prohibition.","c":"the lower court prohibiting continuation of proceedings in a case.","d":"the Government prohibiting it from following an unconstitutional policy."},"s":"polity","ca":false,"f":"Direct"},{"n":84,"text":"Consider the following statements:\n1. It is the Governor of the State who recognizes and declares any community of that State as a Scheduled Tribe.\n2. A community declared as a Scheduled Tribe in a State need not be so in another State.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":85,"text":"With reference to Union Budget, consider the following statements:\n1. The Union Finance Minister on behalf of the Prime Minister lays the Annual Financial Statement before both the Houses of Parliament.\n2. At the Union level, no demand for a grant can be made except on the recommendation of the President of India.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":86,"text":"Who of the following is the author of the books “The India Way” and “Why Bharat Matters” ?","options":{"a":"Bhupender Yadav","b":"Nalin Mehta","c":"Shashi Tharoor","d":"Subrahmanyam Jaishankar"},"s":"misc","ca":true,"f":"Direct"},{"n":87,"text":"Consider the following pairs: news a [ena regular paramilitary army forces and PP ference of NATO\nHow many of the pairs given above are correctly matched ?","options":{"a":"Only one pair","b":"Only two pairs","c":"All three pairs","d":"None of the pairs"},"s":"international","ca":true,"f":"How many"},{"n":88,"text":"Consider the following statements:\nStatement-I: Sumed pipeline is a strategic route for Persian Gulf oil and natural gas shipments to Europe.\nStatement-II: Sumed pipeline connects the Red Sea with the Mediterranean Sea.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II explains Statement-I","b":"Both Statement-I and Statement-II are correct, but Statement-IIl does not explain Statement-I","c":"Statement-I is correct, but Statement-II is incorrect","d":"Statement-I is incorrect, but Statement-II is correct"},"s":"international","ca":true,"f":"Statement I/II"},{"n":89,"text":"Consider the following statements:\n1. The Red Sea receives very little precipitation in any form.\n2. No water enters the Red Sea from rivers.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":90,"text":"According to the Environmental Protection Agency (EPA), which one of the following is the largest source of sulphur dioxide emissions ?","options":{"a":"Locomotives using fossil fuels","b":"Ships using fossil fuels","c":"Extraction of metals from ores","d":"Power plants using fossil fuels"},"s":"environment","ca":true,"f":"Direct"},{"n":91,"text":"Consider the following statements:\nStatement-I: There is instability and worsening security situation in the Sahel region.\nStatement-II: There have been military takeovers/coups d’état in several countries of the Sahel region in the recent past.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II explains Statement-I","b":"Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I","c":"Statement-I is correct, but Statement-II is incorrect","d":"Statement-I is incorrect, but Statement-II is correct"},"s":"geography","ca":true,"f":"Statement I/II"},{"n":92,"text":"Consider the following statements:\nStatement-I: India does not import apples from the United States of America.\nStatement-II: In India, the law prohibits the import of Genetically Modified food without the approval of the competent authority.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II explains Statement-I","b":"Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I","c":"Statement-I is correct, but Statement-II is incorrect","d":"Statement-I is incorrect, but Statement-II is correct"},"s":"economy","ca":false,"f":"Statement I/II"},{"n":93,"text":"With reference to the Speaker of the Lok Sabha, consider the following statements:\nWhile any resolution for the removal of the Speaker of the Lok Sabha is under consideration\n1. He/She shall not preside.\n2. He/She shall not have the right to speak.\n3. He/She shall not be entitled to vote on the resolution in the first instance.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"1 and 2 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":94,"text":"With reference to the Indian Parliament, consider the following statements:\n1. A bill pending in the Lok Sabha lapses on its dissolution.\n2. A bill passed by the Lok Sabha and pending in the Rajya Sabha lapses on the dissolution of the Lok Sabha.\n3. A bill in regard to which the President of India notified his/her intention to summon the Houses to a joint sitting lapses on the dissolution of the Lok Sabha.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"3 only"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":95,"text":"With reference to the Parliament of India, consider the following statements:\n1. Prorogation of a House by the President of India does not require the advice of the Council of Ministers.\n2. Prorogation of a House is generally done after the House is adjourned sine die but there is no bar to the President of India prorogating the House which is in session.\n3. Dissolution of the Lok Sabha is done by the President of India who, save in exceptional circumstances, does so on the advice of the Council of Ministers.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"3 only"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":96,"text":"Consider the following statements:\nStatement-I: The European Parliament approved The Net-Zero Industry Act recently.\nStatement-II: The European Union intends to achieve carbon neutrality by 2040 and therefore aims to develop all of its own clean technology by that time.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II explains Statement-I","b":"Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I","c":"Statement-I is correct, but Statement-II is incorrect","d":"Statement-I is incorrect, but Statement-II is correct -~A)"},"s":"science","ca":true,"f":"Statement I/II"},{"n":97,"text":"Consider the following statements:\nStatement-I: Recently, Venezuela has achieved a rapid recovery from its economic crisis and succeeded in preventing its people from fleeing/emigrating to other countries.\nStatement-II: Venezuela has the world’s largest oil reserves.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement-I and Statement-II are correct and Statement-II explains Statement-I","b":"Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I","c":"Statement-I is correct, but Statement-II is incorrect","d":"Statement-I is incorrect, but Statement-II is correct"},"s":"economy","ca":true,"f":"Statement I/II"},{"n":98,"text":"With reference to the Digital India Land Records Modernisation Programme, consider the following statements:\n1. To implement the scheme, the Central Government provides 100% funding.\n2. Under the Scheme, Cadastral Maps are\n3. An initiative has been undertaken to transliterate the Records of Rights from local language to any of the languages recognized by the Constitution of India.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":99,"text":"With reference to the ‘Pradhan Mantri Surakshit Matritva Abhiyan’, consider the following statements:\n1. This scheme guarantees a minimum package of antenatal care services to women in their second and third trimesters of pregnancy and six months post-delivery health care service in any government health facility.\n2. Under this scheme, private sector health care providers of certain specialities can volunteer to provide services at nearby government health facilities.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":100,"text":"With reference to the Pradhan Mantri Shram Yogi Maan-dhan ( ) Yojana, consider the following statements:\n1. The entry age group for enrolment in the scheme is 21 to 40 years.\n2. Age specific contribution shall be made by the beneficiary.\n3. Each subscriber under the scheme shall receive a minimum pension of = 3, 000 per month after attaining the age of 60 years.\n4. Family pension is applicable to the spouse and unmarried daughters.\nWhich of the statements given above is/are correct ?","options":{"a":"1, 3 and 4","b":"2 and 3 only","c":"2 only","d":"1, 2 and 4"},"s":"economy","ca":true,"f":"Multiple statements"}]});

PYQ.register("2025", {"id":"2025","year":2025,"title":"Civil Services (Preliminary) Examination 2025","paper":"General Studies Paper I","series":"A","durationMin":120,"type":"text","key":"baabdcaaaaccbabcbdbcbcddccacccbcbaacdcbbcdccbbcddaccaacddadbdadcaccabdbcbacbaacdaabbaacddaddcdadaaab","keyNote":"Official answer key released by UPSC.","questions":[{"n":1,"text":"With reference to investments, consider the following:\nI. Bonds\nII. Hedge Funds\nIII. Stocks\nIV. Venture Capital\nHow many of the above are treated as Alternative Investment Funds ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All the four"},"s":"economy","ca":false,"f":"How many"},{"n":2,"text":"Which of the following are the sources of income for the Reserve Bank of India ?\nI. Buying and selling Government bonds\nII. Buying and selling foreign currency\nIII. Pension fund management\nIV. Lending to private companies\nV. Printing and distributing currency notes\nSelect the correct answer using the code given below.","options":{"a":"I and II only","b":"II, III and IV","c":"III, IV and V","d":"II and V"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":3,"text":"With reference to the Government of India, consider the following information:\nOrganization — Some of its functions — It works under\nI. Directorate of Enforcement — Enforcement of the Fugitive Economic Offenders Act, 2018 — Internal Security Division-I, Ministry of Home Affairs\nII. Directorate of Revenue Intelligence — Enforces the provisions of the Customs Act, 1962 — Department of Revenue, Ministry of Finance\nIII. Directorate General of Systems and Data Management — Carrying out big data analytics to assist tax officers for better policy and nabbing tax evaders — Department of Revenue, Ministry of Finance\nIn how many of the above rows is the information correctly matched?","options":{"a":"Only one","b":"Only two","c":"All the three","d":"None"},"s":"economy","ca":false,"f":"Match / pairs"},{"n":4,"text":"Consider the following statements:\nI. The Reserve Bank of India mandates all the listed companies in India to submit a Business Reeren Report (BRSR). and Sustainability\nII. InIndia, a company submitting a BRSR makes disclosures in the report that are largely non-financial in nature.\nWhich of the statements given above is/are correct ?","options":{"a":"I only","b":"II only","c":"Both I and II","d":"Neither I nor II"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":5,"text":"Consider the following statements:\nStatement I: In India, income from allied agricultural activities like poultry farmin areas B is and exempted wool rearing from any in tax. rural\nStatement II: In India, rural agricultural 1 and is not considered a capital asset under the provisions of the Income-tax Act, 1961.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement I and Statement II are correct and Statement II explains Statement I","b":"Both Statement I and Statement II are correct but Statement II does not explain Statement I","c":"Statement I is correct’ but Statement II is not correct","d":"Statement I is not correct but Statement II is correct"},"s":"economy","ca":false,"f":"Statement I/II"},{"n":6,"text":"Consider the following statements:\nI. India has joined the Minerals Security Partnership as a member.\nII. India is a resource-rich country in all the 30 critical minerals that it has identified.\nIII. The Parliament in 2023 has amended the Mines and Minerals (Development and Regulation) Act, 1957 empowering the Central Government to exclusively auction mining lease and composite license for certain critical minerals.\nWhich of the statements given above are correct ?","options":{"a":"I and II only","b":"II and III only","c":"I and III only","d":"I, II and III"},"s":"geography","ca":true,"f":"Multiple statements"},{"n":7,"text":"Consider the following statements:\nStatement I: As regards returns from an investment in a company, generally, bondholders are considered to be relatively at lower risk than stockholders.\nStatement II: Bondholders are lenders to a company whereas stockholders are its owners.\nStatement III: For repayment purpose, bondholders are prioritized over stockholders by a company. é Which one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement II and Statement III 3 are correct and both of them explain Statement I","b":"Both Statement I and Statement II are correct and Statement I explains Statement II","c":"Only one of the Statements II and III is correct and that explains Statement I","d":"Neither Statement II nor Statement III is correct"},"s":"economy","ca":false,"f":"Statement I/II"},{"n":8,"text":"Consider the following statements:\nI. India accounts for a very large portion of all equity option contracts traded globally thus exhibiting a great boom.\nII. India’s stock market has grown rapidly in the recent past even overtaking Hong Kong’s at some: point of time.\nII. There is no regulatory body either to warn the small investors about the risks of options trading or to act on unregistered financial advisors in this regard.\nWhich of the statements given above are correct ?","options":{"a":"I and II only","b":"II and III only","c":"I and III only","d":"II and III /56A"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":9,"text":"Consider the following statements:\nStatement I: Circular economy reduces the emissions of greenhouse gases.\nStatement II: Circular economy reduces the use of raw materials as inputs.\nStatement III: Circular economy reduces wastage in the production process.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement II and Statement III are correct and both of them explain Statement I","b":"Both Statement II and Statement III are correct but only one of them explains Statement I","c":"Only one of the Statements II and III is correct and that explains Statement","d":"Neither Statement II nor Statement III is correct"},"s":"economy","ca":true,"f":"Statement I/II"},{"n":10,"text":"Consider the following statements:\nI. Capital receipts create a liability or cause a reduction in the assets of the Government.\nII. Borrowings and disinvestment are capital receipts.\nIII. Interest received on loans creates a liability of the Government.\nWhich of the statements given above are correct ?","options":{"a":"I and II only","b":"II and III only","c":"I and III only","d":"1, ll and III"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":11,"text":"Consider the following statements about Raja Ram Mohan Roy:\nI. He possessed great love and respect for the traditional philosophical systems of the East.\nII. He desired his countrymen to accept the rational and scientific approach and the principle of human dignity and social equality of all men and women.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only 7","b":"II only","c":"Both I and II","d":"Neither I nor II"},"s":"history","ca":false,"f":"Multiple statements"},{"n":12,"text":"Consider the following subjects with regard to Non-Cooperation Programme:\nI. Boycott of law-courts and foreign cloth\nII. Observance of strict non-violence\nIII. Retention of titles and honours without using them in public\nIV. Establishment of Panchayats for. settling disputes\nHow many of the above were parts of Non-Cooperation Programme ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All the four /56A"},"s":"history","ca":true,"f":"How many"},{"n":13,"text":"The irrigation device called ‘Araghatta’ was","options":{"a":"a water bag made of leather pulled over a pulley","b":"a large wheel with earthen pots tied to the outer ends of its spokes","c":"a larger earthen pot driven by bullocks","d":"a large water bucket pulled up by rope directly by hand"},"s":"science","ca":true,"f":"Direct"},{"n":14,"text":"Who among the following rulers in ancient India had assumed the titles Mattavilasa’, Vichitrachitta’ and ‘Gunabhara’ ?","options":{"a":"Mahendravarman I","b":"Simhavishnu","c":"Narasimhavarman I","d":"Simhavarman"},"s":"history","ca":false,"f":"Direct"},{"n":15,"text":"Fa-hien (Faxian), the Chinese pilgrim, travelled to India during the reign of","options":{"a":"Samudragupta","b":"Chandragupta II","c":"Kumaragupta I","d":"Skandagupta"},"s":"history","ca":false,"f":"Direct"},{"n":16,"text":"Who among the following led a successful military campaign against the kingdom of Srivijaya, the powerful maritime State, which ruled the Malay Peninsula, Sumatra, Java and the neighbouring islands ?","options":{"a":"Amoghavarsha (Rashtrakuta)","b":"Prataparudra (Kakatiya)","c":"Rajendra I (Chola)","d":"Vishnuvardhana (Hoysala)"},"s":"science","ca":true,"f":"Direct"},{"n":17,"text":"With reference to ancient India (600-322 BC), consider the following pairs:\nTerritorial River flowing region in the region\nI. Asmaka: Godavari\nII. Kamboja: Vipas\nII. Avanti: Mahanadi\nIV. Kosala: Sarayu\nHow many of the pairs given above are correctly matched ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All the four /56A"},"s":"history","ca":false,"f":"How many"},{"n":18,"text":"The first Gandharva Mahavidyalaya, a music training school, was set up in 1901 by Vishnu Digambar Paluskar in","options":{"a":"Delhi","b":"Gwalior","c":"Ujjain","d":"Lahore"},"s":"history","ca":false,"f":"Direct"},{"n":19,"text":"Ashokan inscriptions suggest that the ‘Pradeshika’, ‘Rajuka’ and ‘Yukta’ were important officers at the","options":{"a":"village-level administration","b":"district-level administration","c":"provincial administration","d":"level of the central administration"},"s":"history","ca":false,"f":"Direct"},{"n":20,"text":"Consider the following statements in respect of the Non-Cooperation Movement:\nI. The Congress’ declared the attainment of ‘Swaraj’ by all legitimate and peaceful means to be its objective.\nII. It was to be implemented in stages with civil disobedience and nonpayment of taxes for the next stage only if ‘Swaraj’ did not come within a year and the Government resorted to repression.\nWhich of the statements given above is/are correct ?","options":{"a":"I only","b":"II only","c":"Both I and II","d":"Neither I nor II"},"s":"history","ca":false,"f":"Multiple statements"},{"n":21,"text":"Consider the following countries:\nI. Austria\nII. Bulgaria\nIII. Croatia\nIV. Serbia\nV. Sweden\nVI. North Macedonia\nHow many of the above are members of the North Atlantic Treaty Organization ?","options":{"a":"Only three","b":"Only four","c":"Only five","d":"All the six"},"s":"international","ca":true,"f":"How many"},{"n":22,"text":"Consider the following countries:\nI. Bolivia\nII. Brazil\nIII. Colombia\nIV. Ecuador ‘\nV. Paraguay\nVI. Venezuela Andes mountains pass through how many of the above countries ?","options":{"a":"Only two","b":"Only three","c":"Only four","d":"Only five"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":23,"text":"Consider the following water bodies:\nI. Lake Tanganyika\nII. Lake Tonlé Sap\nIII. Patos Lagoon Through how many of them does the equator pass ?","options":{"a":"Only one","b":"Only two P","c":"All the three","d":"None"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":24,"text":"Consider the following statements about, turmeric during the year 2022-23:\nI. India is the largest producer and exporter of turmeric in the world.\nII. More than 30 varieties of turmeric are grown in India.\nIII. Maharashtra, Telangana, Karnataka and Tamil Nadu are major turmeric producing States in India.\n/56A 11\nWhich of the statements given above are correct ?","options":{"a":"I and II only","b":"II and II only","c":"I and III only","d":"II and III"},"s":"general-science","ca":true,"f":"Multiple statements"},{"n":25,"text":"Which of the following are the evidences of the phenomenon of continental drift ?\nI. The belt of ancient rocks from Brazil coast matches with those from Western Africa.\nII. The gold deposits of Ghana are derived from the Brazil plateau when the two continents lay side by side. II]. The Gondwana system of sediments from India is known to have its counterparts in six different landmasses of the Southern Hemisphere.\nSelect the correct answer using the code given below.","options":{"a":"I and III only","b":"I and II only","c":"II and III","d":"II and III only"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":26,"text":"Consider the following statements:\nStatement I: The amount of dust particles in the atmosphere is more in subtropical and temperate areas than in equatorial and polar regions.\nStatement II: Subtropical and temperate areas have less dry winds.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement I and Statement II are correct and Statement II explains Statement I","b":"Both Statement I and Statement II are correct but Statement II does not explain Statement I","c":"Statement I is correct’ but Statement II is not correct","d":"Statement I is not correct but Statement II is correct"},"s":"geography","ca":false,"f":"Statement I/II"},{"n":27,"text":"Consider the following statements:\nStatement I: In January, in the Northern Hemisphere, the isotherms bend equatorward while crossing the landmasses, and poleward while crossing the oceans.\nStatement II: In January, the air over the oceans is warmer than that over the landmasses in the Northern Hemisphere.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement I and Statement II are correct and Statement II explains Statement I","b":"Both Statement I and Statement II: are correct but Statement II does not explain Statement I","c":"Statement I is correct but Statement II is not correct","d":"Statement I is not correct but Statement II is correct"},"s":"geography","ca":false,"f":"Statement I/II"},{"n":28,"text":"Consider the following statements:\nStatement I: In the context of effect of water on rocks, chalk is known as a very permeable rock whereas clay is known as quite an impermeable or least permeable rock,\nStatement II: Chalk is porous and hence can j absorb water.\nStatement III: Clay is not at all porous.. Which one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement II and Statement III are correct and both of them explain Statement I","b":"Both Statement II and Statement III are correct but only one of them explains Statement I /56A","c":"Only one of the Statements II and III is correct and that explains Statement I","d":"Neither Statement II nor Statement III is correct"},"s":"science","ca":true,"f":"Statement I/II"},{"n":29,"text":"Consider the following statements:\nI. Without the atmosphere, temperature would be well below freezing point everywhere on the Earth’s surface.\nII. Heat absorbed and trapped by the atmosphere maintains our planet’s average temperature.\nIII. Atmosphere’s gases, like carbon dioxide, are particularly good at absorbing and trapping radiation.\nWhich of the statements given above are correct ?","options":{"a":"I and III only","b":"I and II only","c":"II and III","d":"II and III only"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":30,"text":"Consider the following statements about the Rashtriya Gokul Mission:\nI. It is important for the upliftment of rural poor as majority of low producing indigenous animals are with small and marginal farmers and landless labourers.\nII. It was initiated to promote indigenous cattle and buffalo rearing and conservation in a scientific and holistic manner.\nWhich of the statements given above is/are correct ?","options":{"a":"I only","b":"II only","c":"Both I and II","d":"Neither I nor II ("},"s":"environment","ca":true,"f":"Multiple statements"},{"n":31,"text":"Consider the following statements:\nStatement I: Studies indicate that carbon dioxide emissions from cement industry account for more than 5% of global carbon emissions.\nStatement II: Silica-bearing clay is mixed with limestone while manufacturing cement.\nStatement III: Limestone is converted into lime during clinker production for cement manufacturing., Which one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement II and Statement III, are correct and both of them explain Statement I","b":"Both Statement II and Statement III are correct but only one of them explains Statement I","c":"Only one of the Statements II and III is correct and that explains Statement I","d":"Neither Statement II nor Statement III is correct"},"s":"environment","ca":true,"f":"Statement I/II"},{"n":32,"text":"Consider the following statements:\nStatement I: At the 28th United Nations Climate Change Conference (COP28), India refrained from signing the ‘Declaration on Climate and Health’.\nStatement II: The COP28 Declaration on Climate and Health is a binding declaration and if signed, it becomes mandatory to decarbonize health sector.\nStatement III: If India’s health sector is decarbonized, the resilience of its health-care system may be compromised.\n/56A 15\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement II and Statement III are correct and both of them explain Statement I","b":"Both Statement II and Statement III are correct but only one of them explains Statement I","c":"Only one of the Statements II and III is correct and that explains Statement I","d":"Neither Statement II nor Statement III is correct"},"s":"environment","ca":true,"f":"Statement I/II"},{"n":33,"text":"Consider the following statements:\nStatement: Scientific studies suggest that a shift is taking place in the Earth’s rotation and axis.\nStatement II: Solar flares and associated coronal mass ejections bombarded the Earth’s outermost atmosphere with tremendous amount of energy.\nStatement III: As the Earth’s polar ice melts, the water tends to move towards the equator.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement II and Statement III are correct and both of them explain Statement I","b":"Both Statement II and Statement III are correct but only one of them explains Statement I","c":"Only one of the Statements II and III is correct and that explains Statement I","d":"Neither Statement II nor Statement III is correct"},"s":"geography","ca":false,"f":"Direct"},{"n":34,"text":"Consider the following statements:\nStatement I: Article of the Paris Agreement on climate change is frequently discussed in global discussions on sustainable development and climate change.\nStatement II: Article of the Paris Agreement on climate change sets out the principles of carbon markets.\nStatement III: Article of the Paris Agreement on climate change intends to promote inter-country non-market strategies to reach their climate targets.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement II and Statement III are correct and both of them explain Statement I","b":"Both Statement II and Statement III are correct but only one of them explains Statement I","c":"Only one of the Statements II and III is correct and that explains Statement I","d":"Neither Statement II nor Statement III is correct"},"s":"environment","ca":false,"f":"Statement I/II"},{"n":35,"text":"Which one of the following launched the ‘Nature Solutions Finance Hub for Asia and the Pacific’ ?","options":{"a":"The Asian Development Bank (ADB)","b":"The Asian Infrastructure Investment Bank (AIIB)","c":"The New Development Bank (NDB)","d":"The International Bank for Reconstruction and Development (IBRD) /56A"},"s":"international","ca":true,"f":"Direct"},{"n":36,"text":"With reference to ‘Direct Air Capture’, an emerging technology, which of the following statements is/are correct ?\nI. It can be used as a way of carbon sequestration.\nII. It can be a valuable approach for plastic production and in food processing.\nIII. In aviation, it can be a source of carbon for combining with hydrogen to create synthetic low-carbon fuel.\nSelect the correct answer using the code given below.","options":{"a":"I and II only","b":"III only","c":"II and III","d":"None of the above statements is correct"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":37,"text":"Regarding Peacock tarantula (Gooty tarantula), consider the following statements:\nI. It is an omnivorous crustacean.\nII. Its natural habitat in India is only limited to some forest areas.\nIII. In its natural habitat, it is an arboreal species.\nWhich of the statements given above is/are correct ?","options":{"a":"I only","b":"I and","c":"I only","d":"II and II"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":38,"text":"Consider the following statements:\nI. Carbon dioxide (CO,) emissions in India are less than 05 t CO,/ capita.\nII. In terms of CO, emissions from fuel combustion, India ranks second in Asia-Pacific region.\nIII. Electricity and heat producers are the largest sources of CO, emissions in India.\nWhich of the statements given above is/are correct ?","options":{"a":"I and III only","b":"I only","c":"I and III only","d":"I and III"},"s":"environment","ca":true,"f":"Multiple statements"},{"n":39,"text":"Consider the following pairs:\nPlant Description\nI. Cassava: Woody shrub\nII. Ginger: Herb with pseudostem\nIII. Malabar spinach: Herbaceous climber\nIV. Mint: Annual shrub\nV. Papaya: Woody shrub /56A 19\nHow many of the above pairs are correctly matched ?","options":{"a":"Only two","b":"Only three","c":"Only four","d":"All the five"},"s":"misc","ca":true,"f":"How many"},{"n":40,"text":"With reference to the planet Earth, consider the following statements:\nI. Rain forests produce more oxygen than that produced by oceans.\nII. Marine phytoplankton and photosynthetic bacteria produce about 50% of world’s oxygen.\nIII. Well-oxygenated surface water contains several folds higher oxygen than that in atmospheric air.\nWhich of the statements given above is/are correct ?","options":{"a":"I and II","b":"I only","c":"I and III","d":"None of the above statements is correct"},"s":"science","ca":true,"f":"Multiple statements"},{"n":41,"text":"Consider the following types of vehicles:\nI. Full battery electric vehicles II. Hydrogen fuel cell vehicles III. Fuel cell-electric hybrid vehicles\nHow many of the above are considered as alternative powertrain vehicles ?","options":{"a":"Only one","b":"Only two","c":"All the three","d":"None"},"s":"science","ca":true,"f":"How many"},{"n":42,"text":"With reference to Unmanned Aerial Vehicles (UAVs), consider the following statements:\nI. All types of UAVs can do vertical landing.\nII. All types of UAVs can do automated hovering.\nIII. All types of UAVs can use battery only as a source of power supply.\nHow many of the statements given above are correct ?","options":{"a":"Only one","b":"Only two","c":"All the three","d":"None"},"s":"science","ca":true,"f":"How many"},{"n":43,"text":"In the context of electric vehicle batteries, consider the following elements:\nI. Cobalt\nII. Graphite II. Lithium\nIV. Nickel\nHow many of the above usually make up battery cathodes ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All the four /56A"},"s":"science","ca":true,"f":"How many"},{"n":44,"text":"Consider the following:\nI. Cigarette butts\nII. Eyeglass lenses\nIII. Car tyres\nHow many of them contain plastic ?","options":{"a":"Only one","b":"Only two","c":"All the three","d":"None"},"s":"environment","ca":false,"f":"How many"},{"n":45,"text":"Consider the following substances:\nI. Ethanol\nII. Nitroglycerine\nIII. Urea Coal gasification technology can be used in the production of how many of them ?","options":{"a":"Only one","b":"Only two","c":"All the three","d":"None"},"s":"science","ca":true,"f":"Multiple statements"},{"n":46,"text":"What is the common characteristic of the chemical substances generally known as, HMX and, which are sometimes talked about in media ?","options":{"a":"These are alternatives to hydrofluorocarbon refrigerants","b":"These are explosives in military weapons","c":"These are high-energy fuels for cruise missiles","d":"These are fuels for rocket propulsion"},"s":"general-science","ca":true,"f":"Direct"},{"n":47,"text":"Consider the following statements:\nI. It is expected that Majorana chip will enable quantum computing.\nII. Majorana chip has been introduced by Amazon Web Services (AWS).\nIII. Deep learning is a subset of machine learning.\nWhich of the statements given above are correct ?","options":{"a":"I and II only","b":"II and III only","c":"I and III only","d":"II and III"},"s":"science","ca":true,"f":"Multiple statements"},{"n":48,"text":"With reference to monoclonal antibodies, often mentioned in news, consider the following statements:\nI. They are man-made proteins.\nII. They stimulate immunological function due to their ability to bind to specific antigens.\nIII. They are used in treating viral infections like that of Nipah virus.\nWhich of the statements given above are correct ?","options":{"a":"I and II only","b":"Tl and III only","c":"I and III only","d":"1, ll and III"},"s":"general-science","ca":true,"f":"Multiple statements"},{"n":49,"text":"Consider the following statements:\nI. No virus can survive in ocean waters.\nII. No virus can infect bacteria.\nIII. No virus can change the cellular transcriptional activity in host cells.\n/56A 23\nHow many of the statements given above are correct ?","options":{"a":"Only one","b":"Only two","c":"All the three","d":"None"},"s":"general-science","ca":false,"f":"How many"},{"n":50,"text":"Consider the following statements:\nStatement I:\nActivated carbon is a good and an attractive tool to remove pollutants from effluent streams and to remediate contaminants from various industries.\nStatement II: Activated carbon exhibits a large surface area and a strong potential for adsorbing heavy metals.\nStatement III:\nActivated carbon can be easily synthesized from environmental wastes with high carbon content.\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement II and Statement III are correct and both of them explain Statement I","b":"Both Statement II and Statement III are correct but only one of them explains Statement I","c":"Only one of the Statements II and III is correct and that explains Statement","d":"Neither Statement II nor Statement III is correct"},"s":"environment","ca":false,"f":"Statement I/II"},{"n":51,"text":"With reference to the Indian polity, consider the following statements:\nI. An Ordinance can amend any Central Act.\nII. An Ordinance can abridge a Fundamental Right.\nIII. An Ordinance can come into effect from a back date.\nWhich of the statements given above are correct ?","options":{"a":"I and II only","b":"II and III only","c":"I and III only","d":"1, ll and III"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":52,"text":"Consider the following pairs: State Description\nI. Arunachal: The capital is named after Pradesh a fort, and the State has two National Parks\nII. Nagaland: The State came into existence on the basis of a Constitutional Amendment Act II. Tripura: Initially a Part ‘C’ State, it became a centrally administered territory with the reorganization of States in 1956 and later attained the status of a full-fledged State\nHow many of the above pairs are correctly matched ?","options":{"a":"Only one","b":"Only two","c":"All the three","d":"None"},"s":"polity","ca":false,"f":"How many"},{"n":53,"text":"With reference to India, consider the following:\nI. The Inter-State Council\nII. The National Security Council\nIII. Zonal Councils /56A 2\nHow many of the above’ were established as per the provisions of the Constitution of India ?","options":{"a":"Only one","b":"Only two","c":"All the three","d":"None"},"s":"polity","ca":false,"f":"How many"},{"n":54,"text":"Consider the following statements:\nI. The Constitution of India explicitly mentions that in certain spheres the Governor of a State acts in his/her own discretion.\nII. The President of India can, of his/her own, reserve a bill passed by a State Legislature for his/her consideration without it being forwarded by the Governor of the State concerned.\nWhich of the statements given above is/are correct ?","options":{"a":"I only","b":"II only","c":"Both I and II","d":"Neither I nor II"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":55,"text":"Consider the following pairs: Provision in the Stated under Constitution of India\nI. Separation of Judiciary: The Directive from the Executive in Principles the public services of of the State the State Policy\nII. Valuing and preserving: The Fundaof the rich heritage of mental Duties our composite culture\nIII. Prohibition of employ-: The Fundament of children below mental Rights the age of 14 years in factories\nHow many of the above pairs are correctly matched ?","options":{"a":"Only one","b":"Only two","c":"All the three","d":"None 5"},"s":"polity","ca":false,"f":"How many"},{"n":56,"text":"Consider the following statements:\nWith reference to the Constitution of India, if an area in a State is declared as Scheduled Area under the Fifth Schedule\nI. the State Government loses its executive power in such areas and a local body assumes total administration II. the Union Government can take over the total administration of such areas under certain circumstances on the recommendations of the Governor\nWhich of the statements given above is/are correct ?","options":{"a":"I only","b":"I only","c":"Both I and II","d":"Neither I nor II"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":57,"text":"With reference to India, consider the following pairs: Organization Union Ministry\nI. The National: Ministry of Automotive Board Commerce and Industry\nII. The Coir Board: Ministry of Heavy Industries\nIII. The National: Ministry of Micro, Centre for Trade Small and Medium Information Enterprises\nHow many of the above pairs are correctly matched ?","options":{"a":"Only one","b":"Only two","c":"All the three","d":"None"},"s":"economy","ca":false,"f":"How many"},{"n":58,"text":"Consider the following subjects under the Constitution of India:\nI. List I-Union List, in the Seventh Schedule\nII. Extent of the executive power of a State\nIII. Conditions of the Governor’s office /56A 27 For a constitutional amendment with respect to which of the above, ratification by the Legislatures of not less than one-half of the States is required before presenting the bill to the President of India for assent ?","options":{"a":"I and II only","b":"II and III only","c":"I and III only","d":"II and II"},"s":"polity","ca":false,"f":"Match / pairs"},{"n":59,"text":"With reference to the Indian polity, consider the following statements:\nI. The Governor of a State is not answerable to any court for the exercise and performance of the powers and duties of his/her office.\nII. No criminal proceedings shall be instituted or continued against the Governor during his/her term of office.\nIII. Members of a State Legislature are not liable to any proceedings in any court in respect of anything said within the House.\nWhich of the statements given above are correct ?","options":{"a":"I and II only","b":"I and III only","c":"I and III only","d":"1, ll and III"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":60,"text":"Consider the following activities:\nI. Production of crude oil\nII. Refining, storage and distribution of petroleum\nIII. Marketing and sale of petroleum products\nIV. Production of natural gas\nHow many of the above activities are regulated by the Petroleum and Natural Gas Regulatory Board in our country ?","options":{"a":"Only one","b":"Only two","c":"Only three","d":"All the four fRTO."},"s":"economy","ca":false,"f":"How many"},{"n":61,"text":"Suppose the revenue expenditure is 80, 000 crores and the revenue receipts of the Government are €60, 000 crores. The Government budget also shows borrowings of 10, 000 crores and interest payments of 6, 000 crores. Which of the following statements are correct ?\nI. Revenue deficit is ¥ 20, 000 crores.\nII. Fiscal deficit is € 10, 000 crores.\nIII. Primary deficit is * 4, 000 crores.\nSelect the correct answer using the code given below.","options":{"a":"I and II only","b":"Tl and III only","c":"I and III only","d":"II and III"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":62,"text":"India is one of the founding members of the International North-South Transport Corridor (INSTC), a multimodal transportation corridor, which will connect","options":{"a":"India to Central Asia to Europe via Iran","b":"India to Central Asia via China","c":"India to South-East Asia through Bangladesh and Myanmar","d":"India to Europe through Azerbaijan"},"s":"misc","ca":true,"f":"Direct"},{"n":63,"text":"Consider the following statements:\nStatement I: Of the two major ethanol producers in the world, i.e., Brazil and the United States of America, the former produces more ethanol than the latter.\nStatement II: Unlike in the United States of America where corn is the principal feedstock for ethanol production, sugarcane is the principal feedstock for ethanol production in Brazil.\n/56A 29\nWhich one of the following is correct in respect of the above statements ?","options":{"a":"Both Statement I and Statement II are correct and Statement II explains Statement I","b":"Both Statement I and Statement II are correct but Statement II does not explain Statement I","c":"Statement I is correct but Statement II is not correct","d":"Statement I is not correct but Statement II is correct"},"s":"international","ca":true,"f":"Statement I/II"},{"n":64,"text":"The World Bank warned that India could become one of the first places where wet-bulb temperatures routinely exceed 35 °C. Which of the following statements best reflect(s) the implication of the above-said report ?\nI. Peninsular India will most likely suffer from flooding, tropical cyclones and droughts.\nII. The survival of animals including humans will be affected as shedding of their body heat through perspiration becomes difficult.\nSelect the correct answer using the code given below.","options":{"a":"I only","b":"II only","c":"Both I and II","d":"Neither I nor II"},"s":"geography","ca":true,"f":"Multiple statements"},{"n":65,"text":"A country’s fiscal deficit stands at €50, 000 crores. It is receiving €10, 000 crores through non-debt creating capital receipts. The country’s interest liabilities are € 1, 500 crores. What is the gross primary deficit ?","options":{"a":"48, 500 crores","b":"%©51, 500 crores","c":"%58, 500 crores","d":"None of the above"},"s":"economy","ca":false,"f":"Direct"},{"n":66,"text":"Which of the following statements with regard to recommendations of the 15th Finance Commission of India are correct ?\nI. It has recommended grants of %4, 800 crores from the year 2022-23 to the year 2025-26 for incentivizing States to enhance educational outcomes. II. 45% of the net proceeds of Union taxes are to be shared with States. III. *©45, 000 crores are to be kept as performance-based incentive for all States for carrying out agricultural reforms.\nIV. It reintroduced tax effort criteria to reward fiscal performance.\nSelect the correct answer using the code given below.","options":{"a":"II and III","b":"II and IV","c":"III and IV","d":"II, III and IV"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":67,"text":"Consider the following statements in respect of the International Bank for Reconstruction and Development (IBRD):\nI. It provides loans and guarantees to middle income countries.\nII. It works single-handedly to help developing countries to reduce poverty.\nIII. It was established to help Europe rebuild after the World War II.\nWhich of the statements given above are correct ?","options":{"a":"I and II only","b":"II and III only","c":"I and III only","d":"II and II"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":68,"text":"Consider the following statements in respect of RTGS and NEFT:\nI. In RTGS, the settlement time is instantaneous while in case of NEFT, it takes some time to settle payments.\n/56A 31\nII. In RTGS, the customer is charged for inward transactions while that is not the case for NEFT.\nIII. Operating hours for RTGS are restricted on certain days while this is not true for NEFT.\nWhich of the statements given above is/are correct ?","options":{"a":"I only","b":"I and II","c":"I and III","d":"III only"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":69,"text":"Consider the following countries:\nI. United Arab Emirates\nII. France\nIII. Germany\nIV. Singapore\nV. Bangladesh\nHow many countries amongst the above are there other than India where international merchant payments are accepted under UPI ?","options":{"a":"Only two","b":"Only three","c":"Only four","d":"All the five"},"s":"international","ca":true,"f":"How many"},{"n":70,"text":"Consider the following statements about ‘PM Surya Ghar Muft Bijli Yojana’:\nI. It targets installation of one crore solar rooftop panels in the residential sector.\nII. The Ministry of New and Renewable Energy aims to impart training on installation, operation, maintenance and repairs of solar rooftop systems at grassroot levels.\nIII. It aims to create more than three lakhs skilled manpower through fresh skilling, and upskilling, under scheme component of capacity building.\nWhich of the statements given above are correct ?","options":{"a":"I and II only","b":"I and III only","c":"II and III only","d":"II and III (Poo"},"s":"science","ca":true,"f":"Match / pairs"},{"n":71,"text":"“Sedition has become my religion” was the famous statement given by Gandhiji at the time of","options":{"a":"the Champ All the four"},"s":"general-science","ca":true,"f":"Match / pairs"},{"n":97,"text":"Consider the following statements with regard to BRICS:\nI. 16th BRICS Summit was held under the Chairship of Russia in Kazan.\nII. Indonesia has become a full member of BRICS.\nIII. The theme of the 16th BRICS Summit was Strengthening Multiculturalism for Just Global Development and Security.\nWhich of the statements given above is/are correct ?","options":{"a":"I and II","b":"II and III","c":"I and III","d":"I only"},"s":"international","ca":true,"f":"Multiple statements"},{"n":98,"text":"Consider the following statements about Lokpal:\nI. The power of Lokpal applies to public servants of India, but not to the Indian public servants posted outside India.\nII. The Chairperson or a Member shall not be a Member of the Parliament or a Member of the Legislature of any State or Union Territory, and only the Chief Justice of India, whether incumbent or retired, has to be its Chairperson.\nIII. The Chairperson or a Member shall not be a person of less than forty-five years of age on the date of assuming office as the Chairperson or Member, as the case may be. i\nIV. Lokpal cannot inquire into the allegations of corruption against a sitting Prime Minister of India.\nWhich of the statements given above is/are correct ?","options":{"a":"It only","b":"Tl and III","c":"I and IV","d":"None of the above statements is correct /56A"},"s":"polity","ca":false,"f":"Multiple statements"},{"n":99,"text":"Consider the following statements in respect of the first Kho Kho World Cup:\nI. The event was held in Delhi, India.\nII. Indian men beat Nepal with a score of 78-40 in the final to become the World Champion in men category.\nIII. Indian women beat Nepal with a score of 54-36 in the final to become the World Champion in women category.\nWhich of the statements given above is/are correct ?","options":{"a":"I only","b":"Tl and III only","c":"I and III only","d":"II and III"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":100,"text":"Consider the following statements:\nI. In the finals of the 45th Chess Olympiad held in 2024, Gukesh Dommaraju became the world’s youngest winner after defeating the Russian player Ian Nepomniachtchi.\nII. Abhimanyu Mishra, an American chess player, holds the record of becoming world’s youngest ever Grandmaster.\nWhich of the statements given above is/are correct ?","options":{"a":"I only","b":"II only","c":"Both I and II","d":"Neither I nor II"},"s":"misc","ca":true,"f":"Multiple statements"}]});
