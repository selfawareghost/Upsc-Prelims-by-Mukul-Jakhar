PYQ.register("2026", {"id":"2026","year":2026,"title":"Civil Services (Preliminary) Examination 2026","paper":"General Studies Paper I","series":"A","durationMin":120,"type":"text","key":"dacbbadaccdacbbbaddbbbddccadcbabbbbbcbbccbcbbcbbcbcabdbbacdaddaxdabacabcdbccbbcccacaacaccdacbbaccdaa","keyNote":"Provisional answer key released by UPSC after the exam.","questions":[{"n":1,"text":"Which one of the following Carnatic music ragas is similar to Raga Bilawal in Hindustani music ?","options":{"a":"Nat Bhairavi","b":"Kamavardhini","c":"Hanumatodi","d":"Dheera Shankarabharanam"},"s":"history","ca":false,"f":"Direct"},{"n":2,"text":"The artificially fixed rupee-sterling exchange rate prescribed by the Hilton-Young Commission (1926) was adopted by the British Government for which one of the following reasons ?","options":{"a":"Aiding the flow of remittances from India and maintaining India’s creditworthiness","b":"Providing support to Indian importers","c":"Encouraging export of cotton produce from India","d":"Preventing depreciation of the Rupee in terms of gold"},"s":"economy","ca":true,"f":"Direct"},{"n":3,"text":"Consider the following statements:\nI. Pali texts contain the first definite references to coins, e.g., kahapana, nikkha, kamsa, and kakanika.\nII. The literary evidence from Pali texts is corroborated by archaeological evidence of punch-marked coins from many sites, most of them made of silver. The above statements have been associated with which of the following ?\n1. Emergence of urban life\n2. Transition to money economy:\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"science","ca":true,"f":"Multiple statements"},{"n":4,"text":"Which of the following temples has/have a Nagara-style shikhara ?\n1. Malegitti Shivalaya, Badami\n2. Huchimalligudi Temple, Aihole\n3. Dashavatara Temple, Deogarh\n4. Virupaksha Temple, Pattadakal\nSelect the answer using the code given below:","options":{"a":"1 and 2","b":"2 and 3","c":"3 only","d":"3 and 4"},"s":"history","ca":false,"f":"Multiple statements"},{"n":5,"text":"Among the four main forms of existence of life recognized in Jainism, which one of the following is not included ?","options":{"a":"Deva (gods)","b":"Yaksha (demi-gods)","c":"Manushya (humans)","d":"Tiryancha (animals and plants)"},"s":"history","ca":false,"f":"Direct"},{"n":6,"text":"The Hallisalasya painting in the Bagh Caves represents:","options":{"a":"Ajoyous folk dance","b":"Buddha in a meditative pose","c":"The depiction of Shiva and Parvati on Kailasha","d":"Samudramanthan (Churning of the Ocean)"},"s":"history","ca":false,"f":"Direct"},{"n":7,"text":"Consider the following statements relating to the use of the place-value system in India:\n1. The earliest epigraphic use of the place-value system in India is found in the Mankani plates from Gujarat (AD 595 — 596).\n2. In the ninth century, place-values become general in inscriptions all over India.\n3. The place-values have been found in Sanskrit inscriptions in South-east Asia as early as the seventh century.\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"1 and 3 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"history","ca":false,"f":"Multiple statements"},{"n":8,"text":"Consider the following statements about the archaeological findings in Harappan towns:\nI. There is wide occurrence of spindle-whorls in the houses but absence of spinning wheels.\nII. Weights and measurement scales, complete with graduations have been discovered.\nIII. There are houses built in large part with baked bricks, around relatively spacious courtyards, with their own wells, bathing platforms, and large rooms.\nWhich of the following inferences can be drawn from the above statements ?\n1. Statement I suggests that spinning was a laborious activity done at home.\n2. Statement II suggests the extent of the scientific knowledge that the Harappans possessed.\n3. Statement III suggests the emergence of a common property system.\nSelect the answer using the code given below:","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"2 1, 2.and 3"},"s":"history","ca":false,"f":"Multiple statements"},{"n":9,"text":"Which one of the following statements about the Eka Movement and Bardoli Satyagraha is correct ?","options":{"a":"The Eka Movement was throughout supported and organized by the Congress while Bardoli Satyagraha was initially independent of Congress influence and was only in the last stages supported by the Congress.","b":"The Eka Movement was provided leadership by the talugdars of Awadh, whereas the Bardoli Satyagraha was a movement of the landless labourers.","c":"The Bardoli Satyagraha was a campaign against the enhancement of 1 and revenue, while the Eka Movement was a protest against excessive extraction of rents.","d":"The Eka Movement was located in the Varanasi and Mirzapur districts of the present-day U.P., while the Bardoli Satyagraha took place in Saurashtra."},"s":"history","ca":true,"f":"Direct"},{"n":10,"text":"Consider the following statements about the Rigvedic period:\nI. Irrigation from wells allowed agriculture to expand away from flood plains and strips on river margins into the present Punjab and Haryana plains having underground water levels reasonably close to the surface.\nII. Draught-animal power was employed to draw up water out of the wells.\nWhich of the following information support/supports the above statements ?\n1. There is evidence in the Rigveda of the use of ashma chakra (stone pulley wheel) and ahava (strapped wooden pails) to draw up water. Zs Mention has been made in the Rigveda of the use of implements like parashu/ kulisha (axe) and datra /sreni (sickle).\n3. There is a history of the use of ox, even before the Rigveda, for ploughing the 1 and and pulling the carts.\nSelect the answer using the code given below:","options":{"a":"I and 2 only","b":"1, 2and3","c":"I and 3 only","d":"3 only"},"s":"history","ca":false,"f":"Multiple statements"},{"n":11,"text":"Consider the following assertion: In the Pleistocene period either the Yamuna once flowed into the Indus, or the Sutlej flowed into the Yamuna and one major tributary of either had shifted from the Ganga to the Indus or vice versa.\nWhich of the following is/are the basis of the above assertion ?\n1. The Nadi-Sukta of the Rigveda\n2. The explorations of the Sutlej and the Yamuna by Robert Bruce Foote\n3. The presence of the same species of dolphins in both the Indus and the Ganga river systems\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Land ?","d":"3"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":12,"text":"What does an empty seat represent in early Buddhist iconography ?","options":{"a":"The meditation of the Buddha","b":"The Buddha’s First Sermon","c":"The Buddha’s Mahaparinibbana","d":"The Buddha’s Mahabhinishkramana"},"s":"history","ca":false,"f":"Direct"},{"n":13,"text":"Which of the following pairs of ancient and modern names of rivers is/are correctly matched ?\n1. Vitasta: Chenab\n2. Asikni; Jhelum\n3. Parushni: Ravi 4, Yavyavati: Beas\nSelect the answer using the code given below:","options":{"a":"1 and 2","b":"S8and4","c":"3 only","d":"4 only"},"s":"history","ca":false,"f":"Match / pairs"},{"n":14,"text":"Which of the following statements on the Amaravati Stupa and its relief sculpture is/are correct ?\n1. It was located in the lower Krishna valley.\n2. In India, it was next only to the Sanchi Stupa in size.\n3. The Amaravati school of sculpture made a lasting impact on the later South Indian sculpture, and its products were carried to Sri Lanka and South-east Asia.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 83 only","c":"2 and 83 only","d":"1, 2 end3"},"s":"history","ca":false,"f":"Multiple statements"},{"n":15,"text":"Which of the following pairs of the king and his dynasty in early historical Tamilakam is/are not correctly matched ?\n1. Senguttuvan: Chera\n2. Udiyanjeral: Chola\n3. Nedunjeliyan: Pandya\nSelect the answer using the code given below:","options":{"a":"1 and 2","b":"2 only","c":"1 and 3","d":"3 only"},"s":"history","ca":false,"f":"Match / pairs"},{"n":16,"text":"Which of the following factors contributed to the formation of the Forward Bloc by Subhas Chandra Bose in 1939 ?\n1. Bose failed to win the confidence of Mahatma Gandhi.\n2. The Congress Left was disunited and failed to support Bose.\n3. The Communists did not support Bose in his endeavours.\n4. The supporters of M.N. Roy and socialist leaders like Jayaprakash Narayan preferred Congress unity to supporting Bose.\nSelect the answer using the code given below:","options":{"a":"1, 2 and 3","b":"1, 2 and 4","c":"1, 8-and 4","d":"2 and 4 only"},"s":"science","ca":true,"f":"Multiple statements"},{"n":17,"text":"Consider the following statements regarding the British policy in Awadh immediately after its annexation in 1856:\n1. The talugdars were dispossessed of their estates but allowed to retain their arms and forts.\n2. A Summary Revenue Settlement was made in 1856 assuming that the taluqdars were outsiders.\n3. The British believed in taking revenue directly from the peasants by removing the taluqdars.\nWhich of the statements given above is/are correct ?","options":{"a":"2 and 83 only","b":"1 and 83 only","c":"1, 2 and 3","d":"2 only: a oo"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":18,"text":"Consider the following assertion: The genesis of political alliances based on community lay in the very nature of the Montague-Chelmsford Reforms, 1919.\nWhich of the following statements support/supports the above assertion ?\n1. Reforms retained and extended the principle of separate electorates.\n2. Separate electorates were supposed to counter Indian nationalism, which was growing stronger.\n3. Deprived classes rallied around the favours inherent in separate electorates.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 2 only","d":"1, 2 and 3"},"s":"history","ca":false,"f":"Multiple statements"},{"n":19,"text":"Pandit Mallikarjun Mansur, the famous classical singer from Karnataka, represented the:","options":{"a":"Agra Gharana","b":"Gwalior Gharana","c":"Patiala Gharana","d":"Jaipur-Atrauli Gharana"},"s":"history","ca":false,"f":"Direct"},{"n":20,"text":"In which one among the following texts does the term kshetra-patni (‘mistress of the field’) originate ?","options":{"a":"Rigveda","b":"Atharvaveda","c":"Ashtadhyayi","d":"Arthashastra"},"s":"history","ca":false,"f":"Direct"},{"n":21,"text":"Consider the following statements with reference to India’s response to climate change:\nI. India’s Long-Term Low Emission Development Strategy ( ) is a crucial tool for achieving net-zero emissions by 2070.\nII. India’s 4‘ Biennial Update Report ( ) submitted in December, 2024 recorded around 8% decrease in Greenhouse gas emissions in 2020 over 2019.\nIII. Climate-resilient development necessarily depends on quick and short-term achievement of emission reduction targets.\nWhich of the following relationships among the above statements is/are correct ?\n1. Statement I is empirically supported by statement II.\n2. Statement III contradicts the approach implicit in statement I.\n3. Statement I and statement III together establish the premise of long-term sustainability.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 2","c":"“2Qand 3","d":"8 only a aE"},"s":"environment","ca":true,"f":"Multiple statements"},{"n":22,"text":"With respect to the Western Hoolock Gibbons, which of the following statements is/are correct ?\n1. A Sanctuary in North-east India is home to this ape species listed as Endangered in the International Union for Conservation of Nature (IUCN) Red List.\n2. They have specialized brachiation and can easily swing between trees.\n3. They possess a strong and heavy build like gorillas, yet are remarkably agile tree climbers.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"3 only"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":23,"text":"Which of the following best explain(s) the rationale for protecting mangrove ecosystems in the context of climate resilience ?\n1. Mangroves reduce tidal energy and store freshwater, making them ideal sites for paddy cultivation in saline estuarine belts.\n2. Their salt-sensitive roots filter seawater, making mangroves key to converting coastal 1 and into freshwater aquaculture zones.\n3. By withstanding tidal surges and offering biomass resources, mangroves function both as natural bio-shields and livelihood bases for rural communities.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"3 only"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":24,"text":"In what way(s) does the Vizhinjam International Seaport represent a structural shift in India’s maritime trade and logistics policy ?\n1. By functioning exclusively as a domestic cargo hub to reduce reliance on coastal shipping and eliminate the need for foreign collaborations.\n2. By focusing primarily on passenger cruise tourism and heritage shipping to increase Kerala’s profile as a maritime heritage destination.\n3. By leveraging its natural deep draft and strategic location to reduce dependence on foreign trans-shipment ports, enhance revenue retention, and reposition India in regional maritime trade.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"3 only"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":25,"text":"Identify the river of the Indian sub-continent on the basis of the following information:\n1. It has an antecedent drainage system.\n2. It flows through three countries.\n3. It originates in the Tibetan Plateau and is an important river for irrigation.\n4. It does not form distributaries.\nSelect the answer from the following:","options":{"a":"Brahmaputra","b":"Indus","c":"Sutlej","d":"Teesta"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":26,"text":"Which of the following with reference to Indian States is/are not correct ?\n1. Uttar Pradesh shares its boundary with the highest number of other Indian States.\n2. Rajasthan shares the longest international border among all Indian States.\n3. Sikkim is the only State that shares its boundary with just one other Indian State.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"3 only"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":27,"text":"Which of the following statements with regard to the arrival of Amur Falcons at Doyang Lake in Nagaland each year from Mongolia is/are correct ?\n1. It showcases how sustained local conservation efforts can contribute to the arrival and .protection of international migratory birds.\n2. It reflects the global success of advanced tracking technologies that guide migratory birds back to their stopover sites.\n3. It confirms that Amur Falcons have adapted to permanent residency in India due to favourable habitat changes.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"3 only"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":28,"text":"Which among the following is/are the objective(s) of the Rainfed Area Development (RAD) initiative under the National Mission for Sustainable Agriculture (NMSA) ?\n1. Encouraging monoculture in rainfed areas\n2. Increasing rice cultivation in irrigated regions\n3. Enhancing productivity and minimising climatic risks through Integrated Farming Systems (IFS)\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"30 only"},"s":"geography","ca":true,"f":"Multiple statements"},{"n":29,"text":"Which of the following is/are the most significant implication(s) of obtaining Oeko-Tex certification for Eri Silk in the global textile industry ?\n1. It allows Indian exporters to compete in high-end markets that prioritise chemical-free products.\n2. It confirms that Eri Silk meets international safety, environmental, and quality standards, enabling its entry into premium eco-conscious markets.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both1land2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":30,"text":"Ships from which of the following countries have to cross the Strait of Hormuz to reach out to the Indian Ocean ?\n1. Bahrain\n2. Syria\n3. Qatar 4, Egypt\nSelect the answer using the code given below:","options":{"a":"1 and 2","b":"1 and 3","c":"2 and 3","d":"3 and 4"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":31,"text":"Tungurahua Volcano, which was declared a Global Geopark by UNESCO in 2025, is situated in which one among the following countries ?","options":{"a":"Ecuador","b":"Peru","c":"Bolivia","d":"Colombia"},"s":"international","ca":true,"f":"Direct"},{"n":32,"text":"With reference to Madhav National Park, which of the following statements is/are correct ?\n1. It was declared a Tiger Reserve in India in 2025.\n2. Sakhya Sagar, which is designated as a Ramsar Site, is situated within this National Park.\n3. Its area is shared between Madhya Pradesh and Rajasthan.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"3 only"},"s":"environment","ca":true,"f":"Multiple statements"},{"n":33,"text":"With reference to the climate of Andaman and Nicobar Islands, which of the following statements is/are correct ?\n1. The climate can be defined as a humid, tropical coastal climate.\n2. It receives rainfall from both South-west monsoon and North-east monsoon.\n3. Maximum precipitation is between December and May.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"3 only"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":34,"text":"Which of the following geographical features or phenomena is/are associated with the Peninsular Block of India ?\n1. Submergence of parts of the western coast due to tectonic activity:\n2. Presence of residual mountain ranges such as the Veliconda hills and Mahendragiri hills\n3. Deep, V-shaped river valleys formed by fast-flowing rivers\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"3 only"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":35,"text":"Consider the following statements with reference to the Sagarmala Programme of the Government of India:\nI. The Sagarmala Programme seeks to achieve port-led economic growth through cost-effective and sustainable coastal infrastructure.\nII. The success of the Sagarmala Programme is reflected in significant growth in coastal and inland waterway shipping, along with improved global port rankings.\nIII. Sagarmala 2.0 aims to position India as a global maritime innovation hub aligned with Atmanirbhar Bharat and Viksit Bharat 2047 visions.\nWhich of the following relationships among the above statements is/are correct ?\n1. Statement II validates the effectiveness of the strategies envisioned in statement I.\n2. Statement III extends the objectives of statement I by embedding them into a future-oriented innovation framework.\n3. Statement I contradicts statement [II by focusing only on traditional infrastructure instead of modern innovation.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 2","c":"2 and 3","d":"3 only"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":36,"text":"Consider the following statements about Rhynchostylis retusa (Foxtail orchid):\n1. It is an epiphytic orchid.\n2. The species is endemic to North-east India.\n3. It is the State flower of Arunachal Pradesh and Assam.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"1 and 3","c":"2 and 3","d":"3 only"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":37,"text":"Which one of the following statements with regard to the Moidams, built by the Tai-Ahom kingdom and inscribed as a World Heritage Site by UNESCO, is/are correct ?\n1. They acted as army fortresses.\n2. They were recreation centres of the Royals and Nobles.\n3. They were burial grounds of the Royals and Nobles.\n4. They were battle drill centres of the Royals and Nobles.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 3","c":"3 only","d":"2 and 4"},"s":"history","ca":false,"f":"Multiple statements"},{"n":38,"text":"At the United Nations Ocean Conference (UNOC) held in June, 2025 in France, the Food and Agricultural Organization (FAO) of the United Nations demonstrated its leading voice on marine and ocean issues, especially on sustainable fisheries and aquaculture for resilient livelihood and “Blue Transformation”.\nWhich of the following combinations about the “Four Betters” proposed by FAO for “Blue Transformation” is correct ?","options":{"a":"Better production, better nutrition, better environment and better ocean","b":"Better production, better nutrition, better environment and better life","c":"Better coral reefs, better nutrition, better environment and better life","d":"Better estuaries, better nutrition, better environment and better mangrove vegetation"},"s":"international","ca":true,"f":"Direct"},{"n":39,"text":"Which of the following statements with reference to Lake Turkana is/are correct ?\n1. It is the largest desert lake in the world.\n2. The lake is situated in South Sudan along the eastern fringe of the Sahara desert.\n3. The lake is listed as a UNESCO World Heritage Site and is also referred to as the ‘Jade Sea’.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"1 and 3 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"geography","ca":false,"f":"Multiple statements"},{"n":40,"text":"Which one of the following is the first Plan Vivo certified Reducing Emissions from Deforestation and Forest Degradation (REDD+) project in India ?","options":{"a":"Uttarakhand REDD+ project","b":"Transboundary REDD+ project in North-Eastern Himalayas","c":"Khasi Hills Community REDD+ project","d":"Sikkim Mamley Kamrang Community REDD+ project £a3"},"s":"environment","ca":true,"f":"Direct"},{"n":41,"text":"Which of the following statements with regard to genetic medicine is/are correct ?\n1. Genetic medicines correct/compensate for the faulty genes responsible for disease.\n2. Engineered viruses and lipid nanoparticles are used as carriers of the genetic medicine.\n3. Genetic medicines alter the entire DNA sequence. Select the answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 2 only","d":"1, 2 and 3"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":42,"text":"Which of the following statements with regard to Large Language Models (LLMs) used in machine learning is/are correct ?\n1. LLMs assign probabilities to the next possible words and then pick the one with the highest probability.\n2. LLMs process data through mathematical optimization to minimise prediction errors.\n3. LLMs produce unbiased outputs.\nSelect the answer using the code given below:","options":{"a":". 1 only","b":"1 and 2 only","c":"2 and 3 only","d":"1, 2 and 3 oo"},"s":"science","ca":true,"f":"Multiple statements"},{"n":43,"text":"Which of the following statements with regard to stealth technology is/are correct ?\n1. Stealth objects have a very small radar cross-section and are coated with Radar Absorbing Material.\n2. Stealth objects can be detected using specific frequencies.\n3. Stealth objects are coated with metamaterials to increase the scattering of electromagnetic radiation.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 2 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":44,"text":"Which of the following statements with regard to Black Boxes used in modern aircrafts is/are correct ?\n1. They carry a beacon emitting red light pulses to facilitate underwater detection.\n2. They record both the cockpit voice and flight data.\n3. Their memory units are made using either stainless steel or titanium.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 2 only","d":"1, 2 and 3"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":45,"text":"Which of the following statements with regard to Green Hydrogen is/are correct ?\n1. It is decarbonized hydrogen obtained from natural gas reforming combined with carbon capture and storage (CCS).\n2. It is produced using electrolysis of water with electricity generated by renewable energy.\n3. National Green Hydrogen Mission of India aims for abatement of nearly 50 MMT of annual greenhouse gas emissions by 2030.\nSelect the answer using the code given below:","options":{"a":"only","b":"2 and 3 only","c":"2 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":46,"text":"Consider the following statements with regard to involvement of private entities in India’s space programme:\n1. The Indian National Space Promotion and Authorisation Centre ( e) is an autonomous agency formed to facilitate participation of private entities.\n2. Agnikul Cosmos launched the world’s first flight using 3D-printed rocket engine.\n3. Skyroot Aerospace has developed liquid fuel for GSLV.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 2 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":47,"text":"Which of the following statements with regard to drone swarms is/are correct ?\n1. They use Terahertz band of frequency to communicate with the command centre.\n2. Individual drones in the swarm can communicate with other drones in the swarm.\n3. GPS Spoofing is a commonly used technique to counter drone swarm attack.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 and 83 only","c":"1 and 2 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":48,"text":"Which of the following statements with regard to the GenomeIndia Project is/are correct?\n1. It is a part of the Human Genome Project.\n2. The project is funded by the Department of Biotechnology (DBT), Government of India.\n3. Its primary aim is to build a catalogue of genetic diversity of the Indian population.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 2 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":49,"text":"Which of the following statements with regard to the National Quantum Mission (NQM) is/are correct ?\n1. It aims at developing intermediate-scale quantum computers with 50-1000 physical qubits.\n2. Its implementation includes setting up of four Thematic Hubs (T-Hubs) in academic and national R&D institutes across India.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both1 and 2","d":"Neither 1 nor 2"},"s":"science","ca":true,"f":"Multiple statements"},{"n":50,"text":"Which of the following statements with regard to India’s Deep Ocean Mission is/are correct ?\n1. It was launched by the Ministry of Ports, Shipping and Waterways, Government of India.\n2. Matsya-6000 has been designed to carry people for deep sea exploration.\n3. Samudrayaan is a project under this mission.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 2 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":51,"text":"Mr. X, a senior officer, was overseeing a critical vaccination programme during a pandemic. He found that a private service provider responsible for vaccine distribution was compromising on quality to make profits.\nDespite immense pressure to manage the issue due to vested interests, he raised his voice based on the principles of public administration which he learnt during various training programmes attended across his career. He reported the issue to the appropriate vigilance authority and halted the contract to ensure citizen welfare.\nWhich one among the following principles of public administration was most strongly demonstrated by Mr. X’s actions ?","options":{"a":"Esprit de corps","b":"Equity","c":"Accountability","d":"Delegation ek)"},"s":"science","ca":true,"f":"Direct"},{"n":52,"text":"Ina multi-ethnic district where both economic competition and historical grievances frequently led to community tensions, a flashpoint has arisen with a Government decision to allocate 1 and for a waste management facility near a tribal hamlet, sparking protests by the tribal community, which claimed that the 1 and was sacred and critical to their cultural identity. At the same time, urban residents and local industries supported the project, citing severe solid waste challenges and health concerns due to lack of a proper disposal site. The conflict has escalated with road blockades, social media campaigns, and allegations of police excesses. As a responsible Government official, you are tasked with resolving the situation through mediation, ensuring a sustainable outcome that balances environmental needs, tribal rights, and urban public health.\nConsider the following statements with reference to the above:\n1. A successful conflict resolution process must begin with acknowledging the cultural concerns of the protesting tribal community before discussing technical alternatives.\n2. The Government should move ahead with the project without delay to address urban health concerns, which outweigh the sentiments of a small group.\n3. Creating a multi-stakeholder dialogue platform — including tribal leaders, environmental experts, and municipal representatives—to build mutual understanding and help de-escalate tensions.\n4. Conducting an independent Environmental and Social Impact Assessment (ESIA) and sharing findings transparently with both sides to facilitate evidence-based decisionmaking.\nWhich of the statements given above would contribute to the resolution process ?","options":{"a":"1, 3 and 4 only","b":"2, 3 and 4 only","c":"1 and 2 only","d":"1, 2, 3 and 4"},"s":"environment","ca":true,"f":"Multiple statements"},{"n":53,"text":"Ms. X is a mid-level civil service official working in the urban development department of a major city. Recently, she was involved in approving a contract for a public infrastructure project—a new community park. During the approval process, she received a piece of confidential information indicating that one of the shortlisted contractors had a history of poor workmanship and allegations of corruption in other cities, though nothing had been legally proven. The Head of the Department, Mr. Y, advised her not to disclose this information to the project committee or the public because it could delay the project and damage the city’s reputation. However, Ms. X believed that withholding such information compromised transparency and public trust.\nWhat amongst the following should Ms. X do now ?\n1. Immediately disclose the information to the project committee and the public\n2. Recommend removing the contractor from the shortlist to protect the project’s integrity\n3. Propose a ‘limited disclosure’ to an oversight committee, while keeping the information confidential from the public for the time being\nSelect the answer using the code given below:","options":{"a":"1 and 2 only","b":"3 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":54,"text":"‘X’ was addressing a seminar on the meaning of the term ‘law’ as provided under Article 13, Part III of the Constitution of India. X’ explained that the meaning of the term ‘law’ in the Constitution of India was very comprehensive. It included ordinances, orders and even rules and regulations. ‘Y pointed out that the term ‘law’ in Article 13 also included custom or usage having in the territory of India the force of law, to which ‘X’ was not convinced. Based on the above, select the correct conclusion from the options given below:","options":{"a":"‘is correct in the interpretation of law, including the view on non-inclusion of custom.","b":"The view of ‘Y that ‘law’ included custom is not correct.","c":"The views of both ‘X’ and ‘Y’ are correct.","d":"The view of only ‘Y is correct."},"s":"polity","ca":false,"f":"Direct"},{"n":55,"text":"Consider the following statements with reference to the Constitution of India:\n1. There is no Article in the Constitution of India that specifies that the Constitution of India will be officially called the ‘Constitution of India’.\n2. There is no Article in the Constitution of India that specifies that the Indian Independence Act, 1947 and the Government of India Act, 1935 stand repealed.\n3. There is no Article in the Constitution of India that mentions 26* January, 1950 as the date of the commencement of the Constitution of India.\nWhich one of the following conclusions based on the above statements is correct ?","options":{"a":"All three statements are correct.","b":"There is no correct statement.","c":"There are two correct statements that include statement 3.","d":"There is only one correct statement."},"s":"polity","ca":false,"f":"Multiple statements"},{"n":56,"text":"Which of the following statements with regard to the persons with disabilities in India is/are correct ?\n1. The Rights of Persons with Disabilities Act, an Act passed by the Parliament of India in 2018, mandates reservation in education and employment, places a legal duty on Governments to ensure accessibility and non-discrimination.\n2. The Sugamya Bharat Abhiyan focuses on achieving universal accessibility for Persons with Disabilities across three key domains — built infrastructure, transport systems and information and communication technology.\n3. The National Divyangjan Finance and Development Corporation (NDFDC) is a public sector organisation set up by the Ministry of Corporate Affairs as a not-for-profit company to promote entrepreneurship among Persons with Disabilities (PwDs).\nSelect the answer using the code given below:","options":{"a":"1 and 2","b":"2 only","c":"1 and 3","d":"1 only"},"s":"science","ca":true,"f":"Multiple statements"},{"n":57,"text":"Consider the following statements about the provisions pertaining to the Scheduled Castes and the Scheduled Tribes in India:\n1. Provisions regarding the administration of the Tribal Areas in the States of Assam, Meghalaya, Tripura and Mizoram are given in the Fifth Schedule of the Constitution of India.\n2. Some tribes of India are entitled to exemption from paying Income Tax on certain incomes.\n3. The Constitution of India provides for reservation of seats in Panchayats for women belonging to the Scheduled Castes and the Scheduled Tribes.\nWhich one of the following conclusions based on the above statements is correct ?","options":{"a":"There are two correct statements, that include statement 2.","b":"There are two correct statements, that are statements 1 and 3.","c":"There is only one correct statement.","d":"All three statements are correct."},"s":"polity","ca":false,"f":"Multiple statements"},{"n":58,"text":"Consider the following statements in respect of questions asked by the Members in the Parliament of India:\n1. Unstarred questions are those to which a Member desires an oral answer in the House.\n2. Starred questions are those to which a Member desires a written answer.\n3. No supplementary question can be asked on an unstarred question.\nWhich one of the following c s connecting India with neighbouring countries:\n1. ‘Maitri Setu’, built over Feni river, connects Ramgarh in India with Sabroom in Bangladesh.\n2. Jhulaghat suspension bridge connects India with Myanmar.\n3. Mechi bridge and its approaches connect Panitanki Bypass in India with Kakarvitta in Nepal.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2","b":"2 and 3","c":"1 only","d":"3 only"},"s":"international","ca":true,"f":"Multiple statements"},{"n":62,"text":"Which of the following statements about a Zero First Information Report (Zero FIR) under the Bharatiya Nagarik Suraksha Sanhita (BNSS), 2023 is/are correct ?\n1. A Zero FIR can be lodged at a police station, even though the place of commission of a cognizable/non-cognizable offence is outside the territorial jurisdiction of that police station.\n2. The Officer-in-Charge of the police station where a Zero FIR has been lodged may, with the permission of the competent authority, initiate a preliminary enquiry.\n3. Under Zero FIR, it is obligatory for the informant to furnish information electronically.\nSelect the answer using the code given below:","options":{"a":"1, 2 and 3","b":"2 and 3 only","c":"1 only","d":"2 only"},"s":"science","ca":true,"f":"Multiple statements"},{"n":63,"text":"With reference to the organisations under the Government of India, consider the following details:\nOrganisation — Function — Controlling Union Ministry\n1. Central Economic Intelligence Bureau (CEIB) — To coordinate between various law enforcement agencies — Ministry of Home Affairs\n2. Serious Fraud Investigation Office (SFIO) — To investigate complex corporate frauds — Ministry of Finance\n3. Central Bureau of Investigation (CBI) — To preserve values in public life and ensure the health of the national economy — Ministry of Personnel, Public Grievances and Pensions\nIn how many of the above rows are the given details correctly matched?","options":{"a":"1","b":"2","c":"3","d":"None"},"s":"economy", red in the database may be made visible to relevant stakeholders without risk of alteration.\n2. Copies of the entire database are stored on multiple computers on a network, syncing within seconds.\n3. Consortium blockchain is a blend of public and private blockchains allowing selective data access.\n4. Mathematical algorithms make it impossible to change or delete any data once recorded and accepted.\nSelect the answer using the code given below:","options":{"a":"1 and 3","b":"2 and 4 only","c":"1, 2 and 4","d":"1 and 4 only"},"s":"science","ca":true,"f":"Multiple statements"},{"n":87,"text":"An e-commerce revenue model where the seller has control over pricing but doesn’t keep products in stock and instead transfers customer orders and shipment details to a third-party supplier, who then ships the goods directly to the customer, is called:","options":{"a":"Dropshipping Model","b":"Affiliate Revenue Model","c":"Transaction Fee Revenue Model","d":"Agency Revenue Model"},"s":"economy","ca":false,"f":"Direct"},{"n":88,"text":"Which one of the following correctly represents the three key sub-indices of the Financial Inclusion Index ( ndex) of the Reserve Bank of India (RBI) ?","options":{"a":"Credit access, Insurance depth, and Pension coverage","b":"Banking access, GDP contribution, and Financial literacy","c":"Access, Usage, and Quality","d":"Access, Affordability, and Transparency"},"s":"economy","ca":true,"f":"Direct"},{"n":89,"text":"Which one of the following best describes the key objective of India’s ‘Open Network for Digital Commerce’ (ONDC) initiative ?","options":{"a":"To allow government control over all digital commerce transactions","b":"To replace private e-commerce players","c":"To break the dominance of large e-commerce platforms by enabling interoperability across networks","d":"To mandate UPI-based payments for all online transactions"},"s":"science","ca":true,"f":"Direct"},{"n":90,"text":"Which one of the following statements about Unified Payments y for MSMEs.\nSelect the answer using the code given below:","options":{"a":"1, 2 and 3","b":"2 only","c":"2 and 3 only 94.","d":"Which 1 only one of the following best describes the ‘Crowding Out Effect’ in the context of fiscal policy ?"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":94,"text":"Which one of the following best describes the 'Crowding Out Effect' in the context of fiscal policy?","options":{"a":"A situation where private investment increases due to increased Government spending","b":"A situation where Government borrowing leads to higher interest rates, which reduces private investment","c":"A situation where an increase in taxes leads to increased private sector investment","d":"A situation where Government spending has no impact on aggregate demand"},"s":"economy","ca":false,"f":"Direct"},{"n":95,"text":"Which of the following statements about Rare Earth Elements (REEs) and Critical Minerals is/are correct ?\n1. Modern technological innovations including Artificial Intelligence, robotics and space exploration extensively utilise Rare Earth Elements (REEs).\n2. China has the highest share in mining of REEs followed by India.\n3. The Government of India launched the National Critical Mineral Mission (NCMM) in 2025 to establish a robust framework for self-reliance in the critical mineral sector.\n4. Rare Earth Elements are a set of 13 metallic elements.\nSelect the answer using the code given below:","options":{"a":"1 and 3 only","b":"3 only","c":"1, 3 and 4","d":"1, 2 and 4"},"s":"science","ca":true,"f":"Multiple statements"},{"n":96,"text":"Which of the following statements about insurance in aviation sector is/are correct ?\n1. ‘Aviation Hull Insurance’ covers the physical aircraft, including the body, engine, and on-board equipment.\n2. Under the Montreal Convention, adopted in 1999 by over 130 countries, including India, airlines are strictly liable to pay compensation to the family/fnominee of every deceased passenger without requiring the family to prove fault.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both1 and 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":97,"text":"Which of the following statements about Crowdfunding is/are correct ?\n1. Crowdfunding is solicitation of funds (small amount) from multiple investors through a web-based platform or social networking site for a specific project.\n2. Small and Medium Enterprises (SMEs) are able to raise funds at lower cost of capital without undergoing rigorous procedures.\nSelect the answer using the code given below:","options":{"a":"1 only","b":"2 only","c":"Both1land 2","d":"Neither 1 nor 2"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":98,"text":"With reference to different Committees in India, consider the following details: Sl. Committee Objective Organizatio No. under which it was formed\n1. R.N. Comprehensive Insurance Malhotra reforms of Regulatory Committee Insurance and sector in India Development Authority of India\n2. L.C. Gupta Preparing a Securities Committee roadmap for and the Exchange introduction of Board of derivatives India trading in India\n3. Urjit R. Preparing a Reserve Patel roadmap for Bank of Committee reforming bank India lending to the Housing sector\n4. Y.H. Preparing a Reserve Malegam roadmap for Bank of Committee reforms in India Microfinance sector in India In which of the above rows are all the details correctly matched ?","options":{"a":"2 only","b":"2 and 3","c":"1, 3 and 4","d":"2 and 4"},"s":"economy","ca":false,"f":"Match / pairs"},{"n":99,"text":"Consider the following statements about the Non-Banking Financial Companies (NBFCs) in India:\n1. NBFCs cannot accept demand deposits.\n2. All the NBFCs operating in India have to be registered with the RBI.\n3. NBFCs form part of the payment and settlement system and can issue cheque drawn on itself.\n4. Deposit insurance facility of Deposit Insurance and Credit Guara
