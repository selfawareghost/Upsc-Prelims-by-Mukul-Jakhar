<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mukul Jakhar, UPSC Prelims Notebook</title>
<meta name="description" content="Mukul Jakhar's notes for UPSC Civil Services Prelims GS Paper I, with previous year papers from 2011 to 2026 to read, check and attempt.">

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Prelims Notebook — a quiet, editorial study site.
   Type: Instrument Serif (display), Geist (interface), Source Serif 4 (reading)
   One accent: vermilion. Everything else is ink on white with hairlines.
   ========================================================================== */
:root {
  --bg: #fafaf8;
  --surface: #ffffff;
  --ink: #121418;
  --ink-2: #474c57;
  --muted: #8b909a;
  --line: #e7e7e3;
  --line-soft: #f0f0ec;
  --accent: #de4a26;
  --accent-ink: #b8391a;
  --accent-soft: #fcede7;
  --ok: #1c8657; --ok-soft: #e5f3ec;
  --bad: #cf3a3a; --bad-soft: #fbe9e9;
  --warn: #a86b12; --warn-soft: #fbf1df;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --ui: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --r-s: 8px; --r: 12px; --r-l: 18px;
  --wrap: 1120px;
  --bar: 64px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--bar) + 16px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--ui); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
a { color: inherit; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
#app:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { margin: 0 0 .5em; line-height: 1.15; text-wrap: balance; font-weight: 400; }
h1 { font: 400 clamp(2.4rem, 1.6rem + 3vw, 3.6rem)/1.05 var(--display); letter-spacing: -.01em; }
h2 { font: 400 clamp(1.7rem, 1.3rem + 1.2vw, 2.2rem)/1.1 var(--display); }
h3 { font: 600 1.05rem/1.3 var(--ui); }
p { margin: 0 0 1em; }
em { font-style: italic; }

.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
.page { padding-top: 48px; padding-bottom: 96px; }
.narrow { max-width: 760px; }
.lede { font-size: 1.125rem; color: var(--ink-2); max-width: 62ch; }
.fine { font-size: .875rem; color: var(--muted); }
.meta { color: var(--muted); font-size: .9rem; }
.loading, .empty { color: var(--muted); padding: 28px 0; }

/* ------------------------------------------------------------ header/footer */
.site-header { position: sticky; top: 0; z-index: 20; background: rgba(250, 250, 248, .82); backdrop-filter: saturate(160%) blur(12px); -webkit-backdrop-filter: saturate(160%) blur(12px); border-bottom: 1px solid var(--line); }
.site-header .wrap { display: flex; align-items: center; gap: 24px; min-height: var(--bar); }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-mark { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.brand-name { font: 400 1.45rem/1 var(--display); }
.site-nav { margin-left: auto; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.site-nav::-webkit-scrollbar { display: none; }
.site-nav a { text-decoration: none; color: var(--ink-2); padding: 8px 14px; border-radius: 999px; font-size: .94rem; white-space: nowrap; transition: background .2s var(--ease), color .2s; }
.site-nav a:hover { color: var(--ink); background: var(--line-soft); }
.site-nav a[aria-current] { color: var(--ink); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.site-footer { border-top: 1px solid var(--line); padding: 32px 0 48px; color: var(--muted); font-size: .9rem; }
.site-footer p { margin: 0; }
body.in-exam .site-header, body.in-exam .site-footer { display: none; }

/* ----------------------------------------------------------------- buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 .95rem var(--ui); text-decoration: none; cursor: pointer; transition: transform .15s var(--ease), background .2s, border-color .2s, box-shadow .2s; }
.btn:hover { border-color: #cfcfca; box-shadow: 0 2px 10px rgba(18, 20, 24, .06); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .ico { width: 16px; height: 16px; }
.btn-primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn-primary:hover { background: #262a31; border-color: #262a31; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--line-soft); box-shadow: none; border-color: transparent; }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-small { min-height: 34px; padding: 0 14px; font-size: .85rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0; }
.icon-only { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 0; background: none; color: var(--ink-2); border-radius: 50%; cursor: pointer; }
.icon-only:hover { background: var(--line-soft); color: var(--ink); }
.link-arrow { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; color: var(--ink-2); font-size: .94rem; }
.link-arrow:hover { color: var(--accent); }
.link-arrow .ico { width: 16px; height: 16px; }

/* -------------------------------------------------------------------- home */
.hero { padding-top: clamp(56px, 10vw, 120px); padding-bottom: 56px; }
.kicker { display: inline-flex; align-items: center; gap: 10px; font-size: .88rem; color: var(--ink-2); padding: 6px 14px 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); margin-bottom: 28px; }
.kicker .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.display { font-size: clamp(3.2rem, 2rem + 6vw, 6.4rem); line-height: .95; letter-spacing: -.025em; margin-bottom: 24px; }
.display em { color: var(--accent); }
.hero .lede { font-size: clamp(1.1rem, 1rem + .4vw, 1.3rem); }
.glance-title { margin: 64px 0 0; padding-bottom: 12px; font-size: .82rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.glance { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 0; border-top: 1px solid var(--line); }
.glance div { padding: 18px 20px 0 0; }
.glance div + div { padding-left: 20px; border-left: 1px solid var(--line); }
.glance dt { font-size: .82rem; color: var(--muted); }
.glance dd { margin: 2px 0 0; font: 400 2.2rem/1.1 var(--display); font-variant-numeric: tabular-nums; }

.band { padding-top: 64px; padding-bottom: 8px; }
.band-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.band-head h2 { margin: 0; }
.band-head p { margin: 0; color: var(--muted); font-size: .92rem; }

.subject-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.subject-card { position: relative; display: flex; flex-direction: column; height: 100%; min-height: 200px; padding: 22px 22px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); text-decoration: none; transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; }
.subject-card:hover { transform: translateY(-3px); border-color: #dcdcd6; box-shadow: 0 14px 34px -18px rgba(18, 20, 24, .28); }
.sc-num { font: 400 1rem var(--display); color: var(--accent); margin-bottom: 26px; }
.subject-card h3 { font: 400 1.65rem/1.1 var(--display); margin-bottom: 8px; }
.subject-card p { color: var(--ink-2); font-size: .92rem; margin-bottom: 18px; }
.sc-meta { margin-top: auto; font-size: .8rem; color: var(--muted); }

.year-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-link { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; font-size: .95rem; font-variant-numeric: tabular-nums; transition: background .2s, color .2s, border-color .2s; }
.chip-link:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip-soft:hover { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent-ink); }

/* --------------------------------------------------------------- syllabus */
.syllabus-sheet { margin: 32px 0 48px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; }
.ss-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 20px 24px; border-bottom: 1px solid var(--line); }
.ss-head h2 { margin: 0; font-size: 1.6rem; }
.ss-head p { margin: 0; color: var(--muted); }
.syllabus-list { margin: 0; padding: 0; list-style: none; counter-reset: syl; }
.syllabus-list li { counter-increment: syl; display: grid; grid-template-columns: 40px 1fr; column-gap: 8px; padding: 18px 24px; border-bottom: 1px solid var(--line-soft); }
.syllabus-list li:last-child { border-bottom: 0; }
.syllabus-list li::before { content: counter(syl, decimal-leading-zero); grid-row: span 2; font: 400 1rem var(--display); color: var(--accent); padding-top: 2px; }
.syllabus-list p { margin: 0; font: 1.05rem/1.55 var(--read); }
.syl-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px !important; font-family: var(--ui) !important; }
.syl-links a { font-size: .82rem; text-decoration: none; padding: 3px 10px; border-radius: 999px; background: var(--line-soft); color: var(--ink-2); }
.syl-links a:hover { background: var(--accent-soft); color: var(--accent-ink); }
.page h2 { margin-top: 8px; }

/* ---------------------------------------------------------------- subjects */
.subject-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 56px; align-items: start; }
.subject-nav { position: sticky; top: calc(var(--bar) + 24px); max-height: calc(100vh - var(--bar) - 48px); overflow: auto; padding-right: 6px; }
.sn-title { display: block; font: 400 1.5rem/1.1 var(--display); text-decoration: none; margin-bottom: 16px; }
.sn-list, .sn-topics { list-style: none; margin: 0; padding: 0; }
.sn-sec { display: block; padding: 7px 12px; border-radius: var(--r-s); text-decoration: none; color: var(--ink-2); font-size: .94rem; }
.sn-sec:hover { background: var(--line-soft); color: var(--ink); }
.sn-sec[aria-current] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); font-weight: 500; }
.sn-ca { color: var(--accent-ink); }
.sn-topics { margin: 4px 0 10px 14px; border-left: 1px solid var(--line); }
.sn-topics a { display: block; padding: 4px 12px; font-size: .86rem; color: var(--muted); text-decoration: none; }
.sn-topics a.is-ready { color: var(--ink-2); }
.sn-topics a:hover { color: var(--ink); }
.sn-topics a[aria-current] { color: var(--accent-ink); box-shadow: inset 2px 0 0 var(--accent); }
.sec-block { margin-top: 44px; }
.sec-block h2 a { text-decoration: none; }
.sec-block h2 a:hover { color: var(--accent); }
.topic-list { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid var(--line); }
.topic-list a { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: baseline; padding: 14px 6px; border-bottom: 1px solid var(--line); text-decoration: none; transition: background .2s; }
.topic-list a:hover { background: var(--surface); }
.tl-n { font: 400 .95rem var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-title { font-size: 1rem; }
.tl-status { font-size: .8rem; color: var(--muted); }
.is-ready .tl-status { color: var(--accent-ink); font-weight: 500; }
.is-ready .tl-n { color: var(--accent); }
.crumbs { display: flex; flex-wrap: wrap; gap: 8px; font-size: .88rem; color: var(--muted); margin-bottom: 18px; }
.crumbs a { text-decoration: none; color: var(--ink-2); }
.crumbs a:hover { color: var(--accent); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 64px; }
.pager a { text-decoration: none; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); transition: border-color .2s; }
.pager a:hover { border-color: var(--ink); }
.pager a span { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 2px; }
.pg-next { text-align: right; }

.prose { font: 1.1rem/1.75 var(--read); max-width: 68ch; }
.prose a { color: var(--accent-ink); }
.prose h2 { margin-top: 1.8em; font-size: 1.8rem; }
.prose h3 { margin-top: 1.5em; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin-bottom: .35em; }
.prose table { width: 100%; border-collapse: collapse; margin: 1.4em 0; font: .95rem/1.5 var(--ui); display: block; overflow-x: auto; }
.prose th, .prose td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose th { font-weight: 600; color: var(--ink-2); font-size: .85rem; }
.prose .note-box, .prose .trap { font: .98rem/1.6 var(--ui); padding: 14px 18px; border-radius: var(--r); margin: 1.4em 0; }
.prose .note-box { background: var(--line-soft); }
.prose .trap { background: var(--accent-soft); color: #5e2413; }
.prose .note-box > :last-child, .prose .trap > :last-child { margin-bottom: 0; }

.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 28px 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; padding: 8px 16px; border-radius: 999px; text-decoration: none; color: var(--ink-2); font-size: .92rem; border: 1px solid transparent; }
.tabs a:hover { background: var(--line-soft); }
.tabs a[aria-current] { background: var(--ink); color: #fff; }
.tabs .ico { width: 16px; height: 16px; }
.tab-title { font-size: 1.8rem; }
.ca-month { margin-top: 32px; }
.ca-month > h2 { font: 600 .82rem var(--ui); letter-spacing: .02em; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.ca-entry { padding: 14px 0; }

/* ------------------------------------------------------------------ papers */
.paper-list { list-style: none; margin: 36px 0 0; padding: 0; display: grid; gap: 10px; }
.paper-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 16px; align-items: center; padding: 14px 16px 14px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); transition: border-color .2s; }
.paper-row:hover { border-color: #d6d6d0; }
.pr-year { font: 400 2rem/1 var(--display); font-variant-numeric: tabular-nums; }
.pr-name { display: block; font-weight: 500; font-size: .95rem; }
.pr-status { display: block; font-size: .82rem; color: var(--muted); }
.pr-actions { display: flex; gap: 6px; }
.icon-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 999px; text-decoration: none; font-size: .88rem; color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; transition: all .2s; }
.icon-btn .ico { width: 17px; height: 17px; }
.icon-btn:hover { color: var(--ink); border-color: var(--ink); }
.icon-btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.icon-btn-primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.paper-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-bottom: 18px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
.paper-head h1 { margin: 0; }
.paper-head h1 span { font: 400 1rem var(--ui); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.paper-head .tabs { margin: 0; }
.h-small { font-size: 1.6rem; margin-top: 48px; }
.jump { position: sticky; top: var(--bar); z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 0; margin-bottom: 8px; background: rgba(250, 250, 248, .92); backdrop-filter: blur(8px); }
.jump label { font-size: .9rem; color: var(--ink-2); }
.jump select { min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font: inherit; font-size: .9rem; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.notice { padding: 14px 18px; border-radius: var(--r); background: var(--line-soft); }
.notice-warn { background: var(--warn-soft); color: #5b3a08; }
.key-grid { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.key-cell { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); }
.kc-q { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.key-cell.is-dropped { background: var(--warn-soft); border-color: transparent; }
.key-cell abbr { text-decoration: none; font-size: .72rem; font-weight: 600; color: var(--warn); }
.mode-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 32px; }
.mode { display: flex; flex-direction: column; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); }
.mode h2 { font-size: 1.9rem; }
.mode p { color: var(--ink-2); flex: 1; }
.mode .btn { align-self: flex-start; }

/* ------------------------------------------------------------------ bubble */
.bubble { display: inline-grid; place-items: center; flex: none; width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 1.5px solid #cfd0d4; background: var(--surface); color: var(--ink-2); font: 500 .78rem/1 var(--ui); transition: background .15s, border-color .15s, color .15s, transform .15s var(--ease); }
button.bubble { cursor: pointer; }
button.bubble:hover { border-color: var(--ink); color: var(--ink); }
button.bubble:active { transform: scale(.9); }
.bubble.is-filled, .bubble[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

/* -------------------------------------------------------------------- exam */
.exam { min-height: 100vh; background: var(--bg); }
.exam-bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 10px 20px; min-height: var(--bar); background: rgba(250, 250, 248, .9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); user-select: none; -webkit-user-select: none; }
.eb-title { white-space: nowrap; }
.eb-title strong { font: 400 1.6rem/1 var(--display); }
.eb-title span { color: var(--muted); font-size: .88rem; margin-left: 6px; }
.timer { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font: 500 1.05rem var(--ui); font-variant-numeric: tabular-nums; }
.timer .ico { width: 17px; height: 17px; color: var(--muted); }
.timer.is-low { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.timer.is-low .ico { color: var(--bad); }
.timer.is-off { font-size: .88rem; color: var(--ink-2); }
.eb-actions { margin-left: auto; display: flex; gap: 8px; }
.btn-sheet { display: none; }

.ink-bar, .ink-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ink-tools[hidden] { display: none; }
.tool-seg { display: flex; align-items: center; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.tool { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 36px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--ink-2); font: 500 .88rem var(--ui); cursor: pointer; }
.tool-seg .tool { padding: 0; }
.tool .ico { width: 18px; height: 18px; }
.tool:hover { background: var(--line-soft); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--ink); color: #fff; }
.tool-toggle { border: 1px solid var(--line); background: var(--surface); }
.swatch { width: 24px; height: 24px; margin: 3px; padding: 0; border-radius: 50%; border: 0; background: var(--sw); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.swatch:disabled { opacity: .3; cursor: not-allowed; }
.size { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; cursor: pointer; }
.size span { width: var(--d); height: var(--d); border-radius: 50%; background: var(--muted); }
.size[aria-pressed="true"] { background: var(--line-soft); }
.size[aria-pressed="true"] span { background: var(--ink); }

.exam-body { display: grid; grid-template-columns: minmax(0, 1fr) 296px; gap: 24px; max-width: 1320px; margin: 0 auto; padding: 24px; align-items: start; }
.booklet { display: grid; gap: 20px; justify-items: center; }
.pen-hint { position: fixed; top: calc(var(--bar) + 12px); left: 50%; transform: translateX(-50%); z-index: 32; padding: 8px 16px; border-radius: 999px; background: var(--ink); color: #fff; font-size: .86rem; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); max-width: calc(100% - 32px); text-align: center; }
.pen-hint[hidden] { display: none; }
.booklet-end { text-align: center; padding: 28px; color: var(--muted); }

.qsheet { width: 100%; max-width: 860px; padding: 8px 40px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); }
.qsheet-read { max-width: 820px; }
.qcard { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px; padding: 28px 0; border-bottom: 1px solid var(--line-soft); scroll-margin-top: calc(var(--bar) + 72px); }
.qcard:last-child { border-bottom: 0; }
.q-no { font: 400 1.35rem/1.4 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.q-text { font: 1.06rem/1.7 var(--read); white-space: pre-line; overflow-wrap: anywhere; }
.q-opts { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 4px; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; margin-left: -10px; padding: 7px 10px; border: 0; border-radius: var(--r); background: none; text-align: left; font: 1rem/1.55 var(--read); color: var(--ink); }
.opt .bubble { width: 26px; height: 26px; font-size: .72rem; margin-top: -1px; }
.opt-text { padding-top: 1px; overflow-wrap: anywhere; }
button.opt { cursor: pointer; transition: background .15s; }
button.opt:hover { background: var(--line-soft); }
button.opt[aria-pressed="true"] { background: var(--line-soft); }
button.opt[aria-pressed="true"] .bubble { background: var(--ink); border-color: var(--ink); color: #fff; }
.opt.is-key { background: var(--ok-soft); }
.opt.is-key .bubble { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.is-wrong { background: var(--bad-soft); }
.opt.is-wrong .bubble { background: var(--bad); border-color: var(--bad); color: #fff; }
.qcard.is-dropped .q-opts::after { content: "Dropped by UPSC"; font: 600 .78rem var(--ui); color: var(--warn); padding: 4px 0; }
.q-flag { font-size: .78rem; color: var(--muted); margin: 10px 0 0; }
.qcard .ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: multiply; }
.exam.pen-on .qcard .ink { pointer-events: auto; cursor: crosshair; touch-action: none; }

.sheet { position: sticky; top: calc(var(--bar) + 24px); max-height: calc(100vh - var(--bar) - 48px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); }
.omr-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; background: var(--surface); }
.omr-title { margin: 0; font: 400 1.35rem/1 var(--display); }
.omr-count { margin-left: auto; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.omr-close { display: none; }
.omr-hint { margin: 0; padding: 0 18px 12px; font-size: .76rem; color: var(--muted); border-bottom: 1px solid var(--line-soft); }
.omr-rows { list-style: none; margin: 0; padding: 8px 12px 14px; }
.omr-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.omr-row:nth-child(5n) { padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px dashed var(--line); }
.omr-q { width: 40px; min-height: 32px; padding-right: 8px; border: 0; border-radius: var(--r-s); background: none; text-align: right; font: 500 .82rem var(--ui); color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.omr-q:hover { color: var(--accent); }
.omr-row.is-answered .omr-q { color: var(--ink); }
.omr-row .bubble { width: 28px; height: 28px; font-size: .72rem; }

/* ------------------------------------------------------------------ result */
.result-head { display: grid; grid-template-columns: minmax(260px, .9fr) minmax(0, 1.1fr); gap: 20px; margin: 8px 0 14px; }
.score-card { padding: 28px; border-radius: var(--r-l); background: var(--ink); color: #fff; }
.score-label { margin-bottom: 8px; font-size: .88rem; color: rgba(255,255,255,.65); }
.score { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; }
.score-num { font: 400 clamp(3.6rem, 3rem + 3vw, 5rem)/1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.score-max { color: rgba(255,255,255,.65); }
.score-meta { margin: 0; font-size: .9rem; color: rgba(255,255,255,.75); }
.breakdown { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; font-variant-numeric: tabular-nums; }
.breakdown th, .breakdown td { padding: 12px 18px; text-align: left; font-weight: 400; border-bottom: 1px solid var(--line-soft); }
.breakdown thead th { font-size: .78rem; color: var(--muted); }
.breakdown .num { text-align: right; }
.breakdown tr.is-correct td:last-child { color: var(--ok); font-weight: 600; }
.breakdown tr.is-wrong td:last-child { color: var(--bad); font-weight: 600; }
.breakdown tfoot th, .breakdown tfoot td { border-bottom: 0; font-weight: 600; }

.review { margin-top: 64px; }
.review-grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 5px; max-width: 780px; margin: 18px 0 12px; }
.rg-cell { aspect-ratio: 1; min-width: 0; border: 0; border-radius: 6px; font: 500 .72rem var(--ui); cursor: pointer; font-variant-numeric: tabular-nums; transition: transform .15s var(--ease); }
.rg-cell:hover { transform: scale(1.08); }
.rg-cell.is-correct, .lg.is-correct { background: var(--ok); color: #fff; }
.rg-cell.is-wrong, .lg.is-wrong { background: var(--bad); color: #fff; }
.rg-cell.is-blank, .lg.is-blank { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.rg-cell.is-dropped, .lg.is-dropped { background: var(--warn-soft); color: var(--warn); }
.legend { list-style: none; margin: 0 0 24px; padding: 0; display: flex; flex-wrap: wrap; gap: 16px; font-size: .84rem; color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.lg { display: inline-block; width: 12px; height: 12px; border-radius: 4px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font: 500 .86rem var(--ui); color: var(--ink-2); cursor: pointer; }
.chip span { margin-left: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip[aria-pressed="true"] span { color: rgba(255,255,255,.6); }
.rv-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rv-row { display: grid; grid-template-columns: 50px auto minmax(0, 1fr) 64px auto; gap: 16px; align-items: center; padding: 12px 14px 12px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); transition: background .4s; }
.rv-row[hidden] { display: none; }
.rv-row.is-flash { background: var(--accent-soft); }
.rv-q { font: 400 1.3rem var(--display); }
.rv-bubbles { display: flex; gap: 4px; }
.rv-bubbles .bubble { width: 24px; height: 24px; font-size: .68rem; }
.rv-bubbles .bubble.is-key { border-color: var(--ok); color: var(--ok); }
.rv-bubbles .bubble.is-right { background: var(--ok); border-color: var(--ok); color: #fff; }
.rv-bubbles .bubble.is-wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
.rv-text { display: flex; flex-direction: column; min-width: 0; }
.rv-status { font-weight: 600; font-size: .9rem; }
.is-correct .rv-status { color: var(--ok); }
.is-wrong .rv-status { color: var(--bad); }
.is-dropped .rv-status { color: var(--warn); }
.rv-detail { font-size: .82rem; color: var(--muted); }
.rv-marks { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.rv-question { grid-column: 1 / -1; margin-top: 4px; padding: 0 18px; border-radius: var(--r); background: var(--bg); }
.rv-question[hidden] { display: none; }
.rv-question .qcard { padding: 18px 0; border: 0; }

/* ---------------------------------------------------------- empty state */
.empty-state { margin-top: 32px; padding: 36px; border: 1px dashed #d8d8d2; border-radius: var(--r-l); background: var(--surface); }
.empty-state p { color: var(--ink-2); margin: 0; max-width: 56ch; }
.empty-state .es-title { font: 400 1.9rem/1.1 var(--display); color: var(--ink); margin-bottom: 8px; }
.empty-state a { color: var(--accent-ink); }

/* -------------------------------------------------------- paper overview */
.ov-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.ov-stats div { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.ov-stats span { display: block; font-size: .78rem; color: var(--muted); }
.ov-stats strong { display: block; font: 400 2.1rem/1.15 var(--display); font-weight: 400; }
.ov-stats .ov-top { font-size: 1.35rem; line-height: 1.25; padding-top: 6px; }
.ov-stats em { font-style: normal; font-size: .8rem; color: var(--ink-2); }
.ov-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.ov-card { padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); min-width: 0; }
.ov-wide { grid-column: 1 / -1; }
.ov-card h2 { font-size: 1.55rem; margin: 0 0 18px; }
.ov-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.ov-head h2 { margin: 0; }
.ov-head .fine { margin: 0; }
.ov-key { list-style: none; margin: 0; padding: 0; display: flex; gap: 14px; font-size: .82rem; color: var(--ink-2); }
.ov-key li { display: flex; align-items: center; gap: 6px; }
.ov-key i, .ov-legend i, .hb-label i, .ov-list i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.k-static { background: var(--ink); }
.k-ca { background: var(--accent); }
.hbars { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.hbar { display: grid; grid-template-columns: 210px minmax(0, 1fr) 70px; gap: 14px; align-items: center; }
.hb-label { display: flex; align-items: center; gap: 8px; font-size: .92rem; }
.hb-track { height: 14px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
.hb-fill { display: flex; height: 100%; border-radius: 999px; overflow: hidden; animation: grow .8s var(--ease) both; transform-origin: left; }
.hb-static { background: var(--ink); }
.hb-ca { background: var(--accent); }
.hb-num { font: 400 1.4rem/1 var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.hb-num small { display: block; font: .7rem var(--ui); color: var(--muted); margin-top: 2px; }
@keyframes grow { from { transform: scaleX(0); } }
.donut-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.donut { width: 150px; height: 150px; }
.donut-num { font: 400 30px var(--display); fill: var(--ink); }
.donut-lbl { font: 10px var(--ui); fill: var(--muted); }
.ov-key-col { flex-direction: column; gap: 10px; font-size: .9rem; }
.ov-key-col b { margin-left: 6px; font-weight: 600; }
.vbars { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: end; height: 190px; }
.vbars-4 { grid-template-columns: repeat(4, 1fr); }
.vbar { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; min-width: 0; }
.vb-num { font: 400 1.2rem/1 var(--display); }
.vb-col { flex: 1; width: 100%; max-width: 44px; display: flex; align-items: flex-end; border-radius: 8px; background: var(--line-soft); overflow: hidden; }
.vb-col span { display: block; width: 100%; background: var(--ink); border-radius: 8px; animation: rise-h .8s var(--ease) both; }
.vb-key span { background: var(--accent); }
.vb-label { font-size: .7rem; color: var(--muted); text-align: center; line-height: 1.2; min-height: 2.4em; }
@keyframes rise-h { from { transform: scaleY(0); transform-origin: bottom; } }
.qmap { display: grid; grid-template-columns: repeat(20, 1fr); gap: 5px; }
.qm-cell { position: relative; aspect-ratio: 1; display: grid; place-items: center; border-radius: 6px; background: var(--c); color: #fff; font: 500 .66rem var(--ui); opacity: .88; }
.qm-cell.is-ca::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: #fff; }
.ov-legend { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .82rem; color: var(--ink-2); }
.ov-legend li { display: flex; align-items: center; gap: 6px; }
.ov-list { border-top: 1px solid var(--line-soft); }
.ov-list summary { display: flex; align-items: center; gap: 10px; padding: 12px 0; cursor: pointer; list-style: none; font-size: .95rem; }
.ov-list summary::-webkit-details-marker { display: none; }
.ov-list summary span { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.ov-list p { margin: 0 0 14px 20px; font-size: .88rem; color: var(--ink-2); line-height: 1.8; }
.ov-note { margin-top: 18px; }
@media (max-width: 900px) { .ov-grid { grid-template-columns: 1fr; } .hbar { grid-template-columns: 130px minmax(0,1fr) 54px; } .ov-stats { grid-template-columns: repeat(3, 1fr); } }

/* ------------------------------------------------------------ modal, toast */
.modal-wrap { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(18, 20, 24, .4); backdrop-filter: blur(3px); animation: fade .2s var(--ease); }
.modal { width: min(440px, 100%); padding: 28px; background: var(--surface); border-radius: var(--r-l); box-shadow: 0 30px 80px -20px rgba(0,0,0,.35); animation: pop .25s var(--ease); }
.modal h2 { font-size: 1.9rem; }
.modal-body { color: var(--ink-2); }
.modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 90; transform: translateX(-50%); padding: 12px 20px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 500; box-shadow: 0 16px 40px -12px rgba(0,0,0,.4); animation: rise .25s var(--ease); transition: opacity .4s, transform .4s; }
.toast.is-out { opacity: 0; transform: translate(-50%, 8px); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }

/* -------------------------------------------------------------- responsive */
@media (max-width: 960px) {
  .subject-layout { grid-template-columns: 1fr; gap: 12px; }
  .subject-nav { position: static; max-height: none; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .sn-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .sn-topics { display: none; }
  .result-head { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .exam-body { grid-template-columns: 1fr; padding: 12px; }
  .btn-sheet { display: inline-flex; }
  .sheet { position: fixed; top: auto; left: 0; right: 0; bottom: 0; z-index: 35; max-height: 72vh; border-radius: var(--r-l) var(--r-l) 0 0; transform: translateY(105%); transition: transform .3s var(--ease); box-shadow: 0 -20px 50px -20px rgba(0,0,0,.3); }
  .exam.sheet-open .sheet { transform: none; }
  .omr-close { display: inline-grid; }
  .review-grid { grid-template-columns: repeat(10, 1fr); }
  .rv-row { grid-template-columns: 44px minmax(0, 1fr) auto; row-gap: 8px; }
  .rv-bubbles { grid-column: 2 / -1; grid-row: 1; }
  .rv-text { grid-column: 1 / 3; }
  .rv-marks { grid-column: 3; grid-row: 2; }
  .rv-row .btn { grid-column: 1 / -1; justify-self: start; }
}
@media (max-width: 680px) {
  .wrap { padding-left: 18px; padding-right: 18px; }
  .page { padding-top: 32px; }
  .glance { grid-template-columns: repeat(2, 1fr); }
  .glance div, .glance div + div { padding: 14px 0 12px; border-left: 0; border-bottom: 1px solid var(--line-soft); }
  .glance div:nth-child(even) { padding-left: 16px; border-left: 1px solid var(--line); }
  .ov-stats { grid-template-columns: repeat(2, 1fr) !important; }
  .qmap { grid-template-columns: repeat(10, 1fr) !important; }
  .paper-row { grid-template-columns: 1fr; gap: 10px; padding: 16px; }
  .pr-actions { flex-wrap: wrap; }
  .icon-btn { flex: 1; justify-content: center; }
  .mode-pick { grid-template-columns: 1fr; }
  .qsheet { padding: 0 16px; border-radius: var(--r); }
  .qcard { grid-template-columns: 34px minmax(0, 1fr); }
  .eb-title span, .tool span:not(.sr) { display: none; }
  .site-header .wrap { flex-wrap: wrap; gap: 0; padding-top: 10px; }
  .site-nav { margin-left: -10px; width: calc(100% + 10px); padding-bottom: 6px; }
  .site-nav a { padding: 8px 10px; font-size: .88rem; }
  .brand-name { font-size: 1.25rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

<script>
/* Core: data registries, small helpers, icons, modal, toast.
   Data files (papers, notes, current affairs) call PYQ.register / NOTES.register / CA.register. */
(function () {
  'use strict';

  function registry() {
    return { data: {}, register: function (id, obj) { this.data[id] = obj; } };

  var esc = function (s) {

  var paths = {

    key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M15.5 7.5l2.5 2.5M13 10l1.5 1.5"/>',

    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    sheet: '<path d="M5 3h14v18H5z"/><path d="M8 8h8M8 12h8M8 16h5"/>',

    clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
    chevronL: '<path d="M15 5l-7 7 7 7"/>',
    chevronR: '<path d="M9 5l7 7-7 7"/>',
    flag: '<path d="M6 21V4M6 4h11l-2 4 2 4H6"/>',

  function icon(name) {
    return '<svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + (paths[name] || '') + '</svg>';
  }

  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function monthLabel(ym) {
    var p = String(ym).split('-');
    return (MONTHS[(+p[1] || 1) - 1] || '') + ' ' + p[0];
  }

  /* Accessible modal. Returns a close function. */
  function modal(opts) {
    var wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">' +
      '<h2 id="modalTitle">' + esc(opts.title) + '</h2>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      '<div class="modal-actions">' +
      (opts.cancel === false ? '' : '<button type="button" class="btn" data-m="cancel">' + esc(opts.cancel || 'Cancel') + '</button>') +
      '<button type="button" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-m="ok">' + esc(opts.confirm || 'OK') + '</button>' +
      '</div></div>';
    var prev = document.activeElement;
    document.body.appendChild(wrap);
    wrap.querySelector('[data-m="ok"]').focus();

    function close() {
      wrap.remove();
      document.removeEventListener('keydown', onKey, true);
      if (prev && prev.focus && prev.isConnected) prev.focus();
    }
    function onKey(e) {
      if (e.key === 'Escape' && opts.cancel !== false) { e.stopPropagation(); close(); if (opts.onCancel) opts.onCancel(); }
      if (e.key === 'Tab') {
        var f = wrap.querySelectorAll('button');
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      e.stopPropagation();
    }
    document.addEventListener('keydown', onKey, true);
    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]');
      if (!b) {
        if (e.target === wrap && opts.cancel !== false) { close(); if (opts.onCancel) opts.onCancel(); }
        return;
      }
      close();
      if (b.dataset.m === 'ok') { if (opts.onConfirm) opts.onConfirm(); }
      else if (opts.onCancel) opts.onCancel();
    });
    return close;
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add('is-out'); }, 3200);
    setTimeout(function () { t.remove(); }, 3700);
  }

  window.UI = { esc: esc, icon: icon, modal: modal, toast: toast, monthLabel: monthLabel };
})();

PYQ.register("2011", {"id":"2011","year":2011,"title":"Civil Services (Preliminary) Examination 2011","paper":"General Studies Paper I","series":"A","durationMin":120,"type":"text","key":"bdabcacbbddacbdddbacbbabcddbacbacdbbcddcdbdadddcdcbddbdcacbaddacaababbbbabcdabbaddaddbbaabcccaccbbbc","keyNote":"Official answer key released by UPSC.","questions":[{"n":1,"text":"In the Union Budget 2011-12, a full exemption from the basic customs duty was extended to the bio-based asphalt (bioasphalt). What is the importance of this material ?\n1. Unlike traditional asphalt, — bioasphalt is not based on fossil fuels.\n2. Bioasphalt can be made from nonrenewable resources.\n3. Bioasphalt can be made from organic waste materials.\n4. It ts eco-friendly to use bioasphalt for surfacing of the roads.\nWhich of the statements given above are correct ?","options":{"a":"1, 2 and 3 only","b":"1. 3 and 4 only","c":"2 and 4 only","d":"1, 2, 3 and 4"},"s":"economy","ca":true,"f":"Multiple statements"},{"n":2,"text":"Consider the following:\n1. Carbon dioxide\n2. Oxides of Nitrogen\n3. Oxides of Sulphur\nWhich of the above is/are the emission/ emissions from coal combustion at thermal power plants ?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3 P- -— A"},"s":"environment","ca":true,"f":"Multiple statements"},{"n":3,"text":"Satellites used for telecommunication relay are kept in a geostationary orbit, A satellite is said to be om such an orttt when:\n1. The orbit is geosynchronous.\n2. The orbit is circular.\n3. The orbit lies in the plane of the Earth’s equator.\n4. The orbit is at an altitude of 22, 236 km.\nSelect the correct answer using the codes given below:","options":{"a":"1, 2 and 3 only","b":"1, 3 and 4 only","c":"2 and 4 only","d":"L. 2. 3 und"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":4,"text":"India has experienced persistent and high food inflation im the scent past. What could be the reasons ?\n1. Due to a gradual switchover to the cultivation of commercial crops the area under the cultivation of food grains has steadily decreased in the last five years by about 30%.\n2. As a consequence of increasing incomes, the consumption patterns of the people have undergone a significant change.\n3. The food supply chair has structural constraints,\nWhich of the statements given above are correct ?","options":{"a":"1 and 2 only","b":"2 and 3 only","c":"1 and 3 only","d":"t, 2 and 3"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":5,"text":"At present, scientists can determine the arrangement or relative positions of genes or DNA sequences on a chromosome. How does this knowledge benefit us?\n1. It is possible to know the pedigree of livestock.\n2. It is possible to understand the causes of all human diseases.\n3. It is possible to develop disease-resistant animal breeds.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2 only","b":"2 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":6,"text":"In terms of economy, the visit by foreign nationals to witness the XIX Common Wealth Games in India amounted to","options":{"a":"Export","b":"Import","c":"Production","d":"Consumption"},"s":"economy","ca":false,"f":"Direct"},{"n":7,"text":"Microbial fuel cells are considered a source of sustainable energy. Why ?\n1. They use living organisms as catalysts to generate electricity from certain substrates.\nP- -- A a\n2. They use a variety of inorganic: materials as substrates.\n3. They can be installed in waste water treatment plants to cleanse water and produce electricity.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":8,"text":"Which one of the following statements appropriately describes the “fiscal stimulus”","options":{"a":"It is a massive investment by the Government in manufacturing sector to ensure the supply of goods to meet the demand surge caused by rapid economic growth","b":"It is an intense affirmative action of the Government to boost economic activity in the country","c":"It is Government's intensive action on financial institutions to ensure disbursement of loans to agriculture and allied sectors to promote greater food production and contain food inflation","d":"It is an extreme affirmative action by the Government to pursue its: policy of financial inclusion i"},"s":"economy","ca":false,"f":"Direct"},{"n":9,"text":"The formation of ozone hole in the Antarctic region has been a cause of concern. What could be the reason for the formation of this hole ?","options":{"a":"Presence of prominent tropospheric turbulence and inflow of chlorofluorocarbons","b":"Presence of prominent polar front and stratospheric clouds and inflow of chlorofluorocarbons","c":"Absence of polar front and stratospheric clouds and inflow of methane and chlorofluorocarbons","d":"Increased temperature at polar region due to global warming"},"s":"environment","ca":false,"f":"Direct"},{"n":10,"text":"Consider the following actions which the Government can take:\n1. Devaluing the domestic currency.\n2. Reduction in the export subsidy.\n3. Adopting suitable policies which attract greater FD] and more funds from Fils.\nWhich of the above action/actions can help in reducing the current account deficit ?","options":{"a":"} and 2","b":"2 and 3","c":"3 only","d":"$ and 3 P"},"s":"economy","ca":false,"f":"Multiple statements"},{"n":11,"text":"The Constitution (Seventy -Third Amendment) Act, 1992. which aims at promoting the Panchayati Raj Institutions in the country, provides for which of the following ?\n1. Constitution of District Planning Committees.\n2. State Election Commissions to conduct all panchayat elections.\n3. Establishment of State Finance Commissions.\nSelect the correct answer using the codes given below:","options":{"a":"I only","b":"1 and 2 only","c":"2 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":true,"f":"Multiple statements"},{"n":12,"text":"Two important rivers -- one with its source in Jharkhand (and known by a different name in Odisha), and another, with its source in Odisha - merge at a place only a short distance from the coast of Bay of Bengal before flowing into the sea. This is an important site of wildlife and biodiversity and a protected area. Which one of the’ following could be this ?","options":{"a":"Bhitarkanika","b":"Chandipur-on-sea","c":"Gopalpur-on-sea","d":"Simlipal"},"s":"environment","ca":false,"f":"Direct"},{"n":13,"text":"A rapid increase in the rate of inflation is sometimes attributed to the “base effect”. What is “base effect” ?","options":{"a":"It is the impact of drastic deficiency in supply due to failure of crops","b":"It is the impact of the surge in demand due to rapid economic growth","c":"It is the impact of the price levels of previous year on the calculation of inflation rate","d":"None of the statements (a), (b) and (c) given above is correct in this context"},"s":"economy","ca":false,"f":"Direct"},{"n":14,"text":"India is regarded as a country with “Demographic Dividend”. This is due to","options":{"a":"Its high population in the age group below 15 years","b":"Its high population in the age group of 15-64 years","c":"Its high population in the age group above 65 years","d":"Its high total population"},"s":"geography","ca":false,"f":"Direct"},{"n":15,"text":"Regarding “carbon credits”, which one of the following statements is not correct ?","options":{"a":"The carbon credit system was ratified in conjunction with the Kyoto Protocol","b":"Carbon credits are awarded to countries or groups that have reduced greenhouse gases below their emission quota","c":"The goal of the carbon credit system is to limit the increase of carbon dioxide emission","d":"Carbon credits are traded at a price fixed from time to time by the United Nations Environment Programme"},"s":"environment","ca":true,"f":"Direct"},{"n":16,"text":"Which one of the following is not a feature of “Value Added Tax” ?","options":{"a":"It is a multi-point destination-based system of taxation","b":"It is a tax levied on value addition at each stage of transaction in the production-distribution chan","c":"{tis a tax on the final consumption of goods or services and must ultimately be borne by the consumer","d":"It is basically a subject of the Central Government and the State Governments are only a facilitator for its successful implementation"},"s":"economy","ca":false,"f":"Direct"},{"n":17,"text":"A “closed economy” is an economy in which","options":{"a":"the money supply ts fully controlled","b":"deficit financing takes place","c":"only exports take place","d":"neither exports nor imports take place"},"s":"economy","ca":false,"f":"Direct"},{"n":18,"text":"When the bark of a tree is removed in a circular fashion all around near its base, it gradually dries up and dies because","options":{"a":"Water from soil cannot rise to aerial parts","b":"Roots are starved of energy","c":"Tree is infected by soil microbes","d":"Roots do not receive oxygen for respiration"},"s":"environment","ca":false,"f":"Direct"},{"n":19,"text":"The “New START” treaty was in the news. What ts this treaty ?","options":{"a":"It 1s a bilateral strategic nuclear arms reduction treaty between the USA and the Russian Federation","b":"it is a multilateral energy security cooperation treaty among the members of the East Asia Summit","c":"It 1s a treaty between the Russian Federation and the European Union for the energy security cooperation","d":"It ts a multilateral cooperation treaty among the BRICS countries for the promotion of trade"},"s":"international","ca":true,"f":"Direct"},{"n":20,"text":"Three of the following criteria have contributed to the recognition of Western Ghats-Sri Lanka and Indo Burma Regions as hotspots of biodiversity:\n1. Species redness\n2. Vegetation density\n3. Endemsm\n4. Ethno-botanical! importance\n5. Threat perception\n6. Adaptanon of flora and fauna to warm and humid conditions\nWhich three of the above are correct criteria in this context ’","options":{"a":"1. 2 and 6","b":"2, 4 and 6","c":"1, 3 and 5","d":"3, 4 and 6 P"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":21,"text":"Human activities in the recent past have caused the increased concentration of carbon dioxide in the atmosphere, but a lot of it does not remain in the lower atmosphere because of\n1. its escape into the outer Strata- sphere.\n2. the photosynthesis by phytoplankton in the oceans.\n3. the trapping of air in the polar ice caps.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2","b":"2 only","c":"2 and 3","d":"3 only"},"s":"geography","ca":true,"f":"Multiple statements"},{"n":22,"text":"In the context of ecosystem productivity, marine upwelling zones are important as they increase the marine productivity by bringing the\n1. decomposer microorganisms to the surface.\n2. nutrients to the surface.\n3. bottom-dwelling organisms to the surface.\nWhich of the statements given above is/are correct ?","options":{"a":"1 and 2","b":"2 only","c":"2 and 3","d":"3 only 10"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":23,"text":"If a tropical rain forest is removed, it does not regenerate quickly as compared to tropical deciduous forest. This is because","options":{"a":"the soil of rain forest is deficient in nutrients","b":"propagates of the trees in a rain forest have poor viability","c":"the rain forest species are slowgrowing","d":"exotic species invade the fertile soil of rain forest"},"s":"environment","ca":false,"f":"Direct"},{"n":24,"text":"The Himalayan Range is very rich in species diversity. Which one among the following is the most appropriate reason for this phenomenon ?","options":{"a":"[t has a high rainfall ? that supports luxuriant vegetative growth","b":"[t ts u confluence of different zoogeographical zones","c":"Exotic and invasive species have not been introduced in this region","d":"[t has less human interference"},"s":"environment","ca":false,"f":"Direct"},{"n":25,"text":"With reference to India, consider the following Central Acts.\n1. Import and Export (Control) Act, 1947\n2. Mining and Mineral Development (Reguiaton) Act, 1957 3 Customs Act, 1962\n4. indian Forest Act, 1927 P- A A a er re\nWhich of the above Acts have relevance to/bearing on the biodiversity conservation in the country ?","options":{"a":"1 and 3 only","b":"2, 3 and 4 only","c":"1, 2, 3 and 4","d":"None of the above Acts"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":26,"text":"Karl Marx explained the process of class struggle with the help of which one of the following theories ?","options":{"a":"Empirical liberalism","b":"Existentialism","c":"Darwin's theory of evolution","d":"Dialectical materialism"},"s":"misc","ca":true,"f":"Direct"},{"n":27,"text":"A layer in the Earth’s atmosphere called ionosphere facilitates radio communication. Why ?\n1. The presence of ozone causes the reflection of radio waves to Earth.\n2. Radio waves have a very long wavelength.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither nor 2"},"s":"science","ca":true,"f":"Multiple statements"},{"n":28,"text":"Both Foreign Direct Investment (FDI) and Foreign Institutional Investor (FIL) are related to investment in a country.\nWhich one of the following statements best represents an important difference between the two ?","options":{"a":"FII helps bring better management skills and technology, while FDI only brings in capital","b":"FI helps in increasing capital availability in general, while FDI only targets specific sectors","c":"FDI flows only into the secondary market while FII targets primary market","d":"FIL is considered to be more stable than FDI"},"s":"economy","ca":false,"f":"Direct"},{"n":29,"text":"A genetically engineered form of brinjul, known as the Bt-brinjal, has been developed. The objective of this ts","options":{"a":"Lo make it pest-resistant","b":"To improve its taste and nutritive qualities","c":"To make it drought-resistant","d":"To make its shelf-life longer"},"s":"science","ca":true,"f":"Direct"},{"n":30,"text":"With reference to “Aam Admi Bima Yojana”, consider the following state meets:\n1. The member insured under the scheme must be the head of the family or an earning member of the family in a rural landless household.\n2. The member insured must be in the age group of 30 to 65 years.\nP-\n3. There is a provision for free scholarship for up to two children of the insured who are studying between classes 9 and 12.\nWhich of the statements given above is/are correct ?","options":{"a":"only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"history","ca":true,"f":"Multiple statements"},{"n":31,"text":"In the context of global ot} prices, “Brent crude oil” is frequently referred to in the news. What does this term imply ?\n1. It is a major classification of crude oil.\n2. [t is sourced from North Sea.\n3. It does not contain sulphur.\nWhich of the statements given above is/are correct ?","options":{"a":"2 only","b":"1 and 2 only","c":"1! and 3 only","d":"1. 2 and 3"},"s":"geography","ca":true,"f":"Multiple statements"},{"n":32,"text":"The function of heavy water in a nuclear reactor is to","options":{"a":"Slow down the speed of neutrons","b":"Increase the speed of neutrons","c":"Cool down the reactor","d":"Stop the nuclear reaction"},"s":"science","ca":true,"f":"Direct"},{"n":33,"text":"In India, if a religious sect/community is given the status of a national minority, what special advantages it is entitled to ?\n1. It can establish and administer exclusive educational institutions.\n2. The President of India automatically nominates a representative of the community to Lok Sabha.\n3. It can derive benefits from the Prime Minister's 15-Point Programme.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3"},"s":"polity","ca":true,"f":"Multiple statements"},{"n":34,"text":"India is home to lakhs of persons with disabilities. What are the benefits available to them under the law ?\n1. Free schooling till the age of 18 years in government-run schools.\n2. Preferenua! allotment of 1 and for setting up business.\n3. Ramps in public buildings.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 and 3 only","c":"1 and 3 only","d":"1, 2 and 3 P"},"s":"misc","ca":true,"f":"Multiple statements"},{"n":35,"text":"With what purpose is the Government of India promoting the concept of “Mega Food Parks” ?\n1. To provide govd — infrastructure facilities for the food processing mdustry.\n2. To increase the processing of perishable items and _— reduce wastage.\n3. To provide emerging and ecofriendly food processing technologies to entrepreneurs.\nSelect the correct answer using the codes given below:","options":{"a":"1 only","b":"1 and 2 only","c":"2 and 3 only","d":"1. 2 and 3"},"s":"science","ca":true,"f":"Multiple statements"},{"n":36,"text":"The authorization for the withdrawal of funds from the Consolidated Fund of India must come from","options":{"a":"The President of india","b":"The Parliament of India","c":"The Prime Minister of India","d":"The Union Finance Minister"},"s":"polity","ca":false,"f":"Direct"},{"n":37,"text":"All revenues received by the (Union Government by way of taxes and other receipts for the conduct of Government business are credited tu the","options":{"a":"Contingency Fund of India","b":"Public Account","c":"Consolidated Fund of India","d":"Deposits and Advances Fund"},"s":"economy","ca":false,"f":"Direct"},{"n":38,"text":"Microfinance is the provision of financial services to people of low-income groups. This includes both the consumers and the self-employed. The service/services rendered under n over the increase in harmful algal blooms in the seawater of india. What could be the causative factors for this phenomenon ?\n1. Discharge of nutrients from the estuaries.\n2. Run-off from the 1 and during the THONSOON.\n3. L:swelling in the seas.\nSelect the correct answer from the codes given below:","options":{"a":"1 only","b":"and 2 only","c":"2 and 3 only","d":"*, 2 and 3"},"s":"general-science","ca":false,"f":"Multiple statements"},{"n":48,"text":"Consider the following:\n1. Photosynthesis\n2. Respiration\n3. Decay of organic matter 4 Volcanic action\nWhich of the above add carbon dioxide to the carbon cycle on Earth ?","options":{"a":"and 4 only","b":"2 and 3 only","c":"2. 3 and 4 only —","d":"b. 2. 3 and 4"},"s":"environment","ca":false,"f":"Multiple statements"},{"n":49,"text":"Recently, the USA decided to support India’s membership in multi-lateral export control regimes called the “Australia Group” and the “Wassenaar Arrangement”. What is the difference between them ?\nP- 1. The Australia Group is an informal arrangement which aims to allow exporting countries to minimize the risk of assisting chemical and biological weapons proliferation, whereas the Wassenaar Arrangement is a formal group under the OECD holding identical objectives.\n2. The Australia Group comprises predominantly of Asian, African and North American countries, whereas the member countries of Wassenaar Arrangement are predominantly from the European Union and American continents.\nWhich of the statements given above is/are correct ?","options":{"a":"1 only","b":"2 only","c":"Both 1 and 2","d":"Neither 1 nor 2"},"s":"international","ca":true,"f":"Direct"},{"n":50,"text":"The surface of a lake is frozen in severe winter, but the water at its bottom is still liquid. What is the reason ?","options":{"a":"Ice is a bad conductor of heat","b":"Since the surface of the lake is at the same temperature as the air, no heat is lost","c":"The density of water is maximum at 4°C","d":"None of the statements (a), (b) and"},"s":"geography","ca":false,"f":"Direct"},{"n":51,"text":"A sandy and saline area is the natural habitat of an Indian animal species. The animal has no predators in that area but its existence is threatened due to the destruction of its habitat. Which one of the following could be that animal ?","options":{"a":"Indian wild buffalo","b":"Indian wild ass","c":"Indian wild boar","d":"Indian gazelle"},"s":"environment","ca":false,"f":"Direct"},{"n":52,"text":"Lua Ninu is suspected to have caused recent floods in Australia. How is La Nina different from El Nino ?\n1. La Nina ts characterized by un usually cold ocean temperature in equatorial Indian Ocean whereas E} Nino is characterized by unusually warm Ocean temperature in the equatorial Pacific Ocean.\n2. Ei Nino thas adverse effect on south-west monsoon of India, but La Nina has no effect on monsoon climate.\nWhich of the statements given above is/are correct ?","options":{"a":"only","b":"2 only","c":"Both and ?","d":"Neither 1 nor 2"},"s":"geography","ca":true,"f":"Multiple statements"},{"n":53,"text":"The tendency for released litigation was visible after the introduction of the 1 and settlement system of Lord Cornwallis in 1793. The reason for this is normally traced to which of the following provisions ?\nP- SSS","options":{"a":"Making Zamindar’s position stronger vis-a-vis the ryot","b":"Making East India Company an overlord of Zamindars","c":"Making judicial system more efficient","d":"None of the (a), (b) and (c) above"},"s":"history","ca":false,"f":"Direct"},{"n":54,"text":"Which one of the following observations 1s mot true about the Quit India Movement of 1942 ?","options":{"a":"It was a non-violent movement","b":"It was ted by Mahatma Gandhi","c":"It was a spontaneous movement","d":"It did not attract the tabour class in general}"},"s":"history","ca":false,"f":"Direct"},{"n":55,"text":"Which amongst the following provided a common factor for tubal insurrection in India in the 19th ce
